kind = "web"
previewPath = "/"
title = "Moscow Noivas"
version = "1.0.0"
id = "artifacts/moscow-noivas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25188

[services.development]
# App real é o Next.js (Moscow Noivas) em /app — ver memória app-real-e-o-nextjs-legado.
# O Vite (este pacote) foi aposentado; este comando agora sobe o Next na webview (25188).
run = "bash -c 'cd app && npm run dev -- -p 25188 -H 0.0.0.0'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moscow-noivas", "run", "build" ]
publicDir = "artifacts/moscow-noivas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25188"
BASE_PATH = "/"
