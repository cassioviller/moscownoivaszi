kind = "web"
previewPath = "/"
title = "Moscow Noivas"
version = "1.0.0"
id = "artifacts/moscow-noivas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25188

[services.development]
run = "pnpm --filter @workspace/moscow-noivas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moscow-noivas", "run", "build" ]
publicDir = "artifacts/moscow-noivas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25188"
BASE_PATH = "/"
