packages:
  # A6/E104 — `mockup-sandbox` CONTINUA no workspace, e a parte 3 errou ao tirá-lo.
  #
  # A parte 3 escreveu `- "!artifacts/mockup-sandbox"` aqui, dizendo preservar o
  # `[[services]]` do Canvas. **Tirar do workspace É tirar do alcance do
  # `--filter`**, e o Canvas roda exatamente isso
  # (`.replit-artifact/artifact.toml:17`):
  #
  #     run = "pnpm --filter @workspace/mockup-sandbox run dev"
  #     $ …  →  No projects matched the filters in "/home/runner/workspace"
  #
  # Ou seja: a implementação destruiu o único ativo que a decisão do dono existia
  # para preservar. Num clone novo o pacote também não receberia `pnpm install`,
  # então nem rodar por dentro da pasta salvaria.
  #
  # O custo real do pacote nunca foi o workspace: era o **typecheck**. Ele sai de
  # lá pelo filtro do script `typecheck` no `package.json` da raiz, que é onde o
  # custo morava — e o Canvas continua subindo.
  #
  # E a razão que a fase A deu para tirá-lo era falsa: ela dizia que ele QUEBRA o
  # `pnpm run build` da raiz. A raiz quebra sem `PORT`/`BASE_PATH` **de qualquer
  # jeito** — `moscow-noivas/vite.config.ts:11` tem o `throw` idêntico. E o
  # `[services.env]` do `artifact.toml` define as duas: elas nunca faltaram para
  # quem roda o preview.
  #
  # Se um dia ficar claro que ninguém abre o preview, a poda é um `rm -rf` — e aí
  # morrem junto as 4 cópias divergentes de `ui/` (incluindo um `calendar.tsx`
  # que não recebeu o conserto do S19). Isso é a sobra S23, não este arquivo.
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

