        repetir quem já foi procurado. Idempotente: o segundo clique não
        reescreve o primeiro carimbo.


        Este endpoint se chamava `/confirmar` e carimbava `confirmadoEm` — o
        MESMO campo que o portal usa quando a noiva confirma de verdade (E85).
        Os dois sentidos ficavam indistinguíveis, e a linha sumia da fila e do
        sino como se a noiva tivesse respondido. Abrir o WhatsApp é ato da loja
