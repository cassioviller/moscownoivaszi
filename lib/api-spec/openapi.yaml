openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Moscow Noivas API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: admin
  - name: equipe
  - name: convites
  - name: catalogo
  - name: vestidos
  - name: leads
  - name: agenda
  - name: reservas
  - name: orcamentos
  - name: contratos
  - name: financeiro
  - name: comissao
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ───────────────────────── Auth ─────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessao"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessao"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/senha:
    post:
      operationId: trocarSenha
      tags: [auth]
      summary: A própria pessoa troca a própria senha (E57)
      description: >
        Exige a senha ATUAL: uma sessão sequestrada não pode virar troca de
        senha. Ao trocar, TODAS as sessões da pessoa caem — inclusive a de quem
        soubesse a senha antiga — e a de quem trocou é reemitida, para ela não
        ser deslogada por se proteger. Limpa `precisaTrocarSenha`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrocarSenhaInput"
      responses:
        "204":
          description: Senha trocada
        "401":
          description: Não autenticado
        "422":
          description: Senha atual incorreta (SENHA_ATUAL_INCORRETA) ou nova igual à atual (SENHA_REPETIDA)
  /auth/selecionar-loja:
    post:
      operationId: selecionarLoja
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelecionarLojaInput"
      responses:
        "200":
          description: Loja selecionada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessao"

  # ───────────────────────── Admin ─────────────────────────
  /admin/lojas:
    get:
      operationId: listLojas
      tags: [admin]
      responses:
        "200":
          description: List of lojas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loja"
    post:
      operationId: createLoja
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LojaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loja"
  /admin/lojas/{lojaId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    patch:
      operationId: updateLoja
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LojaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loja"
    delete:
      operationId: deleteLoja
      tags: [admin]
      responses:
        "204":
          description: Deleted
  /admin/perfis:
    get:
      operationId: listPerfis
      tags: [admin]
      responses:
        "200":
          description: List of perfis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Perfil"
    post:
      operationId: createPerfil
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
  /admin/perfis/{perfilId}:
    parameters:
      - name: perfilId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updatePerfil
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
    delete:
      operationId: deletePerfil
      tags: [admin]
      responses:
        "204":
          description: Deleted
  /admin/usuarios:
    get:
      operationId: listUsuarios
      tags: [admin]
      responses:
        "200":
          description: >-
            List of usuarios. Cada um traz as lojas vinculadas (E61) — o
            console responde "essa pessoa entra onde?" sem abrir loja a loja.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioComLojas"
    post:
      operationId: createUsuario
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
  /admin/usuarios/{usuarioId}:
    parameters:
      - name: usuarioId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateUsuario
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
    delete:
      operationId: deleteUsuario
      tags: [admin]
      responses:
        "204":
          description: Deleted
  /admin/lojas/{lojaId}/overrides:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listPerfilOverrides
      tags: [admin]
      responses:
        "200":
          description: List of overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerfilOverrideLoja"
    put:
      operationId: setPerfilOverride
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilOverrideInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilOverrideLoja"

  /admin/lojas/{lojaId}/overrides/{perfilId}:
    delete:
      operationId: deletePerfilOverride
      tags: [admin]
      summary: Restaura o perfil ao modelo global — remove o override da loja
      description: >
        E60: uma vez personalizado, o perfil ficava preso ao override — não
        havia caminho de volta. Remover o override devolve o perfil ao template
        global e, como qualquer mudança de permissão (E56), derruba as sessões
        vivas de quem tem esse perfil na loja e deixa rastro na auditoria.
      parameters:
        - $ref: "#/components/parameters/LojaIdParam"
        - name: perfilId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Override removido; o perfil volta ao modelo global
        "404":
          description: Este perfil não tem personalização nesta loja

  /admin/backup:
    get:
      operationId: getBackupStatus
      tags: [admin]
      summary: Status do backup do sistema — quando foi o último e o histórico recente
      description: >
        A visão do SRE (E30): o backup é o dump do banco INTEIRO, um evento de
        infraestrutura sem dono de loja — por isso vive no gate superadmin. A
        tela lê daqui o "último backup: há X horas" e a lista das últimas
        execuções (ok, erro ou em andamento).
      responses:
        "200":
          description: Último backup + execuções recentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatus"
    post:
      operationId: runBackup
      tags: [admin]
      summary: Dispara um backup manual agora
      description: >
        Roda o pg_dump na hora e devolve a linha registrada. Mesmo motor da
        rotina agendada; muda só o gatilho (manual) e o autor (quem apertou).
      responses:
        "200":
          description: Registro do backup executado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupLog"

  /admin/backup/{backupId}/download:
    get:
      operationId: downloadBackup
      tags: [admin]
      summary: Baixa o arquivo do dump de um backup concluído
      description: >
        Fecha o ciclo do E30: saber que o backup existe não protege contra a
        perda da instância — a cópia precisa SAIR dela. Devolve o dump
        comprimido (.sql.gz) em streaming. 404 quando a execução não existe;
        410 quando o registro existe mas o arquivo já foi podado pela retenção
        (só os dumps mais recentes ficam no disco).
      parameters:
        - name: backupId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: O dump comprimido, como download
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "404":
          description: Execução de backup não encontrada
        "410":
          description: O arquivo deste backup já foi removido pela retenção

  # ───────────────────────── Equipe ─────────────────────────
  /lojas/{lojaId}/equipe:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listEquipe
      tags: [equipe]
      responses:
        "200":
          description: Equipe da loja
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembroEquipe"
    post:
      operationId: addMembroEquipe
      tags: [equipe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembroEquipeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembroEquipe"
  /lojas/{lojaId}/equipe/{usuarioId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: usuarioId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateMembroEquipe
      tags: [equipe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembroEquipeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembroEquipe"
    delete:
      operationId: removeMembroEquipe
      tags: [equipe]
      responses:
        "204":
          description: Removed

  /lojas/{lojaId}/equipe/convites:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listConvitesEquipe
      tags: [equipe]
      description: "Convites PENDENTES (não usados, não expirados). O token sai aqui de propósito: é o admin quem monta e copia o link."
      responses:
        "200":
          description: Convites pendentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Convite"
    post:
      operationId: createConviteEquipe
      tags: [equipe]
      description: >
        Convite por link: o admin manda o link pelo WhatsApp e a própria pessoa
        define a senha — ninguém mais digita a senha do colega. Vale 7 dias,
        uso único. E-mail já membro da loja → 409 CONVIDADO_JA_E_MEMBRO;
        convite pendente do mesmo e-mail → 409 CONVITE_PENDENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConviteInput"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"

  /lojas/{lojaId}/equipe/convites/{conviteId}/reenviar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: conviteId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reenviarConviteEquipe
      tags: [equipe]
      description: "Regenera token e validade — o link antigo morre (desejável se vazou no WhatsApp errado)."
      responses:
        "200":
          description: Convite renovado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"

  /lojas/{lojaId}/equipe/convites/{conviteId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: conviteId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: cancelarConviteEquipe
      tags: [equipe]
      responses:
        "204":
          description: Cancelado

  # Rotas PÚBLICAS do convite — sem sessão: quem tem o token (256 bits) é a
  # capability. Token via QUERY/corpo, nunca no path: o log de request grava o
  # path e o token não pode cair em log.
  /lojas/{lojaId}/equipe/atividade:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getAtividadeEquipe
      tags: [equipe]
      summary: Log de atividade da equipe — últimos acessos e ações sensíveis
      description: >
        A visão da dona (E18): quando cada membro entrou pela última vez
        (carimbo de login — sessões somem no logout) e quantas ações sensíveis
        fez nos últimos 30 dias, mais o feed recente do audit_log da loja.
        Mesmo gate admin da gestão de equipe.
      responses:
        "200":
          description: Resumo por membro + eventos recentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtividadeEquipe"
  /captacao/leads:
    post:
      operationId: captarLead
      tags: [leads]
      security: []
      summary: Captação externa (E19) — formulário do site/Instagram cria o lead
      description: >
        Rota PÚBLICA: o token da loja (gerido em Configurações, em query — o
        logger corta a query e ele não cai em log) é a credencial. O lead nasce
        NOVO com a origem informada; hoje todo lead nasce digitado à mão na
        loja — este é o primeiro que chega sozinho.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptacaoLeadInput"
      responses:
        "201":
          description: Lead criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptacaoLeadResultado"
        "404":
          description: Token desconhecido (captação desligada ou rotacionada)
  /lojas/{lojaId}/captacao/token:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getCaptacaoToken
      tags: [leads]
      description: O token vigente da captação externa (null = desligada). Gate admin.
      responses:
        "200":
          description: Token vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptacaoToken"
    post:
      operationId: rotacionarCaptacaoToken
      tags: [leads]
      description: >
        Gera (ou rotaciona) o token da captação. O anterior morre na hora —
        formulário antigo para de criar lead. Gate admin.
      responses:
        "200":
          description: Token novo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptacaoToken"
  /equipe/convites/info:
    get:
      operationId: getConviteInfo
      tags: [convites]
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "O que a convidada precisa ver antes de aceitar"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvitePublico"
        "404":
          description: Token desconhecido
        "410":
          description: Convite expirado ou já utilizado

  /equipe/convites/aceitar:
    post:
      operationId: aceitarConvite
      tags: [convites]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AceitarConviteInput"
      responses:
        "200":
          description: >
            Aceito. E-mail novo: usuário criado com a senha enviada e sessão
            aberta (cookie). E-mail já cadastrado: só o vínculo com a loja é
            criado, SEM sessão — o portador do link não provou ser o dono da
            conta; jaTinhaConta=true manda o front ao login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AceitarConviteResultado"
        "404":
          description: Token desconhecido
        "410":
          description: Convite expirado ou já utilizado

  # ───────────────────────── Catálogo (Atributos) ─────────────────────────
  /lojas/{lojaId}/atributos:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listAtributos
      tags: [catalogo]
      responses:
        "200":
          description: List of atributos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Atributo"
    post:
      operationId: createAtributo
      tags: [catalogo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtributoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Atributo"
  /lojas/{lojaId}/atributos/{atributoId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: atributoId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAtributo
      tags: [catalogo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtributoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Atributo"
    delete:
      operationId: deleteAtributo
      tags: [catalogo]
      responses:
        "204":
          description: Deleted
  /lojas/{lojaId}/atributos/{atributoId}/opcoes:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: atributoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createAtributoOpcao
      tags: [catalogo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtributoOpcaoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtributoOpcao"
  /lojas/{lojaId}/atributos/opcoes/{opcaoId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: opcaoId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAtributoOpcao
      tags: [catalogo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtributoOpcaoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtributoOpcao"
    delete:
      operationId: deleteAtributoOpcao
      tags: [catalogo]
      responses:
        "204":
          description: Deleted

  # ───────────────────────── Vestidos ─────────────────────────
  /lojas/{lojaId}/vestidos:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listVestidos
      tags: [vestidos]
      responses:
        "200":
          description: List of vestidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vestido"
    post:
      operationId: createVestido
      tags: [vestidos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VestidoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vestido"
  /lojas/{lojaId}/vestidos/disponibilidade:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: checkDisponibilidadeVestidos
      tags: [vestidos]
      summary: Disponibilidade de todos os vestidos da loja para uma data de casamento
      parameters:
        - name: data
          in: query
          required: true
          description: Data do casamento candidata (dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Disponibilidade por vestido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisponibilidadeVestidos"
  /lojas/{lojaId}/vestidos/utilizacao:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getUtilizacaoVestidos
      tags: [vestidos]
      summary: Utilização por vestido — provas, reservas e contratos no período
      description: >
        O relatório de encalhe e de estrela: TODOS os vestidos do acervo, cada
        um com quantas provas, reservas ativas e contratos gerou no período (e
        a receita dos contratos). Zeros aparecem de propósito — o vestido sem
        uso é a resposta de "o que sai de linha".
      parameters:
        - name: de
          in: query
          required: false
          description: Início do período (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do período (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Uma linha por vestido do acervo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VestidoUtilizacao"
        "400":
