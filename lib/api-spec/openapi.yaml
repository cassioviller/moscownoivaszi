      responses:
        "204":
          description: Deleted
  /lojas/{lojaId}/leads/{leadId}/exportar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: leadId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: exportarDadosLead
      tags: [leads]
      summary: Tudo que o sistema sabe sobre a noiva, num JSON (LGPD)
      description: >
        E77: o direito de acesso — a noiva pede, a loja entrega. Lead,
        interesses, contatos registrados, orçamentos, contratos e parcelas
        dela, num arquivo só, como download.
      responses:
        "200":
          description: Os dados da noiva, JSON para download
          content:
