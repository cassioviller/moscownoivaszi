          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo de vencimento (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
