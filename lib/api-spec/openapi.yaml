      description: >
        A página que a noiva abre sem login. Token em QUERY (o logger corta a
        query — não cai em log). As URLs das fotos saem da rota pública irmã,
        escopadas ao MESMO token.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
