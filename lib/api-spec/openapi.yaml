          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Planilha CSV (UTF-8 com BOM)
          content:
            text/csv:
              schema:
                type: string

  /lojas/{lojaId}/contas-pagar/{contaId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contaId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeContaPagar
      tags: [financeiro]
      summary: Remove uma conta a pagar ainda PREVISTA e sem dono
      description: >
        Só contas PREVISTAS podem ser removidas — uma conta PAGA é rastro de
        caixa e precisa ser estornada antes (POST …/pagamentos/{id}/estornar).


        E94/B8: a conta nascida de um fechamento de comissão
        (`origemComissaoFechamentoId`) também é recusada, com
        `CONTA_DE_COMISSAO`. A FK do fechamento é ON DELETE SET NULL, então
        apagá-la zerava o vínculo em silêncio: a vendedora não recebia,
        `pendencias` não acusava (o fechamento continua existindo) e reabrir não
        reparava, porque as guardas do reabrir dependem do vínculo. O caminho
        para desfazer é reabrir o fechamento.
      responses:
        "204":
          description: Removida
        "404":
          description: Conta não encontrada
        "409":
          description: >
            Conta já paga (CONTA_JA_PAGA) ou gerada por fechamento de comissão
            (CONTA_DE_COMISSAO)
  /lojas/{lojaId}/contas-pagar/{contaId}/pagar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contaId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: pagarContaPagar
      tags: [financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagarContaInput"
      responses:
        "200":
          description: Paga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContaPagar"
  /lojas/{lojaId}/financeiro/alerta-caixa:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getAlertaCaixa
      tags: [financeiro]
      summary: O veredito da projeção — o caixa fica negativo no horizonte?
      description: >
        A mesma conta da tela de Projeção reduzida ao que faz alguém agir: o
        primeiro dia negativo e o piso da curva, partindo do saldo de HOJE
        (âncora + realizado desde ela). Existe para o dashboard e o hub de fluxo
        não terem de baixar parcelas, contas, saldos e pagamentos inteiros só
        para descobrir isso. Sem saldo de referência devolve `ancorado: false` e
        nada mais — curva sem nível não sustenta alarme.
      responses:
        "200":
          description: Veredito do caixa no horizonte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertaCaixa"
  /lojas/{lojaId}/financeiro/pagamentos:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listPagamentos
      tags: [financeiro]
      summary: Caixa realizado — saídas efetivamente pagas
      parameters:
        - name: de
          in: query
          required: false
          description: Início do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: colaboradorId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of pagamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pagamento"
        "400":
          description: Intervalo inválido
    post:
      operationId: createPagamento
      tags: [financeiro]
      summary: Uma saída de caixa que quita uma ou mais contas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagamentoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagamento"
        "404":
          description: Alguma conta não existe na loja (CONTA_NAO_ENCONTRADA)
        "409":
          description: Alguma conta já está paga (CONTA_JA_PAGA)
  /lojas/{lojaId}/financeiro/pagamentos/{pagamentoId}/estornar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: pagamentoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: estornarPagamento
      tags: [financeiro]
      summary: Desfaz a saída de caixa e devolve as contas para PREVISTA
      responses:
        "204":
          description: Estornado
        "404":
          description: Pagamento não encontrado
  /lojas/{lojaId}/financeiro/auditoria:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listAuditoria
      tags: [financeiro]
      summary: Trilha de auditoria das ações sensíveis (mais recentes primeiro)
      description: >
        Sem filtro, os 200 registros mais recentes. Os filtros são combináveis
        (E, não OU) e o corte de 200 continua valendo DEPOIS deles — quem quiser
        o período inteiro usa o CSV de …/auditoria/exportar.
      parameters:
        - name: acao
          in: query
          required: false
          # E107/S4 — aberto pelo mesmo motivo do `acao` da resposta: com o
          # enum fechado, filtrar por uma ação que a trilha JÁ GRAVA (mas que o
          # spec ainda não conhece) respondia 400. O filtro nunca acha o que não
          # existe — não precisa de enum para se proteger disso.
          description: >
            Código da ação (ver ACOES_AUDITORIA no api-server). Aberto: filtrar
            por código desconhecido devolve lista vazia, não erro.
          schema:
            type: string
        - name: usuarioId
          in: query
          required: false
          description: Autor da ação (id; o nome na linha é desnormalizado)
          schema:
            type: string
        - name: de
          in: query
          required: false
          description: Início do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Últimos registros da trilha
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditoriaItem"
        "400":
          description: Intervalo inválido
  /lojas/{lojaId}/financeiro/auditoria/autores:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listAutoresAuditoria
      tags: [financeiro]
      summary: Quem já deixou linha na trilha — as opções do filtro de autor
      description: >
        Sai da PRÓPRIA trilha, não da equipe: `usuarioId` é ON DELETE SET NULL,
        então quem saiu da loja continua tendo agido, e a lista de equipe é
        gated por `admin` — uma contadora com acesso só a financeiro ficaria sem
        filtro. Ordenado pela ação mais recente de cada autor.
      responses:
        "200":
          description: Autores distintos da trilha da loja
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutorAuditoria"
  /lojas/{lojaId}/financeiro/auditoria/exportar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: exportarAuditoria
      tags: [financeiro]
      summary: CSV da trilha de auditoria — os mesmos filtros da tela
      description: >
        Aceita os mesmos filtros do GET /auditoria, mas SEM o corte de 200: a
        planilha que a contadora concilia não pode ser truncada em silêncio.
      parameters:
        - name: acao
          in: query
          required: false
          # Aberto pela MESMA razão do `acao` do GET /auditoria (E107/S4), que
          # ficou uma rota acima: com o enum fechado, exportar o CSV filtrado
          # por uma ação que a trilha JÁ GRAVA respondia 400. A lista aqui tinha
          # parado em LEADS_ANONIMIZADOS e já ignorava REMARCACAO_PEDIDA,
          # CONTA_PAGAR_REMOVIDA e CONTABILIDADE_ENVIADA — a planilha da
          # contadora não conseguia recortar justamente as ações mais novas.
          description: >
            Código da ação (ver ACOES_AUDITORIA no api-server). Aberto: filtrar
            por código desconhecido devolve planilha vazia, não erro.
          schema:
            type: string
        - name: usuarioId
          in: query
          required: false
          schema:
            type: string
        - name: de
          in: query
          required: false
          description: Início do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Planilha CSV (UTF-8 com BOM)
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Intervalo inválido
  /lojas/{lojaId}/financeiro/recorrencias:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listRecorrencias
      tags: [financeiro]
      summary: O que se repete todo mês — salário, aluguel, assinatura, fornecedor
      responses:
        "200":
          description: Recorrências da loja
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recorrencia"
    post:
      operationId: createRecorrencia
      tags: [financeiro]
      description: >
        SALARIO exige `usuarioId` (e só um ativo por pessoa); DESPESA e
        FORNECEDOR exigem `descricao` — sem ela a conta gerada não teria como
        se chamar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecorrenciaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recorrencia"
        "400":
          description: Campos incompatíveis com o tipo (RECORRENCIA_INVALIDA)
        "409":
          description: Já existe salário ativo para esta pessoa (SALARIO_ATIVO_EXISTENTE)
        "422":
          description: Colaborador do salário não é desta loja (REFERENCIA_INVALIDA)
  /lojas/{lojaId}/financeiro/recorrencias/{recorrenciaId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: recorrenciaId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateRecorrencia
      tags: [financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecorrenciaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recorrencia"
  /lojas/{lojaId}/financeiro/saldos-referencia:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listSaldoReferencia
      tags: [financeiro]
      responses:
        "200":
          description: List of saldos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaldoReferencia"
    post:
      operationId: createSaldoReferencia
      tags: [financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaldoReferenciaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaldoReferencia"

  # ───────────────────────── Folha / contabilidade ─────────────────────────
  /lojas/{lojaId}/financeiro/recorrencias/gerar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    post:
      operationId: gerarRecorrencias
      tags: [financeiro]
      summary: Gera as contas da competência a partir das recorrências ativas
      description: >
        Salário, aluguel, assinatura e fornecedor fixo pelo mesmo caminho (E48).
        Idempotente: cada recorrência ativa vira NO MÁXIMO uma conta a pagar por
        competência. Reexecutar responde `geradas: 0` — é o que torna seguro
        clicar de novo depois de um erro de rede.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolhaInput"
      responses:
        "200":
          description: Competência gerada (geradas pode ser 0 numa reexecução)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolhaGerada"
        "400":
          description: Competência inválida (COMPETENCIA_INVALIDA)
  /lojas/{lojaId}/financeiro/folha/exportar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: exportarFolha
      tags: [financeiro]
      summary: CSV dos itens pagos no período, para a contabilidade
      description: >
        SÓ LÊ. Marcar os pagamentos como enviados é o POST
        …/financeiro/contabilidade/enviar — um GET precisa ser seguro
        (refresh/prefetch do navegador não pode escrever).
      parameters:
        - name: de
          in: query
          required: false
          description: Início do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Planilha CSV (UTF-8 com BOM)
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Intervalo inválido (INTERVALO_INVALIDO)
  /lojas/{lojaId}/financeiro/contabilidade/enviar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    post:
      operationId: enviarContabilidade
      tags: [financeiro]
      summary: Carimba enviadoContabilidadeEm nos pagamentos do intervalo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnviarContabilidadeInput"
      responses:
        "200":
          description: Marcados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnviarContabilidadeResultado"
        "400":
          description: Intervalo inválido (INTERVALO_INVALIDO)


  /lojas/{lojaId}/financeiro/conciliacao/marcar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    post:
      operationId: marcarConciliado
      tags: [financeiro]
      summary: Carimba conciliadoEm nos movimentos que casaram com o extrato
      description: >
        F32/E103 — a conciliação passa a ter memória. O corpo traz DUAS listas de
        ids, e não uma: o que a tela chama de "movimento do sistema" é montado de
        `parcelas` e de `pagamentos`, com ids sintéticos (`parcela:<id>` e
        `pagamento:<id>`). Não existe entidade "movimento" para receber um PATCH,
        e inventá-la seria criar um recurso para caber num verbo.

        Idempotente por construção: o WHERE exige `conciliado_em IS NULL`, então
        remarcar o mesmo lote devolve zero sem tocar no carimbo antigo — a mesma
        forma de `enviarContabilidade`. Id de outra loja não é erro: o WHERE
        filtra por `loja_id` e ele simplesmente não é marcado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarcarConciliadoInput"
      responses:
        "200":
          description: Quantos foram marcados de cada lado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarcarConciliadoResultado"
        "400":
          description: Corpo inválido (CORPO_INVALIDO)

  # ───────────────────────── Comissão ─────────────────────────
  /lojas/{lojaId}/comissao/regras:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listComissaoRegras
      tags: [comissao]
      responses:
        "200":
          description: List of regras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComissaoRegra"
    post:
      operationId: createComissaoRegra
      tags: [comissao]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComissaoRegraInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComissaoRegra"
  /lojas/{lojaId}/comissao/regras/{regraId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: regraId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateComissaoRegra
      tags: [comissao]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComissaoRegraUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComissaoRegra"
    delete:
      operationId: deleteComissaoRegra
      tags: [comissao]
      responses:
        "204":
          description: Deleted (as faixas vão junto)
  # As faixas não têm rotas próprias: elas só existem dentro de uma regra, e
  # editá-las uma a uma deixaria a escada inválida no meio do caminho
  # (sobreposta, com buraco). A regra inteira é substituída de uma vez.
  # Fora do prefixo /comissao de propósito: o gate requireModulo("comissao") é
  # da GESTÃO; aqui a vendedora vê só o próprio extrato (filtro pela sessão).
  /lojas/{lojaId}/minha-comissao:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getMinhaComissao
      tags: [comissao]
      summary: Extrato de comissão da própria pessoa logada
      parameters:
        - name: competencia
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Extrato do mês + histórico de fechamentos da pessoa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhaComissao"
        "400":
          description: Competência inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lojas/{lojaId}/comissao/preview:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: previewComissao
      tags: [comissao]
      parameters:
        - name: competencia
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: "Ranking ao vivo: o que seria pago se a competência fechasse agora"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComissaoPreviewLinha"
  /lojas/{lojaId}/comissao/simular:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    post:
      operationId: simularComissao
      tags: [comissao]
      summary: '"Se a escada fosse esta, quanto teria pago?" — simulação sobre as bases reais'
      description: >
        Aplica uma escada HIPOTÉTICA às bases reais das últimas competências da
        vendedora (a base do fechamento quando o mês já fechou; as vendas
        brutas quando não), reusando o motor calcularComissao. Não grava nada —
        é um POST que só consulta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimularComissaoInput"
      responses:
        "200":
          description: Comparação mês a mês entre o pago real e o simulado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulacaoComissao"
        "422":
          description: Vendedora fora da loja ou escada inválida
  /lojas/{lojaId}/comissao/fechamentos/{fechamentoId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: fechamentoId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: reabrirComissaoFechamento
      tags: [comissao]
      summary: Reabre um fechamento errado, desfazendo o que ele criou (E54)
      description: >
        Transacional e completo: cancela a conta a pagar gerada, apaga o
        fechamento e devolve a NULL o `comissaoEstornadaEm` dos contratos que
        ESTE fechamento reconciliou. Recusa se a conta já foi PAGA — reabrir
        deixaria uma saída de caixa sem contrapartida; o caminho é estornar o
        pagamento antes. Deixa linha na trilha de auditoria.
      responses:
        "200":
          description: Reaberto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaberturaComissao"
        "404":
          description: Fechamento não encontrado nesta loja
        "409":
          description: A conta de comissão já foi paga (COMISSAO_JA_PAGA)
  /lojas/{lojaId}/comissao/pendencias:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listPendenciasComissao
      tags: [comissao]
      summary: Competências passadas com venda e sem fechamento (E53)
      description: >
        Varredura das últimas competências: onde houve venda e ainda não há
        fechamento, a pendência aparece. O mês CORRENTE nunca entra — ele ainda
        pode receber vendas, e o fechamento o recusa. A granularidade é por
        (competência, vendedora): um mês pode ter fechado para quem já vendia e
        ganhado depois uma venda de outra pessoa.
      responses:
        "200":
          description: Pendências, da competência mais antiga para a mais recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendenciaComissao"
  /lojas/{lojaId}/comissao/fechamentos:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listComissaoFechamentos
      tags: [comissao]
      # No `get`, não no path: o POST recebe a competência no corpo, e um param
      # no nível do path vazaria para ele.
      parameters:
        - name: competencia
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: List of fechamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComissaoFechamento"
    post:
      operationId: gerarComissaoFechamento
      tags: [comissao]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GerarComissaoFechamentoInput"
      responses:
        "201":
          description: Gerado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComissaoFechamento"

  /lojas/{lojaId}/comissao/estornos/baixas:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listBaixasEstornoComissao
      tags: [comissao]
      description: >
        O outro lado do I10: as baixas manuais já feitas, com quem baixou,
        quando e por quê — o relatório que fecha o ciclo de auditoria.
        Reconciliações automáticas (estorno absorvido por um fechamento) não
        entram: não têm autor nem motivo.
      responses:
        "200":
          description: "Baixas manuais, mais recente primeiro"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BaixaEstornoComissao"

  /lojas/{lojaId}/comissao/estornos/baixa:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    post:
      operationId: baixarEstornoComissao
      tags: [comissao]
      description: >
        Baixa MANUAL do estorno pendente de uma vendedora (I10). Só admin.
        Quando a venda cancelada não é absorvida por nenhum mês — a vendedora
        parou de vender — o estorno carrega para sempre. A baixa é uma decisão
        humana e auditável (registra quem e por quê); nunca automática, que
        apagaria o rastro de um erro ou fraude.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaixarEstornoComissaoInput"
      responses:
        "200":
          description: "Estorno pendente baixado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaixarEstornoComissaoResultado"

  # ───────────────────────── Dashboard ─────────────────────────
  /lojas/{lojaId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  parameters:
    LojaIdParam:
      name: lojaId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    # E96: `error` é um CÓDIGO estável que a tela traduz; `detalhe` é frase em
    # português escrita por nós; `campos` só aparece na validação de corpo e diz
    # ONDE o erro está, para a tela marcar o campo em vez de abrir um toast.
    # Nunca sai daqui texto do Zod em inglês.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detalhe:
          type: string
        campos:
          type: array
          items:
            type: object
            required: [campo, motivo]
            properties:
              campo:
                type: string
              motivo:
                type: string

    # ── Auth ──
    LoginInput:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, minLength: 1 }
    SelecionarLojaInput:
      type: object
      required: [lojaId]
      properties:
        lojaId: { type: string }
    Sessao:
      type: object
      required: [usuario]
      properties:
        usuario:
          $ref: "#/components/schemas/Usuario"
        lojaAtivaId:
          type: ["string", "null"]
        acessosModulos:
          type: ["object", "null"]
          additionalProperties: true
        lojas:
          type: array
          items:
            $ref: "#/components/schemas/LojaComPerfil"

    LojaComPerfil:
      allOf:
        - $ref: "#/components/schemas/Loja"
        - type: object
          properties:
            perfilId: { type: string }
            perfilNome: { type: string }

    # ── Loja / Perfil / Usuario ──
    Loja:
      type: object
      required: [id, nome, ativo, createdAt]
      properties:
        id: { type: string }
        nome: { type: string }
        cnpj: { type: ["string", "null"] }
        endereco: { type: ["string", "null"] }
        telefone: { type: ["string", "null"] }
        ativo: { type: boolean }
        createdAt: { type: string, format: date-time }
    LojaInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1 }
        cnpj: { type: string }
        endereco: { type: string }
        telefone: { type: string }
    LojaUpdate:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        cnpj: { type: string }
        endereco: { type: string }
        telefone: { type: string }
        ativo: { type: boolean }
    # S17 — o que a DONA edita da própria loja, sem passar pelo console de
    # superadmin. É o `LojaUpdate` menos o `ativo`: desativar a própria loja é
    # ato de superadmin, e é a única coisa deste formulário que não teria
    # caminho de volta pela tela.
    DadosDaLojaInput:
      type: object
      additionalProperties: false
      properties:
        nome: { type: string, minLength: 1 }
        cnpj: { type: string }
        endereco: { type: string }
        telefone:
          type: string
          description: >
            Vazio é permitido (a loja pode não ter WhatsApp). Preenchido, tem de
            render um link de wa.me — o servidor recusa com TELEFONE_SEM_WHATSAPP
            o que `linkWhatsApp` transformaria em null, porque nesse caso o botão
            do portal da noiva some sem erro e sem aviso.

    # Acessos por MÓDULO × AÇÃO. Era plano (`{leads: true}`), que só respondia
    # "entra ou não entra" — não dava para ver o financeiro sem poder mexer
    # nele. O servidor normaliza contra MODULOS × ACOES (fail-closed) e garante
    # `criar || editar ⇒ ver`, então o que sai daqui é sempre o shape completo.
    AcoesModulo:
      type: object
      required: [ver, criar, editar]
      properties:
        ver: { type: boolean }
        criar: { type: boolean }
        editar: { type: boolean }
    AcessosModulos:
      type: object
      description: "Módulo → ações. Chave desconhecida é descartada pelo servidor."
      additionalProperties:
        $ref: "#/components/schemas/AcoesModulo"

    Perfil:
      type: object
      required: [id, nome, acessosModulos, sistema]
      properties:
        id: { type: string }
        nome: { type: string }
        acessosModulos:
          $ref: "#/components/schemas/AcessosModulos"
        # E80: o perfil do SISTEMA (Admin) é flag, não nome. Só leitura — não
        # existe no PerfilInput/PerfilUpdate de propósito: nasce no seed/SQL e
        # o servidor recusa PATCH/DELETE de quem a carrega.
        sistema: { type: boolean }
    PerfilInput:
      type: object
      required: [nome, acessosModulos]
      properties:
        nome: { type: string, minLength: 1 }
        acessosModulos:
          $ref: "#/components/schemas/AcessosModulos"
    PerfilUpdate:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        acessosModulos:
          $ref: "#/components/schemas/AcessosModulos"

    PerfilOverrideLoja:
      type: object
      required: [lojaId, perfilId, acessosModulos]
      properties:
        lojaId: { type: string }
        perfilId: { type: string }
        acessosModulos:
          $ref: "#/components/schemas/AcessosModulos"
    PerfilOverrideInput:
      type: object
      required: [perfilId, acessosModulos]
      properties:
        perfilId: { type: string }
        acessosModulos:
          $ref: "#/components/schemas/AcessosModulos"

    TrocarSenhaInput:
      type: object
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual: { type: string, minLength: 1 }
        novaSenha: { type: string, minLength: 6 }
    Usuario:
      type: object
      required: [id, nome, email, ativo, isSuperAdmin]
      properties:
        id: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        ativo: { type: boolean }
        isSuperAdmin: { type: boolean }
        # E57: a senha atual foi escolhida por outra pessoa; a tela obriga a
        # trocar antes de deixar usar o sistema.
        precisaTrocarSenha: { type: boolean }
    UsuarioInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string, minLength: 1 }
        email: { type: string, format: email }
        senha: { type: string, minLength: 6 }
        isSuperAdmin: { type: boolean }
    UsuarioComLojas:
      allOf:
        - $ref: "#/components/schemas/Usuario"
        - type: object
          required: [lojas]
          properties:
            lojas:
              type: array
              description: Lojas onde o usuário tem vínculo (via usuarios_lojas)
              items:
                type: object
                required: [id, nome]
                properties:
                  id: { type: string }
                  nome: { type: string }
    UsuarioUpdate:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        email: { type: string, format: email }
        senha: { type: string, minLength: 6 }
        ativo: { type: boolean }
        isSuperAdmin: { type: boolean }

    MembroEquipe:
      type: object
      required: [usuarioId, lojaId, perfilId, nome, email, perfilNome]
      properties:
        usuarioId: { type: string }
        lojaId: { type: string }
        perfilId: { type: string }
        nome: { type: string }
        email: { type: string }
        perfilNome: { type: string }
        ativo: { type: boolean }
    MembroEquipeInput:
      type: object
      required: [nome, email, senha, perfilId]
      properties:
        nome: { type: string, minLength: 1 }
        email: { type: string, format: email }
        senha: { type: string, minLength: 6 }
        perfilId: { type: string }
    Convite:
      type: object
      required: [id, lojaId, token, nome, email, perfilId, criadoEm, expiraEm]
      properties:
        id: { type: string }
        lojaId: { type: string }
        token: { type: string }
        nome: { type: string }
        email: { type: string }
        perfilId: { type: string }
        perfilNome: { type: ["string", "null"] }
        criadoEm: { type: string, format: date-time }
        expiraEm: { type: string, format: date-time }
    ConviteInput:
      type: object
      required: [nome, email, perfilId]
      properties:
        nome: { type: string, minLength: 1 }
        email: { type: string, format: email }
        perfilId: { type: string }
    ConvitePublico:
      type: object
      required: [lojaNome, nome, emailMascarado, precisaSenha, expiraEm]
      properties:
        lojaNome: { type: string }
        nome: { type: string }
        emailMascarado: { type: string, description: "m•••a@dominio — nunca o e-mail inteiro" }
        precisaSenha:
          type: boolean
          description: "true = e-mail sem conta, o aceite pede senha; false = conta existente, o aceite só vincula"
        expiraEm: { type: string, format: date-time }
    AceitarConviteInput:
      type: object
      required: [token]
      properties:
        token: { type: string }
        senha:
          type: string
          minLength: 6
          description: "Obrigatória quando o e-mail ainda não tem conta; ignorada quando já tem"
    AceitarConviteResultado:
      type: object
      required: [jaTinhaConta]
      properties:
        jaTinhaConta: { type: boolean }
    MembroAtividade:
      type: object
      required: [usuarioId, nome, email, perfilNome, ativo, acoes30d]
      properties:
        usuarioId: { type: string }
        nome: { type: string }
        email: { type: string }
        perfilNome: { type: string }
        ativo: { type: boolean }
        # Último LOGIN do usuário (global, não por loja). Null = nunca entrou.
        ultimoAcesso: { type: ["string", "null"], format: date-time }
        # Linhas do audit_log desta loja nos últimos 30 dias.
        acoes30d: { type: integer }
    AtividadeEquipe:
      type: object
      required: [membros, eventos]
      properties:
        membros:
          type: array
          items:
            $ref: "#/components/schemas/MembroAtividade"
        eventos:
          type: array
          items:
            $ref: "#/components/schemas/AuditoriaItem"
    MembroEquipeUpdate:
      type: object
      properties:
        # S-M23: o minLength do criar vale no editar — PATCH com "" esvaziava o nome.
        nome: { type: string, minLength: 1 }
        perfilId: { type: string }
        ativo: { type: boolean }

    # ── Backup do sistema (E30) ──
    BackupLog:
      type: object
      required: [id, gatilho, status, iniciadoEm]
      properties:
        id: { type: string }
        gatilho: { type: string, enum: [manual, agendado] }
        status: { type: string, enum: [em_andamento, ok, erro] }
        iniciadoEm: { type: string, format: date-time }
        concluidoEm: { type: ["string", "null"], format: date-time }
        tamanhoBytes:
          type: ["integer", "null"]
          description: "Tamanho do arquivo comprimido — só quando status = ok"
        arquivo:
          type: ["string", "null"]
          description: >-
            Caminho do dump no servidor; null quando o backup falhou OU quando
            o arquivo já foi removido pela retenção (dump podado não se baixa)
        autorNome:
          type: ["string", "null"]
          description: "Quem disparou o backup manual; null nos agendados"
        erro: { type: ["string", "null"] }
    BackupStatus:
      type: object
      required: [ultimo, recentes, ultimoDrill]
      properties:
        ultimo:
          oneOf:
            - $ref: "#/components/schemas/BackupLog"
            - type: "null"
        recentes:
          type: array
          items:
            $ref: "#/components/schemas/BackupLog"
        ultimoDrill:
          description: >-
            Último drill de restore (E89) — a prova de que o backup VOLTA:
            null enquanto nenhum drill rodou
          oneOf:
            - $ref: "#/components/schemas/RestoreDrillLog"
            - type: "null"
    RestoreDrillLog:
      type: object
      description: >-
        Uma execução do drill de restore (E89): o dump mais recente restaurado
        num banco efêmero e conferido contra a origem — contagem por tabela,
        FKs válidas e amostra de agregado. "ok" só quando TUDO conferiu.
      required: [id, status, iniciadoEm]
      properties:
        id: { type: string }
        status: { type: string, enum: [em_andamento, ok, erro] }
        iniciadoEm: { type: string, format: date-time }
        concluidoEm: { type: ["string", "null"], format: date-time }
        dumpArquivo:
          type: ["string", "null"]
          description: "Arquivo do dump restaurado no drill"
        tabelasConferidas:
          type: ["integer", "null"]
          description: "Quantas tabelas tiveram a contagem conferida"
        erro: { type: ["string", "null"] }

    # ── Catálogo ──
    Atributo:
      type: object
      required: [id, lojaId, nome, tipo, ordem, ativo]
      properties:
        id: { type: string }
        lojaId: { type: string }
        nome: { type: string }
        tipo: { type: string, enum: [OPCAO_UNICA, ESCALA] }
        ordem: { type: integer }
        ativo: { type: boolean }
        opcoes:
          type: array
          items:
            $ref: "#/components/schemas/AtributoOpcao"
    AtributoInput:
      type: object
      required: [nome, tipo]
      properties:
        nome: { type: string, minLength: 1 }
        tipo: { type: string, enum: [OPCAO_UNICA, ESCALA] }
        ordem: { type: integer }
    AtributoUpdate:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        ordem: { type: integer }
        ativo: { type: boolean }
    AtributoOpcao:
      type: object
      required: [id, atributoId, valor, ordem, ativo]
      properties:
        id: { type: string }
        atributoId: { type: string }
        valor: { type: string }
        ordem: { type: integer }
        ativo: { type: boolean }
    AtributoOpcaoInput:
      type: object
      required: [valor]
      properties:
        valor: { type: string, minLength: 1 }
        ordem: { type: integer }
    AtributoOpcaoUpdate:
      type: object
      properties:
        valor: { type: string, minLength: 1 }
        ordem: { type: integer }
        ativo: { type: boolean }

    # ── Vestidos ──
    Vestido:
      type: object
      required: [id, lojaId, codigo, nome, precoBase, exclusiva, status, createdAt]
      properties:
        id: { type: string }
        lojaId: { type: string }
        codigo: { type: string }
        nome: { type: string }
        precoBase: { type: number }
        # E157: nulo = a peça não tem preço de segunda saída, e o orçamento
        # segue com o precoBase (o comportamento de sempre).
        precoRealuguel: { type: ["number", "null"] }
        # E216 (cláusula 12ª): a peça foi comprada/confeccionada para sair
        # EXCLUSIVA. É obrigatória na resposta porque quem lê decide dinheiro —
        # a rescisão de peça exclusiva em PRIMEIRO ALUGUEL cobra o aluguel
        # integral. "Primeiro aluguel" não vem aqui: é a contagem de saídas
        # (`GET /vestidos/utilizacao`), que é derivada dos contratos.
        exclusiva: { type: boolean }
        # E156: de onde a peça veio, quando não veio do fornecedor — o trabalho
        # de CONFECÇÃO da fila da costureira que virou item do acervo. Nulo é o
        # caso de toda peça comprada.
        origemAjusteId: { type: ["string", "null"] }
        tamanho: { type: ["string", "null"] }
        cor: { type: ["string", "null"] }
        categoria: { type: ["string", "null"] }
        # S-A26: a régua de estado da peça, que vivia implícita numa comparação
        # de string (`status !== "ativo"` decide INATIVO). São só estes dois
        # valores no sistema inteiro — banco (default "ativo"), telas e testes.
        status: { type: string, enum: [ativo, inativo] }
        observacoes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        atributos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoAtributo"
        fotos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoFotoMeta"
    VestidoAtributo:
      type: object
      required: [atributoId, opcaoId]
      properties:
        atributoId: { type: string }
        opcaoId: { type: string }
    VestidoFotoMeta:
      type: object
      required: [ordem, mime, largura, altura, atualizadaEm]
      properties:
        ordem: { type: integer }
        mime: { type: string, description: "Derivado do binário pelo servidor, nunca do cliente" }
        largura: { type: integer }
        altura: { type: integer }
        atualizadaEm:
          type: string
          format: date-time
          description: "Versão da foto — alimenta o cache-busting (?v=) das URLs"
    VestidoFotoInput:
      type: object
      required: [base64]
      properties:
        base64:
          type: string
          description: "A foto (JPEG/PNG/WebP). Mime e dimensões são derivados do binário no servidor."
        thumbBase64:
          type: ["string", "null"]
          description: "Miniatura gerada no cliente para os cards. Ausente = sem thumb (a cheia serve de fallback)."
    VestidoUtilizacao:
      type: object
      required: [vestidoId, codigo, nome, status, precoBase, exclusiva, provas, reservas, contratos, receita]
      properties:
        vestidoId: { type: string }
        codigo: { type: string }
        nome: { type: string }
        status: { type: string, enum: [ativo, inativo] }
        precoBase: { type: number }
        precoRealuguel: { type: ["number", "null"] }
        # E216: a marca desce JUNTO com a contagem, pelo mesmo motivo do
        # precoRealuguel (E157) — o predicado da cláusula 12ª é
        # `exclusiva && contratos === 0`, e as duas metades vindo em respostas
        # diferentes obrigariam quem decide a costurar duas consultas.
        exclusiva: { type: boolean }
        # Provas agendadas no período (inclui FALTOU — a demanda existiu).
        provas: { type: integer }
        # Reservas de casamento ATIVAS com data no período.
        reservas: { type: integer }
        # Itens VESTIDO em contratos ATIVOS fechados no período.
        contratos: { type: integer }
        receita: { type: number }
    VestidoInput:
      type: object
      required: [codigo, nome, precoBase]
      properties:
        codigo: { type: string, minLength: 1 }
        nome: { type: string, minLength: 1 }
        precoBase: { type: number, minimum: 0 }
        precoRealuguel: { type: number, minimum: 0 }
        # E216 (cláusula 12ª): ausente = false, e é o caso da esmagadora
        # maioria. O sistema não inventa exclusividade que ninguém acordou.
        exclusiva: { type: boolean }
        # E156: a proveniência se declara no NASCIMENTO da peça, e só aqui — o
        # gesto é "esta confecção virou peça do acervo", não uma edição de ficha.
        # O servidor exige que o trabalho seja desta loja, do tipo CONFECCAO e já
        # FEITO.
        origemAjusteId: { type: string }
        tamanho: { type: string }
        cor: { type: string }
        categoria: { type: string }
        observacoes: { type: string }
        atributos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoAtributo"
    VestidoUpdate:
      type: object
      properties:
        # S-M23: os pisos do criar valem no editar — PATCH com "" esvaziava
        # código e nome, e um preço negativo entrava e voltava em toda leitura.
        codigo: { type: string, minLength: 1 }
        nome: { type: string, minLength: 1 }
        precoBase: { type: number, minimum: 0 }
        # null EXPLÍCITO desfaz o preço de realuguel — a peça volta a ser
        # cobrada pelo precoBase em toda saída.
        precoRealuguel: { type: ["number", "null"], minimum: 0 }
        # E216 (cláusula 12ª): a marca entra e SAI pela ficha. A loja se corrige
        # — foi ela quem declarou —, e o que o sistema não deixa desfazer é a
        # contagem de saídas, que não mora aqui.
        exclusiva: { type: boolean }
        tamanho: { type: string }
        cor: { type: string }
        categoria: { type: string }
        # S-A26: sem o enum, um PATCH com "Ativo" (ou qualquer grafia) tirava a
        # peça do acervo em silêncio — `vestidos.ts` decide INATIVO por
        # `status !== "ativo"`. Agora a grafia errada é 400 na borda.
        status: { type: string, enum: [ativo, inativo] }
        observacoes: { type: string }
        atributos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoAtributo"

    # ── Leads ──
    Lead:
      type: object
      required: [id, lojaId, etapa, noivaNome, origem, createdAt]
      properties:
        id: { type: string }
        lojaId: { type: string }
        etapa:
          type: string
          enum: [NOVO, INTERESSES_PREENCHIDOS, ATENDIMENTO_AGENDADO, EM_ATENDIMENTO, ORCAMENTO_ABERTO, CONTRATO_FECHADO, EM_PROVAS, RETIRADO, CASAMENTO_REALIZADO, DEVOLVIDO, PERDIDO]
        # S-M23: PATCH com "" virava noiva sem nome na fila de cobrança.
        noivaNome: { type: string, minLength: 1 }
        noivoNome: { type: ["string", "null"] }
        cerimonialista: { type: ["string", "null"] }
        whatsapp: { type: ["string", "null"] }
        casamentoData: { type: ["string", "null"], format: date-time }
        casamentoHorario: { type: ["string", "null"] }
        casamentoLocal: { type: ["string", "null"] }
        orcamentoAbertoEm: { type: ["string", "null"], format: date-time }
        # S-O10: o "sim" da noiva é CARIMBO, não coluna do funil — o aceite não
        # muda onde ela está, muda o que a loja tem de fazer. É ele que acende o
        # selo "aceitou" no card, e dele sai "do sim ao contrato, quantos dias".
        aceiteEm: { type: ["string", "null"], format: date-time }
        contratoFechadoEm: { type: ["string", "null"], format: date-time }
        perdidaEm: { type: ["string", "null"], format: date-time }
        perdidaMotivo:
          type: ["string", "null"]
          enum: [PRECO, DATA_INDISPONIVEL, CONCORRENTE, DESISTENCIA, SEM_RETORNO, OUTRO, null]
        perdidaDetalhe: { type: ["string", "null"] }
        origem: { type: string, enum: [LOJA, WHATSAPP, SITE, INSTAGRAM] }
        createdAt: { type: string, format: date-time }
        # Instante do contato mais recente em registros_cobranca (E27). Derivado,
        # não é coluna de `leads`: é o que permite ao funil marcar "parada há N
        # dias sem contato" sem uma consulta por card. `null` = nunca contatada,
        # e aí a contagem do funil corre desde `createdAt`.
        ultimoContatoEm: { type: ["string", "null"], format: date-time }
        interesse:
          $ref: "#/components/schemas/LeadInteresse"
    # Envelope da listagem: `total` é o universo do filtro, não da página —
    # é o que permite "página 2 de 5" sem carregar tudo.
    LeadsPage:
      type: object
      required: [itens, total]
      properties:
        total: { type: integer }
        itens:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
    LeadInput:
      type: object
      required: [noivaNome]
      properties:
        noivaNome: { type: string, minLength: 1 }
        noivoNome: { type: string }
        cerimonialista: { type: string }
        whatsapp: { type: string }
        casamentoData: { type: string, format: date-time }
        casamentoHorario: { type: string }
        casamentoLocal: { type: string }
        origem: { type: string, enum: [LOJA, WHATSAPP, SITE, INSTAGRAM] }
    LeadUpdate:
      type: object
      properties:
        etapa:
          type: string
          enum: [NOVO, INTERESSES_PREENCHIDOS, ATENDIMENTO_AGENDADO, EM_ATENDIMENTO, ORCAMENTO_ABERTO, CONTRATO_FECHADO, EM_PROVAS, RETIRADO, CASAMENTO_REALIZADO, DEVOLVIDO, PERDIDO]
        noivaNome: { type: string }
        noivoNome: { type: string }
        cerimonialista: { type: string }
        whatsapp: { type: string }
        casamentoData: { type: string, format: date-time }
        casamentoHorario: { type: string }
        casamentoLocal: { type: string }
        perdidaMotivo:
          type: string
          enum: [PRECO, DATA_INDISPONIVEL, CONCORRENTE, DESISTENCIA, SEM_RETORNO, OUTRO]
          description: "Obrigatório quando etapa vira PERDIDO; ignorado nas demais"
        perdidaDetalhe: { type: string }
        # F2 (E98): a origem passou a ser corrigível — errar o canal no cadastro
        # envenenava /leads/conversao sem conserto possível. A janela fecha na
        # CONVERSÃO, não no contrato: é `converteu(etapa)` que decide, a mesma
        # régua que o relatório usa para contar. Depois disso, mudar a origem
        # reescreveria uma conversão já contada — 422 ORIGEM_IMUTAVEL.
        origem:
          type: string
          enum: [LOJA, WHATSAPP, SITE, INSTAGRAM]
          description: "Corrigível enquanto o lead não converteu (CONTRATO_FECHADO ou além)"
    LeadInteresse:
      type: object
      required: [leadId]
      properties:
        leadId: { type: string }
        algoAMais: { type: ["string", "null"] }
        naoQuerUsar: { type: ["string", "null"] }
        tetoOrcamento: { type: ["number", "null"] }
        atributos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoAtributo"
    LeadInteresseInput:
      type: object
      # S-M10 (E169) — campo vazio querendo dizer "apague".
      #
      # O `PUT /leads/:id/interesse` monta o upsert com `set: { ...insertData }`:
      # campo AUSENTE some do JSON, some do `set`, e o valor antigo fica. A tela
      # limpava o teto de R$ 8.000,00, mandava `undefined` e mostrava
      # "Interesses salvos" — o teto continuava R$ 8.000,00, e o aviso "acima do
      # teto" da tela de orçamento seguia acendendo sobre um número que a noiva
      # já não tinha dito. Nem um `null` explícito resolvia: o contrato não o
      # admitia, e o zod devolvia 400.
      #
      # Agora as três escalares aceitam `null`, e os dois sentidos ficam
      # separados: `null` é APAGUE, ausente segue sendo "não mexi" (é o que o
      # `definirTeto` do E2E 19 usa, mandando só o teto).
      properties:
        algoAMais: { type: ["string", "null"] }
        naoQuerUsar: { type: ["string", "null"] }
        tetoOrcamento: { type: ["number", "null"] }
        atributos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoAtributo"
    ConversaoLeads:
      type: object
      required: [totalLeads, convertidos, perdidos, porOrigem, porMotivoPerda]
      properties:
        totalLeads: { type: integer }
        convertidos: { type: integer, description: "Leads que chegaram a CONTRATO_FECHADO ou além" }
        perdidos: { type: integer }
        porOrigem:
          type: array
          items:
            type: object
            required: [origem, total, convertidos]
            properties:
              origem: { type: string, enum: [LOJA, WHATSAPP, SITE, INSTAGRAM] }
              total: { type: integer }
              convertidos: { type: integer }
        porMotivoPerda:
          type: array
          items:
            type: object
            required: [motivo, total]
            properties:
              motivo:
                type: ["string", "null"]
                enum: [PRECO, DATA_INDISPONIVEL, CONCORRENTE, DESISTENCIA, SEM_RETORNO, OUTRO, null]
                description: "null = perdido sem motivo registrado (dado legado)"
              total: { type: integer }
    AlertaCaixa:
      type: object
      required: [ancorado, saldoHoje, diaNegativo, menorSaldo, horizonteDias]
      properties:
        ancorado:
          type: boolean
          description: "false = não há saldo de referência; o resto vem null e não há alerta a dar"
        saldoHoje:
          type: ["number", "null"]
          description: "Saldo de partida: âncora + realizado desde ela"
        diaNegativo:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: "Primeiro dia em que o saldo projetado fica negativo; null se nunca"
        menorSaldo:
          type: ["object", "null"]
          required: [dia, valor]
          properties:
            dia:
              type: ["string", "null"]
              pattern: '^\d{4}-\d{2}-\d{2}$'
              description: "null = o piso é o próprio saldo de hoje (nada o derruba)"
            valor: { type: number }
        horizonteDias: { type: integer }
    LookbookInput:
      type: object
      required: [leadId, vestidoIds]
      properties:
        leadId: { type: string }
        vestidoIds:
          type: array
          minItems: 1
          maxItems: 30
          items: { type: string }
    Lookbook:
      type: object
      required: [id, leadId, token, expiraEm, criadoEm, vestidos]
      properties:
        id: { type: string }
        leadId: { type: string }
        token: { type: string }
        expiraEm: { type: string, format: date-time }
        criadoEm: { type: string, format: date-time }
        vestidos:
          type: array
          items:
            type: object
            required: [vestidoId, nome]
            properties:
              vestidoId: { type: string }
              nome: { type: string }
    LookbookPublicoFoto:
      type: object
      required: [ordem, atualizadaEm]
      properties:
        ordem: { type: integer }
        atualizadaEm: { type: string, format: date-time }
    LookbookPublicoVestido:
      type: object
      required: [vestidoId, nome, precoBase, fotos, atributos]
      properties:
        vestidoId: { type: string }
        nome: { type: string }
        precoBase: { type: number }
        fotos:
          type: array
          items:
            $ref: "#/components/schemas/LookbookPublicoFoto"
        atributos:
          type: array
          items:
            type: object
            required: [atributo, valor]
            properties:
              atributo: { type: string }
              valor: { type: string }
    LookbookPublico:
      type: object
      required: [lojaNome, noivaNome, vestidos]
      properties:
        lojaNome: { type: string }
        noivaNome: { type: string }
        vestidos:
          type: array
          items:
            $ref: "#/components/schemas/LookbookPublicoVestido"
    CaptacaoLeadInput:
      type: object
      required: [noivaNome]
      properties:
        noivaNome: { type: string, minLength: 1, maxLength: 200 }
        noivoNome: { type: string, maxLength: 200 }
        whatsapp: { type: string, maxLength: 30 }
        casamentoData: { type: string, format: date-time }
        # De onde o formulário veio. LOJA fica de fora: lead digitado na loja
        # nasce pela rota autenticada.
        origem: { type: string, enum: [SITE, INSTAGRAM, WHATSAPP], default: SITE }
        # E77 (LGPD): true = a noiva marcou o consentimento no formulário; o
        # instante fica carimbado no lead.
        consentimento: { type: boolean }
    CaptacaoLeadResultado:
      type: object
      required: [id]
      properties:
        id: { type: string }
    CaptacaoToken:
      type: object
      required: [token]
      properties:
        token: { type: ["string", "null"] }
    RegistroCobranca:
      type: object
      required: [id, leadId, data, canal]
      properties:
        id: { type: string }
        leadId: { type: string }
        data: { type: string, format: date-time }
        canal: { type: string, enum: [WHATSAPP, TELEFONE, PRESENCIAL, OUTRO] }
        observacao: { type: ["string", "null"] }
        # Quem falou com a noiva. Nulo quando a colaboradora saiu da equipe (a
        # coluna é ON DELETE SET NULL): o contato aconteceu de qualquer forma, e
        # perder o autor é melhor do que perder o registro.
        vendedorNome: { type: ["string", "null"] }
    # `vendedorId` NÃO entra aqui: quem registrou o contato é fato da SESSÃO, não
    # algo que o cliente declara — senão dá para atribuir a ligação a outra pessoa.
    RegistroCobrancaInput:
      type: object
      required: [data, canal]
      properties:
        data: { type: string, format: date-time }
        canal: { type: string, enum: [WHATSAPP, TELEFONE, PRESENCIAL, OUTRO] }
        observacao: { type: string }

    # ── Agenda ──
    ItemEstoque:
      type: object
      required: [id, lojaId, nome, quantidade, ativo]
      properties:
        id: { type: string }
        lojaId: { type: string }
        nome: { type: string }
        tamanho: { type: ["string", "null"] }
        quantidade: { type: integer }
        preco: { type: ["number", "null"] }
        ativo: { type: boolean }
    ItemEstoqueInput:
      type: object
      required: [nome, quantidade]
      properties:
        nome: { type: string, minLength: 1 }
        tamanho: { type: string }
        quantidade: { type: integer, minimum: 0 }
        preco: { type: number, minimum: 0 }
    ItemEstoqueUpdate:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        tamanho: { type: ["string", "null"] }
        quantidade: { type: integer, minimum: 0 }
        preco: { type: ["number", "null"], minimum: 0 }
        ativo: { type: boolean }
    ComprometimentoEstoque:
      type: object
      required: [data, itens]
      properties:
        data: { type: string }
        itens:
          type: array
          items:
            type: object
            required: [itemEstoqueId, nome, quantidade, comprometida, disponivel]
            properties:
              itemEstoqueId: { type: string }
              nome: { type: string }
              tamanho: { type: ["string", "null"] }
              # Quantas a loja TEM.
              quantidade: { type: integer }
              # Quantas saem no dia, somadas dos contratos ATIVOS.
              comprometida: { type: integer }
              # `quantidade - comprometida`. NEGATIVO é resposta legítima: o
              # sistema avisa, não bloqueia, e esconder o buraco seria mentir.
              disponivel: { type: integer }
    Ausencia:
      type: object
      required: [id, lojaId, usuarioId, inicio, fim]
      properties:
        id: { type: string }
        lojaId: { type: string }
        usuarioId: { type: string }
        # Dias locais inclusivos nas DUAS pontas: 10/07 a 20/07 significa que no
        # dia 20 a pessoa ainda não voltou.
        inicio: { type: string }
        fim: { type: string }
        motivo: { type: ["string", "null"] }
        # Nome de quem falta, para a agenda dizer o porquê sem segunda consulta.
        usuarioNome: { type: ["string", "null"] }
    AusenciaInput:
      type: object
      required: [usuarioId, inicio, fim]
      properties:
        usuarioId: { type: string }
        inicio: { type: string }
        fim: { type: string }
        motivo: { type: string }
    Cabine:
      type: object
      required: [id, lojaId, nome, ativo]
      properties:
        id: { type: string }
        lojaId: { type: string }
        nome: { type: string }
        ativo: { type: boolean }
    CabineInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1 }
    CabineUpdate:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        ativo: { type: boolean }
    Atendimento:
      type: object
      required: [id, lojaId, leadId, cabineId, vendedoraId, tipo, inicio, situacao]
      properties:
        id: { type: string }
        lojaId: { type: string }
        leadId: { type: string }
        cabineId: { type: string }
        vendedoraId: { type: string }
        tipo: { type: string, enum: [ATENDIMENTO, PROVA] }
        bloqueioId: { type: ["string", "null"] }
        inicio: { type: string, format: date-time }
        atendidoEm: { type: ["string", "null"], format: date-time }
        confirmadoEm: { type: ["string", "null"], format: date-time }
        contatadoEm: { type: ["string", "null"], format: date-time }
        # F37/E100: a noiva avisou pelo portal que não pode ir. Sem este campo na
        # lista, o aviso dela morre no banco — a fila da loja não teria como
        # mostrá-lo, e o horário ficaria preso até a ausência.
        remarcacaoPedidaEm: { type: ["string", "null"], format: date-time }
        situacao: { type: string, enum: [AGENDADO, EM_ATENDIMENTO, CONCLUIDO, FALTOU] }
        desfecho: { type: ["string", "null"], enum: [RESERVOU, VAI_PENSAR, NAO_SERVIU, null] }
        observacao: { type: ["string", "null"] }
        # Relações (sempre presentes nos GET; telas de fila/agenda precisam
        # de noiva, cabine, vendedora e — nas provas — vestido via bloqueio).
        lead:
          $ref: "#/components/schemas/Lead"
        cabine:
          $ref: "#/components/schemas/Cabine"
        vendedora:
          $ref: "#/components/schemas/Usuario"
        bloqueio:
          anyOf:
            - $ref: "#/components/schemas/BloqueioVestido"
            - type: "null"
        # E192/S-O75: o item é o `AtendimentoAjuste`, e não o `Ajuste` inteiro.
        # O `Ajuste` carrega a VOLTA para o atendimento (`atendimento`), o prazo
        # calculado (`proximaProva`) e a peça de acervo (`pecaDoAcervo`) — três
        # coisas que só a fila da costureira monta, e que `ATENDIMENTO_WITH`
        # nunca trouxe. Prometê-las aqui era prometer o que ninguém preenche.
        ajustes:
          type: array
          items:
            $ref: "#/components/schemas/AtendimentoAjuste"
    # E192/S-O75 — o ajuste COMO O ATENDIMENTO O ENTREGA: as colunas do trabalho
    # mais o checklist, que é o que o `with` da agenda carrega. É o espelho do
    # `AjusteAtendimento` (o atendimento como o ajuste o entrega), e existe pelo
    # mesmo motivo: sem ele o par cicla, e o ciclo virava promessa vazia.
    AtendimentoAjuste:
      type: object
      required: [id, lojaId, atendimentoId, descricao, status]
      properties:
        id: { type: string }
        lojaId: { type: string }
        atendimentoId: { type: string }
        descricao: { type: string }
        tipo: { type: string, enum: [AJUSTE, CONFECCAO] }
        custo: { type: ["number", "null"] }
        status: { type: string, enum: [PENDENTE, FEITO] }
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/AjusteChecklistItem"
    AtendimentoInput:
      type: object
      required: [leadId, cabineId, vendedoraId, inicio]
      properties:
        leadId: { type: string }
        cabineId: { type: string }
        vendedoraId: { type: string }
        tipo: { type: string, enum: [ATENDIMENTO, PROVA] }
        bloqueioId: { type: string }
        inicio: { type: string, format: date-time }
        observacao: { type: string }
    AtendimentoUpdate:
      type: object
      properties:
        cabineId: { type: string }
        vendedoraId: { type: string }
        inicio: { type: string, format: date-time }
        situacao: { type: string, enum: [AGENDADO, EM_ATENDIMENTO, CONCLUIDO, FALTOU] }
        desfecho: { type: string, enum: [RESERVOU, VAI_PENSAR, NAO_SERVIU] }
        observacao: { type: string }
    Ajuste:
      type: object
      required: [id, lojaId, atendimentoId, descricao, status]
      properties:
        id: { type: string }
        lojaId: { type: string }
        atendimentoId: { type: string }
        descricao: { type: string }
        # E155: a fila guarda AJUSTE (peça existente que se altera) e CONFECCAO
        # (peça nova, feita para a noiva). Mesmo prazo, mesmo checklist, mesma
        # tela — o que muda é o rótulo, e que confecção tem custo.
        tipo: { type: string, enum: [AJUSTE, CONFECCAO] }
        custo: { type: ["number", "null"] }
        status: { type: string, enum: [PENDENTE, FEITO] }
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/AjusteChecklistItem"
        # Contexto relacional da fila da costureira (ajuste → atendimento →
        # bloqueio → noiva/vestido/casamento). Schema próprio (sem `ajustes`)
        # para não ciclar com Atendimento.
        atendimento:
          $ref: "#/components/schemas/AjusteAtendimento"
        # O prazo REAL da costureira (E14): a próxima PROVA do mesmo vestido
        # depois da prova que criou o ajuste — é para ela que o ajuste precisa
        # estar pronto. Null = sem prova marcada (o casamento vira a referência).
        proximaProva: { type: ["string", "null"], format: date-time }
        # E156: a peça do acervo que ESTE trabalho virou. Null enquanto não
        # virou — e é o que troca o gesto "virou peça do acervo" pelo link para
        # a peça, na mesma linha da fila.
        pecaDoAcervo:
          anyOf:
            - $ref: "#/components/schemas/AjustePecaDoAcervo"
            - type: "null"
    AjustePecaDoAcervo:
      type: object
      required: [id, codigo, nome]
      properties:
        id: { type: string }
        codigo: { type: string }
        nome: { type: string }
    AjusteAtendimento:
      type: object
      required: [id, leadId, tipo, inicio, situacao]
      properties:
        id: { type: string }
        leadId: { type: string }
        tipo: { type: string, enum: [ATENDIMENTO, PROVA] }
        bloqueioId: { type: ["string", "null"] }
        inicio: { type: string, format: date-time }
        situacao: { type: string, enum: [AGENDADO, EM_ATENDIMENTO, CONCLUIDO, FALTOU] }
        lead:
          $ref: "#/components/schemas/Lead"
        bloqueio:
          anyOf:
            - $ref: "#/components/schemas/BloqueioVestido"
            - type: "null"
    AjusteChecklistItem:
      type: object
      required: [id, ajusteId, descricao, feito, ordem]
      properties:
        id: { type: string }
        ajusteId: { type: string }
        descricao: { type: string }
        feito: { type: boolean }
        ordem: { type: integer }
    AjusteChecklistItemInput:
      type: object
      required: [descricao]
      properties:
        descricao: { type: string, minLength: 1 }
        ordem: { type: integer }
    AjusteChecklistItemUpdate:
      type: object
      properties:
        descricao: { type: string, minLength: 1 }
        feito: { type: boolean }
        ordem: { type: integer }
    AjusteInput:
      type: object
      required: [atendimentoId, descricao]
      properties:
        atendimentoId: { type: string }
        descricao: { type: string, minLength: 1 }
        tipo: { type: string, enum: [AJUSTE, CONFECCAO] }
        custo: { type: number, minimum: 0 }
    AjusteUpdate:
      type: object
      properties:
        descricao: { type: string, minLength: 1 }
        tipo: { type: string, enum: [AJUSTE, CONFECCAO] }
        custo: { type: ["number", "null"], minimum: 0 }
        status: { type: string, enum: [PENDENTE, FEITO] }
    RegraDisponibilidade:
      type: object
      required: [lojaId, provaDiasAntes, provaDuracao, usoDiasAntes, usoDiasDepois, lavagemDiasDepois, estoqueLavagemDiasDepois, atendimentoAberturaHora, atendimentoFechamentoHora, diasFuncionamento]
      properties:
        lojaId: { type: string }
        provaDiasAntes: { type: integer }
        # S-A7: em SLOTS de 30 min (2 = 60 min), o passo do agenda-core
        # (SLOT_MINUTOS). Zero slots não é duração de prova.
        provaDuracao: { type: integer, minimum: 1 }
        usoDiasAntes: { type: integer }
        usoDiasDepois: { type: integer }
        lavagemDiasDepois: { type: integer }
        # S-A16: a lavagem da peça de ESTOQUE, separada da do vestido — a dona
        # decidiu que é configurável; 0 = estoque sem lavagem na conta.
        estoqueLavagemDiasDepois: { type: integer, minimum: 0 }
        atendimentoAberturaHora: { type: integer }
        atendimentoFechamentoHora: { type: integer }
        diasFuncionamento:
          type: array
          description: "Dias da semana em que a loja abre: 0=domingo … 6=sábado (E38)"
          items: { type: integer, minimum: 0, maximum: 6 }
        # E222 — o SEGUNDO expediente (cláusula 4ª): retirada e devolução. O de
        # cima governa ATENDIMENTO (provas, sete dias até as 20h, vindo do
        # caderno pela S-A8 e certo para provas). Este governa a peça saindo e
        # voltando: ter–sex 10:30–19:00, sábado até 18:00. Não é contradição —
        # é o segundo calendário que o negócio sempre teve e o modelo não tinha.
        retiradaDias:
          type: array
          description: "Dias em que a loja retira e devolve: 0=domingo … 6=sábado (cláusula 4ª)"
          items: { type: integer, minimum: 0, maximum: 6 }
        # Em MINUTOS desde a meia-noite, e não em horas como o de atendimento:
        # a cláusula abre às 10:30, e hora inteira não escreve meia hora.
        retiradaAberturaMinutos: { type: integer, minimum: 0, maximum: 1440 }
        retiradaFechamentoMinutos: { type: integer, minimum: 0, maximum: 1440 }
        # O sábado tem o seu, porque o contrato dá a ele expediente mais curto.
        retiradaFechamentoSabadoMinutos: { type: integer, minimum: 0, maximum: 1440 }
    RegraDisponibilidadeInput:
      type: object
      properties:
        provaDiasAntes: { type: integer }
        # S-A7: mesma unidade do schema de resposta — SLOTS de 30 min, mínimo 1.
        # Antes o zod aceitava `provaDuracao: 0`; só os `Math.max(1, …)` de
        # leitura impediam a janela de conflito de colapsar.
        provaDuracao: { type: integer, minimum: 1 }
        usoDiasAntes: { type: integer }
        usoDiasDepois: { type: integer }
        lavagemDiasDepois: { type: integer }
        # S-A16: mesma unidade da resposta; negativo não é lavagem.
        estoqueLavagemDiasDepois: { type: integer, minimum: 0 }
        atendimentoAberturaHora: { type: integer }
        atendimentoFechamentoHora: { type: integer }
        diasFuncionamento:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        # E222 — o expediente de retirada/devolução (cláusula 4ª). Mesma unidade
        # da resposta: MINUTOS desde a meia-noite, porque a cláusula abre 10:30.
        retiradaDias:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        retiradaAberturaMinutos: { type: integer, minimum: 0, maximum: 1440 }
        retiradaFechamentoMinutos: { type: integer, minimum: 0, maximum: 1440 }
        retiradaFechamentoSabadoMinutos: { type: integer, minimum: 0, maximum: 1440 }

    # ── Reservas ──
    Reserva:
      type: object
      required: [id, lojaId, leadId, casamentoData, status]
      properties:
        id: { type: string }
        lojaId: { type: string }
        leadId: { type: string }
        casamentoData: { type: string, format: date-time }
        status: { type: string, enum: [EM_MONTAGEM, CONFIRMADA, CONCLUIDA, CANCELADA] }
        # Nome casa com a relation Drizzle (`bloqueios`); o antigo `itens`
        # nunca chegou ao cliente (mismatch relation×schema descartava tudo).
        bloqueios:
          type: array
          items:
            $ref: "#/components/schemas/BloqueioVestido"
        lead:
          $ref: "#/components/schemas/Lead"
    ReservaInput:
      type: object
      required: [leadId, casamentoData]
      properties:
        leadId: { type: string }
        casamentoData: { type: string, format: date-time }
    ReservaUpdate:
      type: object
      properties:
        status: { type: string, enum: [EM_MONTAGEM, CONFIRMADA, CONCLUIDA, CANCELADA] }
        casamentoData: { type: string, format: date-time }
    BloqueioVestido:
      type: object
      required: [id, lojaId, vestidoId, tipo]
      properties:
        id: { type: string }
        lojaId: { type: string }
        vestidoId: { type: string }
        leadId: { type: ["string", "null"] }
        tipo: { type: string, enum: [RESERVA_CASAMENTO, MANUTENCAO] }
        casamentoData: { type: ["string", "null"], format: date-time }
        provaDataReal: { type: ["string", "null"], format: date-time }
        retiradaDataReal: { type: ["string", "null"], format: date-time }
        devolucaoDataReal: { type: ["string", "null"], format: date-time }
        # E152: a última data real do ciclo. A lavagem era a única etapa sem
        # uma — a peça voltava da lavanderia e ficava presa até o sétimo dia.
        lavagemConcluidaEm: { type: ["string", "null"], format: date-time }
        inicio: { type: ["string", "null"], format: date-time }
        fim: { type: ["string", "null"], format: date-time }
        canceladoEm: { type: ["string", "null"], format: date-time }
        observacao: { type: ["string", "null"] }
        reservaId: { type: ["string", "null"] }
        ocupacaoInicio: { type: ["string", "null"], format: date-time }
        ocupacaoFim: { type: ["string", "null"], format: date-time }
        # V14/E167 — de QUEM é este bloqueio, pela MESMA régua que a cobrança
        # de avaria já usa (V3/E163): o `leadId` próprio, ou o da reserva-mãe
        # quando ele é nulo. Medido em 2026-07: 61 das 63 avarias do banco
        # viviam em bloqueio sem `lead_id`, e a ficha só buscava o contrato pelo
        # campo nulável — em 97% das avarias o botão "Cobrar reparo" não era
        # desenhado.
        #
        # S-C10 (13/08/2026) — o número foi remedido e o campo continua devido.
        # Hoje são ZERO avarias nos dois bancos e o bloqueio sem `lead_id` é
        # 0 de 116 em `moscow_base` e 2 de 127 no dev: o caso é RARO, não comum.
        # O contrato não promete o campo por frequência — promete porque
        # `lead_id` é NULLABLE e uma única avaria assim voltaria a esconder o
        # botão. A conta está em `api-server/src/lib/dono-do-bloqueio.ts`.
        #
        # S-O17/E179 — TODA porta o preenche agora. Até aqui só o GET e o PATCH
        # do bloqueio o traziam, "porque a listagem não paga o join": a
        # listagem declarava o campo e devolvia `undefined` em silêncio, e o
        # contrato mentia para quem o pedisse. O join custa UMA coluna
        # (`reservas.lead_id`) no mesmo SELECT, não uma consulta por linha.
        donoLeadId: { type: ["string", "null"] }
        vestido:
          $ref: "#/components/schemas/Vestido"
        # Manutenção não tem noiva — lead é null nesses bloqueios.
        lead:
          anyOf:
            - $ref: "#/components/schemas/Lead"
            - type: "null"
    BloqueioVestidoInput:
      type: object
      required: [vestidoId, tipo]
      properties:
        vestidoId: { type: string }
        leadId: { type: string }
        tipo: { type: string, enum: [RESERVA_CASAMENTO, MANUTENCAO] }
        casamentoData: { type: string, format: date-time }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        observacao: { type: string }
        reservaId: { type: string }
    Avaria:
      type: object
      required: [id, lojaId, bloqueioId, descricao, tipo, temFoto, criadaEm, aluguelDaPeca]
      properties:
        id: { type: string }
        lojaId: { type: string }
        bloqueioId: { type: string }
        descricao: { type: string }
        # E214 — de qual CLÁUSULA esta taxa saiu. LIMPEZA é a 14ª (faixa
        # absoluta, R$ 350,00 a R$ 2.500,00); DANO é a 15ª (teto de 5× o aluguel
        # da peça). Sem o tipo, `custoReparo` é um número sem régua: não há como
        # dizer se R$ 400,00 cabe sem saber qual das duas o rege.
        tipo: { type: string, enum: [LIMPEZA, DANO] }
        custoReparo: { type: ["number", "null"] }
        # E214 — por que o valor saiu da faixa. Preenchida = alguém decidiu fora
        # do que a cláusula manda e disse por quê; a mesma frase está na trilha
        # (`AVARIA_FORA_DA_FAIXA`). A tela mostra o selo a partir dela.
        justificativaDaTaxa: { type: ["string", "null"] }
        # S-C47 — o aluguel que rege o teto da 15ª DESTA avaria, em reais, lido
        # do MESMO contrato que a porta vai conferir: o que COBRA o reparo
        # quando há cobrança viva, e o ATIVO da dona do bloqueio quando não há.
        # `null` = a peça não está em contrato nenhum, e a 15ª não alcança o
        # caso (o veredicto sai `conferida: false`).
        #
        # Ele existe para a tela LER o teto em vez de recalculá-lo por outro
        # caminho: até aqui `faixa-da-avaria.ts` perguntava o aluguel ao
        # contrato ATIVO da noiva e a porta ao contrato que cobra, e os dois só
        # coincidem enquanto três invariantes se sustentam (um ATIVO por noiva,
        # o cancelamento cancelando as parcelas em aberto, e a cobrança presa à
        # dona do bloqueio). O terceiro tem furo medido — bloqueio SEM dona
        # aceita ser cobrado em contrato de qualquer noiva —, e por ali a tela
        # dizia "sem teto" onde a porta cobra R$ 2.000,00. É a lição do E187:
        # cinco grafias da mesma conta, duas errando.
        aluguelDaPeca: { type: ["number", "null"] }
        temFoto: { type: boolean, description: "A foto vem por /avarias/{id}/foto" }
        # E97: preenchido = já cobrada. A tela usa isto para trocar o botão por
        # "Cobrado — ver parcela" em vez de oferecer a cobrança de novo.
        parcelaId: { type: ["string", "null"] }
        # V2/E167 — `parcelaId` preenchido NÃO é o mesmo que cobrança viva, e a
        # tela decidia por ele enquanto o servidor decide por `cobrancaViva`.
        # Cancelado o contrato, a parcela do reparo vira CANCELADA junto: o
        # servidor volta a aceitar cobrar e remover, e a tela mostrava
        # "Cobrado — ver parcela" para sempre, escondendo os dois botões.
        # R$ 800,00 que não entram no carnê novo e uma avaria impossível de
        # limpar. O status vem junto para as duas pontas lerem o mesmo estado.
        parcelaStatus: { type: ["string", "null"], enum: [PREVISTA, PARCIAL, PAGA, CANCELADA, null] }
        registradoPorNome: { type: ["string", "null"] }
        criadaEm: { type: string, format: date-time }

    # ───────── E212 — o atraso na devolução (cláusula 16ª e seus dois §§) ─────────
    #
    # O sistema já enxergava o atraso (`ATRASO_DEVOLUCAO` em disponibilidade.ts)
    # e nenhuma cobrança nascia. A conta mora no `financeiro-core`, e a TELA usa
    # a mesma: duas grafias da mesma conta divergiriam no dia em que a régua
    # mudasse, e a vendedora leria na tela um valor que a porta não pratica.
    CobrancaDeAtrasoLinha:
      type: object
      required: [descricao, tipo, clausula, dias, diaria, valor]
      properties:
        descricao: { type: string }
        # ATRASO é o §1º (1 a 9 dias: diária + multa); EXTRAVIO é o caput (10
        # dias ou mais: 4× o aluguel, e SEM a multa, que o caput não menciona).
        # As duas faixas são exclusivas — o §1º só vale "em prazo inferior ao
        # descrito no caput".
        tipo: { type: string, enum: [ATRASO, EXTRAVIO] }
        clausula: { type: string }
        dias: { type: integer }
        # O aluguel da peça dividido pelos dias da janela de uso prevista
        # (decisão da dona, 13/08/2026). A outra leitura — o aluguel inteiro por
        # dia — faz nove dias custarem mais que o extravio do décimo, e a escada
        # do contrato desceria.
        diaria: { type: number }
        valor: { type: number }

    CobrancaDeAtraso:
      type: object
      required: [devida, linhas, multa, valor, temExtravio, maiorAtraso, semAluguel, jaCobrada]
      properties:
        # false = devolução no prazo. É a resposta da maioria, e não é erro.
        devida: { type: boolean }
        linhas:
          type: array
          items: { $ref: "#/components/schemas/CobrancaDeAtrasoLinha" }
        # A multa do §1º entra UMA vez por devolução atrasada, não uma por peça:
        # o §2º manda RATEAR os valores entre as peças, não multiplicá-los.
        multa: { type: number }
        valor: { type: number }
        temExtravio: { type: boolean }
        maiorAtraso: { type: integer }
        # A frase única — a tela imprime esta, e a descrição da parcela grava
        # esta. Lição do E214 aplicada ao texto.
        explicacao: { type: ["string", "null"] }
        # As peças atrasadas que NÃO estão no rol de itens do contrato. A 16ª
        # cobra sobre o aluguel de cada peça; sem aluguel a régua diz que não
        # conferiu em vez de inventar um número (mesma escolha do E214 para o
        # dano em peça fora de contrato).
        semAluguel:
          type: array
          items: { type: string }
        jaCobrada: { type: boolean }
        parcelaId: { type: ["string", "null"] }

    # ───────── S-C32 — a fila do atraso ─────────
    #
    # O E212 fez a conta e deu a ela UMA porta: a ficha da reserva. O fato que a
    # dispara, porém, é a AUSÊNCIA de um gesto — a peça que não voltou —, e
    # ausência não abre tela nenhuma. Sem fila, a diária do §1º soma em silêncio
    # até alguém abrir a ficha certa por acaso.
    AtrasoNaFila:
      type: object
      required:
        [contratoId, leadId, bloqueioId, linhas, multa, valor, temExtravio, maiorAtraso, semAluguel, jaCobrada]
      properties:
        contratoId: { type: string }
        leadId: { type: string }
        noivaNome: { type: ["string", "null"] }
        # A ficha por onde se cobra. A cobrança do E212 é do CONTRATO inteiro
        # (uma parcela para todas as peças, §2º), então qualquer bloqueio
        # atrasado dele serve — este é o da peça que está fora há mais tempo.
        bloqueioId: { type: string }
        linhas:
          type: array
          items: { $ref: "#/components/schemas/CobrancaDeAtrasoLinha" }
        multa: { type: number }
        valor: { type: number }
        temExtravio: { type: boolean }
        maiorAtraso: { type: integer }
        explicacao: { type: ["string", "null"] }
        semAluguel:
          type: array
          items: { type: string }
        jaCobrada: { type: boolean }

    FilaDeAtrasos:
      type: object
      required: [itens, pecas, valor]
      properties:
        itens:
          type: array
          items: { $ref: "#/components/schemas/AtrasoNaFila" }
        # Quantas PEÇAS estão fora do prazo, somando os contratos — o número que
        # o aviso do sino diz. Um contrato pode ter três.
        pecas: { type: integer }
        # O que a 16ª já cobra hoje, somando os contratos. Soma o que a régua
        # devolveu; a fila nunca recalcula a conta (lição do E187).
        valor: { type: number }

    CobrarAtrasoInput:
      type: object
      properties:
        # Dias até o vencimento, contados do dia de negócio de hoje — mesma
        # régua do `CobrarAvariaInput`.
        prazoDias: { type: integer, minimum: 0, maximum: 365 }

    CobrarAvariaInput:
      type: object
      required: [contratoId]
      properties:
        contratoId: { type: string }
        # Dias até o vencimento, contados do dia de negócio de hoje.
        prazoDias: { type: integer, minimum: 0, maximum: 365 }
        # E214 — a razão escrita, quando o valor não cabe no teto da peça DESTE
        # contrato.
        #
        # Ela existe aqui, e não só no registro, para não haver beco: a avaria
        # pode ter nascido dentro de um teto e ser cobrada num contrato em que a
        # peça vale menos, estourando o teto novo. Sem esta porta, a única saída
        # seria APAGAR a avaria — e a foto dela é a prova que sustenta a cobrança
        # (E97/F23). É o mesmo ciclo sem saída que o E167 fechou do outro lado.
        #
        # Enviada, ela é GRAVADA na avaria e vai para a trilha: a decisão fica
        # onde a próxima leitura a encontra.
        #
        # O teto é o MESMO do `AvariaInput` (300), e de propósito: dois números
        # para o mesmo campo é a marca de que a decisão não foi tomada — a lição
        # do E186 sobre `CORPO_MAX_FOTO_VESTIDO` × `CORPO_MAX_AVARIA`.
        justificativaDaTaxa: { type: string, minLength: 1, maxLength: 300 }
    AvariaInput:
      type: object
      required: [descricao]
      properties:
        # S-O81/E191 — o teto do texto sai da CONTA do corpo, não do gosto.
        # Sem `maxLength` o único limite era o do parser: `CORPO_MAX_FOTO_BYTES`
        # cabe 3.848.880 bytes, então **3,8 MiB de descrição** entravam numa
        # avaria. A conta do E186 (`api-server/src/lib/limites.ts`) reserva
        # `ENVELOPE_MAX_BYTES` = 4.096 bytes para este campo, por decisão — e a
        # `limites-de-upload.test.ts` prega que ele cabe lá: 1.000 caracteres
        # custam no máximo 3.000 bytes (o pior caractere de TEXTO em UTF-8 tem 3,
        # como o travessão "—"), mais os 54 do envelope medido, dão 3.054 dos
        # 4.096 — e a folga de 1.042 paga a aspa que vira \" e a quebra de linha
        # que vira \n. Mil caracteres são ~200 palavras: a descrição mais longa
        # de uma avaria cabe com sobra, e a colagem acidental de um documento
        # inteiro passa a ouvir 400 em vez de virar linha no banco.
        descricao: { type: string, minLength: 1, maxLength: 1000 }
        # E214 — de qual cláusula a taxa sai. O default é DANO, o mesmo da
        # coluna: cliente antigo que não manda o campo continua registrando o
        # que sempre registrou.
        tipo: { type: string, enum: [LIMPEZA, DANO] }
        custoReparo: { type: number, minimum: 0 }
        # E214 — a razão escrita, obrigatória quando o valor sai da faixa.
        #
        # O teto de 300 sai da MESMA conta do `descricao` acima: os dois são
        # texto livre no corpo que carrega a foto, e o `ENVELOPE_MAX_BYTES` de
        # 4.096 tem de comportar os dois. 1.000 × 3 + 300 × 3 + 78 do envelope
        # medido = 3.979, com 117 de folga. A régua que prega esta conta é a
        # `limites-de-upload.test.ts`, e ela passou a somar OS DOIS campos —
        # antes media só a descrição, e mediria menos do que anunciava.
        justificativaDaTaxa: { type: string, minLength: 1, maxLength: 300 }
        # Foto-evidência opcional, base64 — mesma borda das fotos de vestido
        # (E3): mime e dimensões saem do BINÁRIO, nunca da palavra do cliente.
        fotoBase64: { type: string }

    # S-C11 — a CORREÇÃO da avaria. Os quatro campos de texto e de dinheiro do
    # nascimento, e só eles: a FOTO não entra.
    #
    # Trocar a prova não é corrigir um número — é substituir a evidência que
    # sustenta a cobrança, e o gesto que a sobra pede é o do zero a mais. Quem
    # precisar de outra foto registra outra avaria; a porta que apaga esta já
    # existe e já diz o que leva junto (E115).
    #
    # A gramática é a da casa (S-M10): **campo ausente é "não mexi"**, e `null`
    # APAGA — em `custoReparo` devolve a avaria a "ainda não avaliado" (E71), e
    # em `justificativaDaTaxa` tira a razão escrita. Os tetos de texto são os
    # MESMOS do `AvariaInput` (1.000 e 300), pelo motivo do E186: dois números
    # para o mesmo campo é a marca de que a decisão não foi tomada.
    AvariaUpdate:
      type: object
      properties:
        descricao: { type: string, minLength: 1, maxLength: 1000 }
        tipo: { type: string, enum: [LIMPEZA, DANO] }
        custoReparo: { type: ["number", "null"], minimum: 0 }
        justificativaDaTaxa: { type: ["string", "null"], maxLength: 300 }
    BloqueioVestidoUpdate:
      type: object
      properties:
        # S-O11 — a reserva aberta na noiva ERRADA não tinha conserto.
        #
        # A adoção do E162 só alcança a reserva SEM dona (`leadId` nulo): quem
        # escolheu a noiva errada no combobox ficava com a peça presa no nome de
        # outra, e o único caminho era apagar a reserva — que o E115 recusa
        # quando ela carrega prova, avaria ou contrato.
        #
        # O servidor recusa a troca com contrato ATIVO preso: ali o nome da
        # noiva já está no papel assinado.
        leadId: { type: ["string", "null"] }
        provaDataReal: { type: string, format: date-time }
        # E61: null EXPLÍCITO desfaz a movimentação registrada errada (a data
        # volta a "não aconteceu"); campo ausente segue significando "não mexa".
        retiradaDataReal: { type: ["string", "null"], format: date-time }
        devolucaoDataReal: { type: ["string", "null"], format: date-time }
        lavagemConcluidaEm: { type: ["string", "null"], format: date-time }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        observacao: { type: string }
    ConflitoBloqueio:
      type: object
      description: Item de conflito de disponibilidade (mesmo shape nos 409 e no batch)
      required: [bloqueioId, tipo, motivo, inicio, fim, leadId, reservaId, noivaNome]
      properties:
        bloqueioId: { type: string }
        tipo: { type: string, enum: [RESERVA_CASAMENTO, MANUTENCAO] }
        motivo: { type: string, enum: [USO, LAVAGEM, PROVA, MANUTENCAO, ATRASO_DEVOLUCAO] }
        inicio: { type: string, description: "Dia local inclusivo YYYY-MM-DD" }
        fim: { type: ["string", "null"], description: "Dia local inclusivo YYYY-MM-DD; null = janela aberta" }
        leadId: { type: ["string", "null"] }
        reservaId: { type: ["string", "null"] }
        noivaNome: { type: ["string", "null"] }
    DisponibilidadeVestidos:
      type: object
      required: [data, itens]
      properties:
        data: { type: string, description: "Dia local YYYY-MM-DD consultado" }
        itens:
          type: array
          items:
            type: object
            required: [vestidoId, disponivel, status, motivo, conflito]
            properties:
              vestidoId: { type: string }
              disponivel: { type: boolean }
              status: { type: string, enum: [DISPONIVEL, RESERVADO, MANUTENCAO, INATIVO] }
              motivo: { type: ["string", "null"], description: "Frase pronta em pt-BR (datas dd/MM)" }
              conflito:
                anyOf:
                  - $ref: "#/components/schemas/ConflitoBloqueio"
                  - type: "null"

    AuditoriaItem:
      type: object
      required: [id, acao, entidade, entidadeId, usuarioNome, criadoEm]
      properties:
        id: { type: string }
        # E107/S4 — `acao` é STRING ABERTA, e isso é a correção de uma
        # contradição entre camadas, não relaxamento.
        #
        # O schema do banco diz, desde o E10: "`acao` é texto versionado pela
        # aplicação, não pgEnum: **trilha nova não pode exigir migration para
        # existir**". E `ROTULO_ACAO` do front é frouxo de propósito — cai no
        # código cru — "porque tela velha lendo trilha nova não pode quebrar".
        #
        # O enum FECHADO aqui contradizia as duas coisas, e o preço não era uma
        # linha mal formatada: `ListAuditoriaResponse.parse()` estoura no
        # primeiro registro desconhecido e **a tela inteira da trilha morre**.
        # Aconteceu: uma linha `CONTA_PAGAR_REMOVIDA` no banco de dev derrubou
        # a lista toda, e a suíte E2E foi quem pegou.
        #
        # Os valores conhecidos vivem em `api-server/src/lib/auditoria.ts`
        # (`ACOES_AUDITORIA`), onde o TypeScript cobra o rótulo de cada um.
        acao:
          type: string
          description: >
            Código da ação, versionado pela aplicação (ver ACOES_AUDITORIA no
            api-server). Aberto de propósito: consumidor antigo lendo trilha
            nova mostra o código cru, nunca quebra.
        entidade: { type: string }
        entidadeId: { type: string }
        usuarioId: { type: ["string", "null"] }
        usuarioNome: { type: string, description: "Desnormalizado — sobrevive à saída do autor da equipe" }
        detalhe:
          type: ["object", "null"]
          additionalProperties: true
        criadoEm: { type: string, format: date-time }

    # S3 — a linha da trilha GLOBAL. Igual à `AuditoriaItem`, mais o `lojaId`
    # NULO que a define: o que não pertence a loja nenhuma. No caso da loja
    # apagada, o nulo é o que faz o registro existir — com o id dela, o CASCADE
    # o levaria junto no mesmo DELETE.
    AuditoriaGlobal:
      type: object
      required: [id, lojaId, acao, entidade, entidadeId, usuarioNome, criadoEm]
      properties:
        id: { type: string }
        lojaId:
          type: "null"
          description: "Sempre nulo — é o que define o ato global"
        acao: { type: string }
        entidade: { type: string }
        entidadeId: { type: string }
        usuarioId: { type: ["string", "null"] }
        usuarioNome: { type: string, description: "Quem fez, desnormalizado" }
        detalhe:
          type: ["object", "null"]
          additionalProperties: true
          description: "O NOME do que sumiu — depois do DELETE não há linha para consultar"
        criadoEm: { type: string, format: date-time }

    AutorAuditoria:
      type: object
      required: [usuarioId, nome, total]
      properties:
        usuarioId: { type: string }
        nome: { type: string, description: "O nome mais recente com que este autor aparece na trilha" }
        total: { type: integer, description: "Quantas linhas da trilha são dele" }

    ProximaJanelaVestido:
      type: object
      required: [proximaData, aPartirDe, horizonteDias]
      properties:
        proximaData:
          type: ["string", "null"]
          description: "Primeiro dia local (YYYY-MM-DD) em que uma reserva de casamento passaria; null = nada dentro do horizonte ou vestido inativo"
        aPartirDe: { type: string, description: "Dia local de onde a varredura partiu (hoje)" }
        horizonteDias: { type: integer }

    # ── Orçamentos ──
    # E162: uma linha da fila do gate — o aceite parado com o valor e a idade.
    OrcamentoAceitoSemContrato:
      type: object
      required: [orcamentoId, leadId, noivaNome, valor, aprovadoEm]
      properties:
        orcamentoId: { type: string }
        leadId: { type: string }
        noivaNome: { type: string }
        # O líquido da versão que a noiva aceitou (ou o vivo, para aprovação
        # manual sem versão) — é o dinheiro comprometido parado.
        valor: { type: number }
        # aceitoEm nulo = aprovação manual (o /aprovar não passa pelo aceite).
        aceitoEm: { type: ["string", "null"], format: date-time }
        aprovadoEm: { type: string, format: date-time }
        # Peças de acervo vendidas pelos itens que AINDA não têm reserva viva —
        # o tamanho do risco: 0 = só falta gerar o contrato.
        pecasSemReserva: { type: integer }
    Orcamento:
      type: object
      required: [id, lojaId, leadId, vendedoraId, status, createdAt]
      properties:
        id: { type: string }
        lojaId: { type: string }
        leadId: { type: string }
        atendimentoId: { type: ["string", "null"] }
        vendedoraId: { type: string }
        status: { type: string, enum: [RASCUNHO, ENVIADO, APROVADO, RECUSADO] }
        descontoTipo: { type: ["string", "null"], enum: [PERCENTUAL, VALOR, null] }
        descontoValor: { type: ["number", "null"] }
        validade: { type: ["string", "null"], format: date-time }
        observacoes: { type: ["string", "null"] }
        # Link público (E13). O token aparece aqui para a vendedora RE-COPIAR
        # o link sem regenerar (mesmo padrão da listagem de convites) — a rota
        # é autenticada e gateada por módulo.
        publicoToken: { type: ["string", "null"] }
        publicoExpiraEm: { type: ["string", "null"], format: date-time }
        publicoAbertoEm: { type: ["string", "null"], format: date-time }
        # E74: o aceite digital — instante e a versão (E75) que a noiva aceitou.
        aceitoEm: { type: ["string", "null"], format: date-time }
        aceiteVersao: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        # E63: a rota sempre embutiu a noiva (`with: lead`), mas o contrato a
        # descartava — e a lista baixava TODOS os leads só para rotular linhas.
        lead:
          $ref: "#/components/schemas/Lead"
        itens:
          type: array
          items:
            $ref: "#/components/schemas/OrcamentoItem"
        # E124/S-D5: o líquido do orçamento, agregado no servidor pela régua
        # única (`liquidoEmCentavos`) — a listagem baixava os `itens` da
        # história inteira sem desenhar valor nenhum; agora desce só o número
        # que o card mostra.
        valorTotal: { type: number }
    OrcamentosPage:
      type: object
      required: [itens, total]
      properties:
        total: { type: integer }
        itens:
          type: array
          items:
            $ref: "#/components/schemas/Orcamento"
    OrcamentoInput:
      type: object
      required: [leadId]
      properties:
        leadId: { type: string }
        atendimentoId: { type: string }
        # Sem vendedoraId: a autoria vem da sessão autenticada, nunca do corpo
        # — mesma regra do registro de cobrança.
        descontoTipo: { type: string, enum: [PERCENTUAL, VALOR] }
        # S-M23: negativo virava desconto que COBRA a mais (−10% = ×1,10). O
        # teto do PERCENTUAL (100) é guarda de rota — VALOR pode exceder o bruto
        # legitimamente, o clamp decide.
        descontoValor: { type: number, minimum: 0 }
        validade: { type: string, format: date-time }
        observacoes: { type: string }
    OrcamentoUpdate:
      type: object
      properties:
        descontoTipo: { type: string, enum: [PERCENTUAL, VALOR] }
        # S-M23: negativo virava desconto que COBRA a mais (−10% = ×1,10). O
        # teto do PERCENTUAL (100) é guarda de rota — VALOR pode exceder o bruto
        # legitimamente, o clamp decide.
        descontoValor: { type: number, minimum: 0 }
        validade: { type: string, format: date-time }
        observacoes: { type: string }
        status: { type: string, enum: [RASCUNHO, ENVIADO, APROVADO, RECUSADO] }
    OrcamentoItem:
      type: object
      required: [id, orcamentoId, tipo, descricao, valorUnitario, quantidade]
      properties:
        id: { type: string }
        orcamentoId: { type: string }
        tipo: { type: string, enum: [VESTIDO, ACESSORIO, ESTOQUE, SERVICO, AJUSTE] }
        vestidoId: { type: ["string", "null"] }
        itemEstoqueId: { type: ["string", "null"] }
        ajusteId: { type: ["string", "null"] }
        descricao: { type: string }
        valorUnitario: { type: number }
        quantidade: { type: integer }
    OrcamentoItemInput:
      type: object
      required: [tipo, descricao, valorUnitario]
      properties:
        tipo: { type: string, enum: [VESTIDO, ACESSORIO, ESTOQUE, SERVICO, AJUSTE] }
        vestidoId: { type: string }
        itemEstoqueId: { type: string }
        # E155: o item AJUSTE que cobra uma confecção aponta o trabalho na fila
        # da costureira — o que foi cobrado e o que alguém costura viram a
        # mesma coisa.
        ajusteId: { type: string }
        descricao: { type: string, minLength: 1 }
        # S-M23 (achados 1#1/5#2): sem piso, quantidade −1 SUBTRAÍA do total —
        # R$ 200,00 de serviço viravam desconto silencioso que contrato, aceite
        # e carnê validavam em cadeia. O editar sempre teve o minimum.
        valorUnitario: { type: number, minimum: 0 }
        quantidade: { type: integer, minimum: 1 }
    OrcamentoItemUpdate:
      type: object
      properties:
        descricao: { type: string, minLength: 1 }
        valorUnitario: { type: number, minimum: 0 }
        quantidade: { type: integer, minimum: 1 }
    LinkOrcamentoPublico:
      type: object
      required: [token, expiraEm]
      properties:
        token: { type: string }
        expiraEm: { type: string, format: date-time }
    OrcamentoPublicoItem:
      type: object
      required: [tipo, descricao, valorUnitario, quantidade]
      properties:
        tipo: { type: string, enum: [VESTIDO, ACESSORIO, ESTOQUE, SERVICO, AJUSTE] }
        descricao: { type: string }
        valorUnitario: { type: number }
        quantidade: { type: integer }
    OrcamentoPublico:
      # A visão da NOIVA: nomes e valores, nenhum id interno — o que ela não
      # precisa navegar, não precisa vazar.
      type: object
      required: [lojaNome, noivaNome, status, itens, totalBruto, totalLiquido]
      properties:
        lojaNome: { type: string }
        noivaNome: { type: string }
        status: { type: string, enum: [RASCUNHO, ENVIADO, APROVADO, RECUSADO] }
        validade: { type: ["string", "null"], format: date-time }
        observacoes: { type: ["string", "null"] }
        descontoTipo: { type: ["string", "null"], enum: [PERCENTUAL, VALOR, null] }
        descontoValor: { type: ["number", "null"] }
        totalBruto: { type: number }
        totalLiquido: { type: number }
        # E75: o que a noiva vê é a última versão ENVIADA, nunca o rascunho
        # vivo. null = orçamento anterior ao versionamento (mostra o vivo).
        versaoNumero: { type: ["integer", "null"] }
        # E74: quando ela já aceitou, a página vira comprovante.
        aceitoEm: { type: ["string", "null"], format: date-time }
        itens:
          type: array
          items:
            $ref: "#/components/schemas/OrcamentoPublicoItem"

    # ── Portal da noiva (E78) ──
    PortalNoiva:
      # A visão da NOIVA, como no OrcamentoPublico: nomes e valores, nenhum id
      # interno além do vestidoId (necessário para pedir a foto). NUNCA dados
      # de outra noiva ou da loja.
      type: object
      required: [noivaNome, lojaNome, lojaEndereco, lojaTelefone, orcamento, lookbook, provas, parcelas, recibos, contrato, vestido]
      properties:
        noivaNome: { type: string }
        lojaNome: { type: string }
        # E100/F35: o portal mandava "falar com a sua vendedora" três vezes e
        # não tinha um link para falar com ninguém. Estes dois são o caminho de
        # volta — e são os dados PÚBLICOS da loja, os mesmos que ela põe na
        # vitrine e no Instagram. O telefone da VENDEDORA continua fora daqui:
        # a fronteira do cuidado (a) do épico é loja sim, pessoa não.
        lojaEndereco: { type: ["string", "null"] }
        lojaTelefone: { type: ["string", "null"] }
        # E100/F36: as duas perguntas que ela abre o link para responder —
        # "quanto falta" e "quando é a próxima". Estavam a uma soma de
        # distância num carnê de oito linhas lido no celular, e cada uma delas
        # voltava como mensagem de WhatsApp para a vendedora.
        # `null` quando não há contrato ativo: um "falta pagar R$ 0,00"
        # afirmaria algo sobre um acordo que não existe.
        resumoPagamento:
          anyOf:
            - type: object
              required: [faltaPagar]
              properties:
                faltaPagar: { type: number }
                proximaEm: { type: ["string", "null"], format: date-time }
                proximaValor: { type: ["number", "null"] }
            - type: "null"
        # A proposta mais recente ENVIADA/APROVADA — o mesmo shape do link E13,
        # com aceite E74. null = ainda não há proposta para mostrar.
        orcamento:
          anyOf:
            - $ref: "#/components/schemas/OrcamentoPublico"
            - type: "null"
        # O lookbook dos vestidos provados (E21), fotos servidas por
        # /portal/foto com ESTE token. null = nunca montaram um para ela.
        lookbook:
          anyOf:
            - type: object
              required: [vestidos]
              properties:
                vestidos:
                  type: array
                  items:
                    $ref: "#/components/schemas/LookbookPublicoVestido"
            - type: "null"
        # As próximas provas (futuras, ordenadas). Passadas ficam de fora: o
        # portal aponta para a frente. O `id` existe para o E85: a noiva
        # confirma a presença por POST /portal/provas/{id}/confirmar.
        provas:
          type: array
          items:
            type: object
            required: [id, inicio]
            properties:
              id: { type: string }
              inicio: { type: string, format: date-time }
              confirmadoEm: { type: ["string", "null"], format: date-time }
              # F37: sem isto o portal não saberia que ela já avisou, e ofereceria
              # o botão de novo — a noiva clicaria duas vezes achando que a
              # primeira não valeu.
              remarcacaoPedidaEm: { type: ["string", "null"], format: date-time }
        # O extrato DELA, só leitura — pagar continua com a loja. Vazio antes
        # do contrato.
        parcelas:
          type: array
          items:
            $ref: "#/components/schemas/PortalParcela"
        # E221 — os comprovantes da cláusula 7ª ("a LOCADORA deverá fornecer
        # todos os recibos de pagamentos efetuados"). Um por RECEBIMENTO, e não
        # por parcela: uma parcela deste sistema recebe em pedaços, e o
        # pagamento de R$ 300,00 de hoje tem de ter o recibo DELE hoje.
        # Vazio antes do contrato, e vazio para quem nunca pagou nada.
        recibos:
          type: array
          items:
            $ref: "#/components/schemas/PortalRecibo"
        # E100/F21: o contrato assinado é o documento que ela mais vai querer
        # rever, e era o único artefato do sistema sem caminho até ela — o PDF
        # só descia no computador da loja. O snapshot de itens já existe em
        # `contrato_itens`; o PDF desce por GET /portal/contrato-pdf, com o
        # MESMO token. `null` = não há contrato ATIVO (só a proposta).
        #
        # O desconto vem junto pelo mesmo motivo do OrcamentoPublico: com ele,
        # a soma dos itens NÃO é o total, e um contrato que não fecha na tela
        # dela é pior que nenhum.
        contrato:
          anyOf:
            - type: object
              required: [valorTotal, totalBruto, fechadoEm, itens]
              properties:
                valorTotal: { type: number }
                totalBruto: { type: number }
                descontoTipo:
                  anyOf:
                    - type: string
                      enum: [PERCENTUAL, VALOR]
                    - type: "null"
                descontoValor: { type: ["number", "null"] }
                fechadoEm: { type: string, format: date-time }
                dataCasamento: { type: ["string", "null"], format: date-time }
                itens:
                  type: array
                  items:
                    $ref: "#/components/schemas/OrcamentoPublicoItem"
            - type: "null"
        # E100/F39: "que dia eu pego o vestido?" e "os ajustes ficaram prontos?"
        # são as perguntas das duas fases mais ansiosas dela, e o portal parava
        # na fase comercial. Dos ajustes sai só descrição e pronto/em andamento
        # — o CHECKLIST interno é a conversa da costureira com a loja, e não a
        # dela. `null` = não há vestido reservado no contrato ativo.
        vestido:
          anyOf:
            - type: object
              required: [vestidoId, nome, fotos, ajustes]
              properties:
                vestidoId: { type: string }
                nome: { type: string }
                fotos:
                  type: array
                  items:
                    type: object
                    required: [ordem, atualizadaEm]
                    properties:
                      ordem: { type: integer }
                      atualizadaEm: { type: string, format: date-time }
                # A data combinada no contrato; `retiradaFeitaEm` preenchido diz
                # que já aconteceu, e aí a promessa vira registro.
                retiradaPrevista: { type: ["string", "null"], format: date-time }
                retiradaFeitaEm: { type: ["string", "null"], format: date-time }
                ajustes:
                  type: array
                  items:
                    type: object
                    required: [descricao, pronto]
                    properties:
                      descricao: { type: string }
                      pronto: { type: boolean }
            - type: "null"
    PortalParcela:
      type: object
      required: [numero, descricao, valorPrevisto, valorRecebido, vencimento, status]
      properties:
        numero: { type: integer }
        descricao: { type: ["string", "null"] }
        valorPrevisto: { type: number }
        valorRecebido: { type: ["number", "null"] }
        vencimento: { type: string, format: date-time }
        status: { type: string, enum: [PREVISTA, PARCIAL, PAGA, CANCELADA] }
        # E213 — a multa e os juros da cláusula 9ª, na tela que a NOIVA abre.
        #
        # A decisão da dona foi automático: a parcela vencida já mostra o valor
        # atualizado aqui, e não só na fila da loja. Ela é a devedora — descobrir
        # o acréscimo só quando a vendedora manda a mensagem é a mesma classe de
        # defeito que o E211 fechou do outro lado (o preço que aparece depois do
        # gesto). A `explicacao` vem junto porque um número maior sem conta ao
        # lado é o que gera a ligação para a loja.
        mora:
          anyOf:
            - $ref: "#/components/schemas/MoraDaParcela"
            - type: "null"
    PortalRecibo:
      # E221 — o recibo como a NOIVA o vê: o bastante para escolher qual PDF
      # baixar. Quem LANÇOU o recebimento fica de fora, pela mesma fronteira do
      # rodapé (F35): a loja sim, a pessoa não.
      #
      # O `id` é o da linha da trilha — o recebimento individual só existe lá,
      # porque a parcela guarda o acumulado. É o que vai em
      # GET /portal/recibo-pdf?reciboId=.
      type: object
      required: [id, parcela, valor, valorNaParcela, mora, pagoEm, forma]
      properties:
        id: { type: string }
        # "Entrada" ou "Parcela 3" — o rótulo do MOMENTO do pagamento. O
        # `gerar-plano` renumera as parcelas depois (P2/E94), e o recibo tem de
        # continuar dizendo o que a noiva viu no dia.
        parcela: { type: string }
        # O que entrou NESTE pagamento, não o acumulado da parcela.
        valor: { type: number }
        # S-C50 — um pagamento pode quitar DUAS linhas: a parcela e a multa da
        # cláusula 9ª (E213). O papel é UM, e diz a divisão — senão a noiva lê
        # R$ 515,00 ao lado de uma parcela de R$ 500,00 sem explicação, que é a
        # mesma classe de defeito da S-C34.
        valorNaParcela: { type: number }
        mora: { type: number }
        # O dia do PAGAMENTO (`recebidoEm`), que pode ser anterior ao
        # lançamento: o dinheiro entrou no sábado, a loja lançou na segunda.
        pagoEm: { type: string, format: date-time }
        forma: { type: ["string", "null"], enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO, BOLETO, TRANSFERENCIA, OUTRO, null] }
    PortalStatus:
      # O card da ficha da vendedora: gerar/copiar/revogar, "último acesso há X".
      type: object
      required: [token, expiraEm, criadoEm, revogadoEm, ultimoAcessoEm]
      properties:
        token: { type: string }
        expiraEm: { type: string, format: date-time }
        criadoEm: { type: string, format: date-time }
        revogadoEm: { type: ["string", "null"], format: date-time }
        ultimoAcessoEm: { type: ["string", "null"], format: date-time }

    # ── Recibos (E221, cláusula 7ª) ──
    Recibo:
      # O recibo como a LOJA o vê: tudo o que a noiva vê, mais quem lançou o
      # recebimento e a posição da parcela depois dele (acumulado e saldo) —
      # que é o que a vendedora precisa para responder "e o resto?".
      #
      # Não há tabela de recibos, e isso é decisão: o recebimento individual
      # existe numa linha de trilha (`PARCELA_RECEBIDA`, escrita na MESMA
      # transação do dinheiro), enquanto a parcela guarda só o acumulado. Uma
      # tabela nova seria o mesmo fato gravado duas vezes. A razão inteira, e a
      # conciliação que impede o papel de sair quando as duas divergem, estão
      # em `lib/recibo-do-papel.ts`.
      type: object
      required: [id, parcelaId, contratoId, parcela, valor, valorNaParcela, mora, pagoEm, forma, lancadoPor, totalRecebido, saldoRestante]
      properties:
        id: { type: string }
        parcelaId: { type: string }
        contratoId: { type: string }
        parcela: { type: string }
        # O que a noiva pagou neste ato.
        valor: { type: number }
        # S-C50 — para onde ele foi: `valorNaParcela` é o que quitou a parcela
        # (e é o que a conciliação compara com o `valorRecebido` dela) e `mora`
        # é o que a cláusula 9ª levou para a linha de origem MORA (E213).
        valorNaParcela: { type: number }
        mora: { type: number }
        pagoEm: { type: string, format: date-time }
        forma: { type: ["string", "null"], enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO, BOLETO, TRANSFERENCIA, OUTRO, null] }
        lancadoPor: { type: string }
        totalRecebido: { type: number }
        saldoRestante: { type: number }

    # ── Contratos ──
    Contrato:
      type: object
      required: [id, lojaId, leadId, vendedoraId, status, valorTotal, fechadoEm]
      properties:
        id: { type: string }
        lojaId: { type: string }
        leadId: { type: string }
        orcamentoId: { type: ["string", "null"] }
        # Legado 1:1 — lido, nunca mais escrito. O vínculo vivo é o array (E72).
        bloqueioVestidoId: { type: ["string", "null"] }
        # E72: as reservas físicas presas por este contrato (contrato_bloqueios).
        bloqueioVestidoIds:
          type: array
          items: { type: string }
        vendedoraId: { type: string }
        status: { type: string, enum: [ATIVO, CANCELADO] }
        cpf: { type: ["string", "null"] }
        vestidoDescricao: { type: ["string", "null"] }
        valorTotal: { type: number }
        # Desconto congelado do orçamento. valorTotal é o líquido; estes dão a
        # proveniência e permitem a linha "Desconto" reconciliar itens × total.
        descontoTipo: { type: ["string", "null"], enum: [PERCENTUAL, VALOR, null] }
        descontoValor: { type: ["number", "null"] }
        formaPagamento: { type: ["string", "null"], enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO, BOLETO, TRANSFERENCIA, OUTRO, null] }
        canceladoMotivo: { type: ["string", "null"] }
        canceladoEm: { type: ["string", "null"], format: date-time }
        dataCasamento: { type: ["string", "null"], format: date-time }
        # E211 — quantas trocas de data JÁ FORAM COBRADAS (cláusula 17ª §3º).
        # A tela precisa dele para avisar o valor ANTES de mover: sem o degrau,
        # ela não sabe se a próxima troca custa 10, 20 ou 30 por cento.
        reajustesDeData: { type: integer }
        dataRetirada: { type: ["string", "null"], format: date-time }
        dataDevolucao: { type: ["string", "null"], format: date-time }
        observacoes: { type: ["string", "null"] }
        fechadoEm: { type: string, format: date-time }
        parcelas:
          type: array
          items:
            $ref: "#/components/schemas/Parcela"
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ContratoItem"
        lead:
          $ref: "#/components/schemas/Lead"
        vendedora:
          $ref: "#/components/schemas/Usuario"
    ContratosPage:
      type: object
      required: [itens, total]
      properties:
        total: { type: integer }
        itens:
          type: array
          items:
            $ref: "#/components/schemas/Contrato"
    ContratoItem:
      type: object
      required: [id, lojaId, contratoId, tipo, descricao, valorUnitario, quantidade]
      properties:
        id: { type: string }
        lojaId: { type: string }
        contratoId: { type: string }
        tipo: { type: string, enum: [VESTIDO, ACESSORIO, ESTOQUE, SERVICO, AJUSTE] }
        vestidoId: { type: ["string", "null"] }
        itemEstoqueId: { type: ["string", "null"] }
        descricao: { type: string }
        valorUnitario: { type: number }
        quantidade: { type: integer }
    ContratoInput:
      type: object
      required: [leadId, vendedoraId, valorTotal]
      properties:
        leadId: { type: string }
        orcamentoId: { type: string }
        # Legado 1:1 — aceito por compatibilidade; prefira o array (E72).
        bloqueioVestidoId: { type: string }
        # E72: N reservas físicas (vestido + véu + segunda peça) presas pelo
        # contrato. Cada uma é validada (loja, data coerente, disponível) e o
        # cancelamento libera todas.
        bloqueioVestidoIds:
          type: array
          items: { type: string }
        vendedoraId: { type: string }
        cpf: { type: string }
        vestidoDescricao: { type: string }
        # S-M23 (achado 5#4 + nota do ângulo 1): a parcela avulsa exige piso
        # desde sempre — o carnê que entra pelo POST /contratos não exigia, e
        # uma parcela de −R$ 1.000,00 compensada passava na guarda de SOMA:
        # nascia PREVISTA e impagável, com o horizonte inflado em R$ 1.000,00
        # (o saldoAberto clampa o negativo em zero).
        valorTotal: { type: number, minimum: 0.01 }
        formaPagamento: { type: string, enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO, BOLETO, TRANSFERENCIA, OUTRO] }
        dataCasamento: { type: string, format: date-time }
        dataRetirada: { type: string, format: date-time }
        dataDevolucao: { type: string, format: date-time }
        observacoes: { type: string }
        parcelas:
          type: array
          items:
            type: object
            required: [numero, valorPrevisto, vencimento]
            properties:
              numero: { type: integer, minimum: 0 }
              descricao: { type: string }
              valorPrevisto: { type: number, minimum: 0.01 }
              vencimento: { type: string, format: date-time }
    ContratoUpdate:
      type: object
      properties:
        cpf: { type: string }
        vestidoDescricao: { type: string }
        formaPagamento: { type: string, enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO, BOLETO, TRANSFERENCIA, OUTRO] }
        dataCasamento: { type: string, format: date-time }
        dataRetirada: { type: string, format: date-time }
        dataDevolucao: { type: string, format: date-time }
        observacoes: { type: string }
    CancelarContratoInput:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1 }
        # O que fazer com parcelas já PAGAS: "manter" (noiva perdeu o sinal —
        # ficam PAGAS no caixa, default) ou "estornar" (valor devolvido —
        # viram CANCELADA com campos de recebimento zerados).
        destinoPago: { type: string, enum: [manter, estornar] }
    # E95: o carnê é MENSAL POR DIA FIXO, com o grampo de fim de mês (dia 31
    # vira 28/02 e volta a 31/03). `periodicidadeDias` saiu: ela permitia
    # espaçar por N dias corridos, o que fazia o dia do vencimento andar todo
    # mês e a competência deixar de ser previsível — e era o default de 30 que
    # divergia da tela, o único caminho que a loja usa de verdade.
    GerarPlanoInput:
      type: object
      required: [numParcelas, primeiroVencimento]
      properties:
        entrada: { type: number, minimum: 0 }
        numParcelas: { type: integer, minimum: 1, maximum: 360 }
        # A data da PARCELA 1 — nunca a da entrada, mesmo quando há entrada.
        primeiroVencimento: { type: string, format: date-time }
        # A entrada tem data própria; ausente, é hoje no fuso da loja.
        vencimentoEntrada: { type: string, format: date-time }

    # ── Financeiro ──
    Parcela:
      type: object
      required: [id, lojaId, contratoId, numero, valorPrevisto, vencimento, status, origem]
      properties:
        id: { type: string }
        lojaId: { type: string }
        contratoId: { type: string }
        numero: { type: integer }
        descricao: { type: ["string", "null"] }
        valorPrevisto: { type: number }
        vencimento: { type: string, format: date-time }
        # S26/S-M19: de onde a parcela veio. O servidor decide "já tem carnê?"
        # por `origem === PLANO` desde a S26 — sem o campo aqui, o Zod de
        # resposta STRIPAVA a coluna e a tela voltava a perguntar
        # `parcelas.length > 0`: um reparo de avaria cobrado antes do carnê
        # sumia com o "Gerar plano" para sempre.
        # E213 achou o buraco que o E212 abriu: `ATRASO_DEVOLUCAO` entrou no
        # enum do BANCO e não entrou aqui, e o Zod de resposta não estripa
        # valor fora do enum — ele EXPLODE. Medido:
        # `Invalid enum value. Expected 'PLANO' | 'AVULSA' | 'AVARIA' |
        # 'REAJUSTE_DATA', received 'ATRASO_DEVOLUCAO'`. Cobrado o primeiro
        # atraso, toda listagem de parcelas que o incluísse respondia 500 — a
        # fila de cobrança, o carnê e o extrato do portal de uma vez. A
        # `varredura-enums-do-banco-no-spec` passou a pregar as duas listas.
        origem: { type: string, enum: [PLANO, AVULSA, AVARIA, REAJUSTE_DATA, ATRASO_DEVOLUCAO, MORA] }
        # PARCIAL (E49): a noiva pagou parte. O dinheiro entrou no caixa e o
        # resto (valorPrevisto − valorRecebido) segue cobrável.
        status: { type: string, enum: [PREVISTA, PARCIAL, PAGA, CANCELADA] }
        valorRecebido: { type: ["number", "null"], description: "Acumulado desta parcela, somando todos os recebimentos" }
        recebidoEm: { type: ["string", "null"], format: date-time }
        formaRecebimento: { type: ["string", "null"], enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO, BOLETO, TRANSFERENCIA, OUTRO, null] }
        # F32/E103: casou com uma linha do extrato do banco. É a memória que a
        # conciliação não tinha — sem ela, as divergências já perdoadas voltam
        # todo mês indistinguíveis das novas. O ESTORNO limpa: movimento que
        # deixou de existir não pode continuar conferido.
        conciliadoEm: { type: ["string", "null"], format: date-time }
        # E213 — a multa e os juros da cláusula 9ª, DERIVADOS a cada leitura.
        #
        # Nulo é a resposta da parcela em dia e da já quitada, que juntas são a
        # esmagadora maioria. Não é coluna: o valor cresce todo dia, e gravá-lo
        # estaria errado a partir da meia-noite seguinte — o que o banco guarda
        # é o PERDÃO (`moraPerdoadaEm`), que é um fato datado.
        mora:
          anyOf:
            - $ref: "#/components/schemas/MoraDaParcela"
            - type: "null"
        # E213 — quando alguém perdoou a multa e os juros, e por quê. O motivo
        # vem junto porque é por ele que a tela desenha o selo: só na trilha, a
        # próxima leitura veria uma parcela vencida sem acréscimo e sem
        # explicação ao lado (lição do E214).
        moraPerdoadaEm: { type: ["string", "null"], format: date-time }
        moraPerdoadaMotivo: { type: ["string", "null"] }
        # Quem é a noiva desta parcela, sem rebuscar todos os contratos: a
        # cobrança junta por aqui. Presente no GET da lista; ausente nas
        # respostas de receber/estornar (que devolvem a parcela seca).
        contrato:
          anyOf:
            - $ref: "#/components/schemas/ParcelaContrato"
            - type: "null"
    # E213 — a conta da cláusula 9ª sobre uma parcela vencida.
    #
    # A base é a PARCELA (decisão da dona, 13/08/2026, sustentada pelo CDC art.
    # 52 §1º: a multa de mora não passa de 2% do valor da PRESTAÇÃO), e não o
    # contrato inteiro que a letra da cláusula diz — a diferença é de 10×, e a
    # leitura literal cobraria os 2% do contrato de novo a cada parcela
    # atrasada.
    MoraDaParcela:
      type: object
      required: [dias, saldo, multa, juros, acrescimo, total, perdoada]
      properties:
        dias: { type: integer }
        # O saldo VENCIDO sobre o qual a conta incide — o previsto menos o que
        # já entrou, e não o previsto cheio.
        saldo: { type: number }
        # 2%, uma vez. Não cresce com o tempo: quem atrasa 1 dia e quem atrasa
        # 60 pagam a mesma multa, e juros diferentes.
        multa: { type: number }
        # 1% ao mês, *pro rata die* sobre 30 dias.
        juros: { type: number }
        acrescimo: { type: number }
        # Saldo + acréscimo: o que a noiva deve HOJE.
        total: { type: number }
        # Perdoada devolve objeto com acréscimo ZERO, e não nulo: a tela precisa
        # dizer "multa e juros perdoados" em vez de não mostrar nada, senão o
        # perdão vira invisível e a próxima leitura estranha o saldo.
        perdoada: { type: boolean }
        # A frase única — a tela imprime esta, e a trilha grava esta. Ela diz o
        # que a conta TEM e o que ela NÃO tem: a correção monetária da cláusula
        # não é calculada porque o contrato não nomeia índice (P4).
        explicacao: { type: string }
    PerdoarMoraInput:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1, maxLength: 300 }
    ParcelaContrato:
      type: object
      required: [leadId]
      properties:
        leadId: { type: string }
        lead:
          anyOf:
            - $ref: "#/components/schemas/ParcelaLead"
            - type: "null"
    # S-D37: o recorte da noiva que a parcela carrega. Era o Lead INTEIRO —
    # etapa, casamento, motivo de perda, interesse — para uma fila que consome
    # nome, WhatsApp e leadId. O `ultimoContatoEm` (S-D13) é o mesmo agregado
    # que o Lead da listagem já traz (max(contatoData) de registros_cobranca):
    # é ele que deixa a marca de "cobrada hoje" sobreviver ao F5 — a tela
    # compara contra o dia no fuso da loja, não contra "houve contato algum".
    ParcelaLead:
      type: object
      required: [noivaNome]
      properties:
        noivaNome: { type: string }
        whatsapp: { type: ["string", "null"] }
        ultimoContatoEm: { type: ["string", "null"], format: date-time }
    ReceberParcelaInput:
      type: object
      required: [valorRecebido, recebidoEm]
      properties:
        # O que entrou AGORA, não o total (E49): receber duas vezes acumula, e o
        # acumulado é que decide entre PARCIAL e PAGA. Valor acima do que falta
        # é recusado (422) em vez de aceito — inflaria o caixa realizado.
        # O piso é um centavo (E115): −700 passava pelo único guard do servidor
        # (o teto) e gravava −R$ 700,00 no caixa realizado; 0 virava PARCIAL
        # "recebida" sem dinheiro. O piso morava só na tela, que é exatamente a
        # régua que o E91 disse que não pode morar só no cliente.
        valorRecebido: { type: number, minimum: 0.01 }
        recebidoEm: { type: string, format: date-time }
        formaRecebimento: { type: string, enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO, BOLETO, TRANSFERENCIA, OUTRO] }
    ContaPagar:
      type: object
      required: [id, lojaId, tipo, descricao, valorPrevisto, vencimento, status]
      properties:
        id: { type: string }
        lojaId: { type: string }
        tipo: { type: string, enum: [DESPESA, FORNECEDOR, SALARIO, COMISSAO] }
        colaboradorId: { type: ["string", "null"] }
        competencia: { type: ["string", "null"] }
        descricao: { type: string }
        categoria: { type: ["string", "null"] }
        fornecedor: { type: ["string", "null"] }
        valorPrevisto: { type: number }
        vencimento: { type: string, format: date-time }
        status: { type: string, enum: [PREVISTA, PAGA] }
        # Rastro da geração (E48): preenchido só nas contas que nasceram de uma
        # recorrência. É o que deixa a tela separar o que o motor lançou do que
        # alguém digitou à mão na mesma competência.
        recorrenciaId: { type: ["string", "null"] }
        # E93/D2: a saída de caixa que quitou esta conta. Só o LISTAR preenche
        # (é um join), e só em conta PAGA. `valor` é a fatia RATEADA desta
        # conta (pagamento_itens.valor), não o previsto: quando a saída diverge
        # da soma das contas, é este o dinheiro que de fato saiu. `contas` é
        # quantas contas a mesma saída quitou — a tela avisa antes de estornar.
        pagamento:
          type: ["object", "null"]
          required: [id, data, valor, contas]
          properties:
            id: { type: string }
            data: { type: string, format: date-time }
            forma: { type: ["string", "null"] }
            valor: { type: number }
            contas: { type: integer }
    ContaPagarInput:
      type: object
      required: [tipo, descricao, valorPrevisto, vencimento]
      properties:
        tipo: { type: string, enum: [DESPESA, FORNECEDOR, SALARIO, COMISSAO] }
        colaboradorId: { type: string }
        competencia: { type: string }
        descricao: { type: string, minLength: 1 }
        categoria: { type: string }
        fornecedor: { type: string }
        # S-M23 (achado 5#3): a anatomia da S-M2 nas portas de CRIAÇÃO — uma
        # conta de −R$ 3.200,00 AUMENTAVA o caixa projetado e calava o alerta.
        valorPrevisto: { type: number, minimum: 0.01 }
        vencimento: { type: string, format: date-time }
    PagarContaInput:
      type: object
      required: [data, valorPago]
      properties:
        data: { type: string, format: date-time }
        # Piso de um centavo (E115): uma saída negativa entraria no caixa como
        # dinheiro voltando. (O comentário original dizia "como a porta irmã
        # PagamentoInput já tinha" — não tinha: ela ficou em `minimum: 0` até a
        # S-M2, quitando conta com R$ 0,00.)
        valorPago: { type: number, minimum: 0.01 }
        forma: { type: string }
        observacoes: { type: string }
    # Uma saída de caixa quita N contas (pagamento_itens já modela o rateio).
    # Sem valorPago: a saída vale a soma das contas quitadas.
    PagamentoInput:
      type: object
      required: [data, contaIds]
      properties:
        data: { type: string, format: date-time }
        contaIds:
          type: array
          minItems: 1
          items: { type: string }
        # S-M2 — o MESMO piso da porta irmã PagarContaInput, de verdade agora:
        # `minimum: 0` aceitava quitar uma conta de R$ 3.200,00 com saída de
        # ZERO no caixa. O zod gerado daqui é a única validação do servidor; o
        # guard de um centavo existia só no navegador. Omitir continua valendo
        # (a saída vale a soma das contas) — o piso só morde valor presente.
        valorPago: { type: number, minimum: 0.01 }
        forma: { type: string }
        observacoes: { type: string }
    PagamentoItem:
      type: object
      required: [id, lojaId, pagamentoId, contaPagarId, valor]
      properties:
        id: { type: string }
        lojaId: { type: string }
        pagamentoId: { type: string }
        contaPagarId: { type: string }
        valor: { type: number }
        contaPagar:
          $ref: "#/components/schemas/ContaPagar"
    # O caixa REALIZADO: até a Onda 3 pagamentos era write-only (gravado no
    # POST …/pagar e nunca lido de volta). É a fonte do fluxo, do regime-caixa
    # do DRE, do saldoHoje da projeção e do histórico da folha.
    MarcarConciliadoInput:
      type: object
      properties:
        parcelaIds:
          type: array
          items: { type: string }
        pagamentoIds:
          type: array
          items: { type: string }
    MarcarConciliadoResultado:
      type: object
      required: [parcelas, pagamentos]
      properties:
        parcelas: { type: integer, description: "Quantas parcelas passaram de nao-conciliadas a conciliadas" }
        pagamentos: { type: integer }
    Pagamento:
      type: object
      required: [id, lojaId, data, valorPago]
      properties:
        id: { type: string }
        lojaId: { type: string }
        colaboradorId: { type: ["string", "null"] }
        data: { type: string, format: date-time }
        valorPago: { type: number }
        forma: { type: ["string", "null"] }
        observacoes: { type: ["string", "null"] }
        enviadoContabilidadeEm: { type: ["string", "null"], format: date-time }
        # F32/E103 — e NÃO é o mesmo fato que o de cima: conciliado é "bateu com
        # o banco", enviado é "declarei à contabilidade". Um existe sem o outro
        # nas duas direções.
        conciliadoEm: { type: ["string", "null"], format: date-time }
        colaborador:
          anyOf:
            - $ref: "#/components/schemas/Usuario"
            - type: "null"
        itens:
          type: array
          items:
            $ref: "#/components/schemas/PagamentoItem"
    # O que se repete todo mês (E48). `tipo` decide quais campos importam:
    # SALARIO usa `usuarioId` e deriva a descrição de quem recebe; DESPESA e
    # FORNECEDOR usam `descricao` (e, se quiserem, categoria/fornecedor).
    Recorrencia:
      type: object
      required: [id, lojaId, tipo, valor, diaVencimento, ativo]
      properties:
        id: { type: string }
        lojaId: { type: string }
        tipo: { type: string, enum: [SALARIO, DESPESA, FORNECEDOR] }
        usuarioId: { type: ["string", "null"] }
        descricao: { type: ["string", "null"] }
        categoria: { type: ["string", "null"] }
        fornecedor: { type: ["string", "null"] }
        valor: { type: number }
        diaVencimento: { type: integer }
        ativo: { type: boolean }
    RecorrenciaInput:
      type: object
      required: [tipo, valor, diaVencimento]
      properties:
        tipo: { type: string, enum: [SALARIO, DESPESA, FORNECEDOR] }
        usuarioId: { type: string, description: "Obrigatório para SALARIO" }
        descricao: { type: string, minLength: 1, description: "Obrigatório para DESPESA/FORNECEDOR" }
        categoria: { type: string }
        fornecedor: { type: string }
        # S-M23: recorrência negativa gerava "despesa" que INFLAVA o caixa todo mês.
        valor: { type: number, minimum: 0.01 }
        diaVencimento: { type: integer }
    RecorrenciaUpdate:
      type: object
      properties:
        descricao: { type: string, minLength: 1 }
        categoria: { type: string }
        fornecedor: { type: string }
        valor: { type: number, minimum: 0.01 }
        diaVencimento: { type: integer }
        ativo: { type: boolean }
    FolhaInput:
      type: object
      required: [competencia]
      properties:
        competencia: { type: string, pattern: '^\d{4}-\d{2}$' }
    # `geradas` é 0 numa reexecução — o sinal de que a competência já foi
    # gerada, não um erro.
    FolhaGerada:
      type: object
      required: [geradas, contas]
      properties:
        geradas: { type: integer }
        contas:
          type: array
          items:
            $ref: "#/components/schemas/ContaPagar"
    EnviarContabilidadeInput:
      type: object
      required: [de, ate]
      properties:
        de: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        ate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    EnviarContabilidadeResultado:
      type: object
      required: [marcados, parcelas, pagamentos]
      properties:
        # `marcados` é o TOTAL e continua existindo: a tela já o lê, e um número
        # que some quebra quem não foi avisado. Os dois campos abaixo é que
        # dizem a verdade nova — F34/E103, fechar o mês carimba os DOIS lados.
        marcados: { type: integer, description: "Total (parcelas + pagamentos)" }
        parcelas: { type: integer, description: "Recebimentos declarados — o lado que NÃO existia antes do F34" }
        pagamentos: { type: integer }
    # O saldo conferido num DIA — a âncora da projeção. Chavear por competência
    # não respondia "quanto tem em caixa hoje?"; a data responde.
    SaldoReferencia:
      type: object
      required: [id, lojaId, dataReferencia, valor]
      properties:
        id: { type: string }
        lojaId: { type: string }
        dataReferencia:
          type: string
          format: date-time
          description: "Instante do dia conferido (meio-dia local America/Sao_Paulo)"
        valor: { type: number }
    SaldoReferenciaInput:
      type: object
      required: [dataReferencia, valor]
      properties:
        dataReferencia: { type: string, format: date-time }
        valor: { type: number }

    # ── Comissão ──
    # Regra do produto: a faixa do acumulado FINAL rege o mês inteiro
    # (RETROATIVO — não é progressivo por degrau). Buraco entre faixas = sem
    # comissão ali, de propósito. A regra é por VENDEDORA e versionada por
    # `vigenciaInicio`: fechar um mês antigo usa a regra que valia nele.
    ComissaoFaixa:
      type: object
      required: [id, minAcumulado]
      properties:
        id: { type: string }
        minAcumulado: { type: number, description: "Borda inferior INCLUSIVA" }
        maxAcumulado:
          type: ["number", "null"]
          description: "Borda superior EXCLUSIVA; null = topo aberto"
        percentual: { type: ["number", "null"], description: "5 = 5%" }
        bonusFixo: { type: ["number", "null"] }
    ComissaoFaixaInput:
      type: object
      required: [minAcumulado]
      properties:
        minAcumulado: { type: number, minimum: 0 }
        maxAcumulado: { type: ["number", "null"], minimum: 0 }
        percentual: { type: ["number", "null"], minimum: 0, maximum: 100 }
        bonusFixo: { type: ["number", "null"], minimum: 0 }
    ComissaoRegra:
      type: object
      required: [id, lojaId, vendedoraId, vigenciaInicio, bonusAcumulaFaixas, ativo, faixas]
      properties:
        id: { type: string }
        lojaId: { type: string }
        vendedoraId: { type: string }
        vendedoraNome: { type: ["string", "null"] }
        vigenciaInicio: { type: string, format: date-time }
        bonusAcumulaFaixas:
          type: boolean
          description: "Ligado: os bônus dos degraus vencidos se somam"
        ativo: { type: boolean }
        faixas:
          type: array
          items:
            $ref: "#/components/schemas/ComissaoFaixa"
    ComissaoRegraInput:
      type: object
      required: [vendedoraId, faixas]
      properties:
        vendedoraId: { type: string }
        vigenciaInicio:
          type: string
          format: date-time
          description: "Omitido = vale a partir de hoje"
        bonusAcumulaFaixas: { type: boolean }
        faixas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ComissaoFaixaInput"
    ComissaoRegraUpdate:
      type: object
      properties:
        ativo: { type: boolean }
        bonusAcumulaFaixas: { type: boolean }

    MinhaComissao:
      type: object
      required: [competencia, temRegra, totalVendas, estornoPendente, valorComissao, valorBonus, valorTotal, fechamentos]
      properties:
        competencia: { type: string, description: "Competência YYYY-MM consultada" }
        temRegra: { type: boolean, description: "false = sem escada vigente; valores zerados" }
        totalVendas: { type: number, description: "Base líquida do mês (estorno já abatido)" }
        estornoPendente: { type: number }
        percentualAplicado: { type: ["number", "null"] }
        valorComissao: { type: number }
        valorBonus: { type: number }
        valorTotal: { type: number }
        faltaProximoDegrau: { type: ["number", "null"], description: "Quanto falta vender para a próxima faixa; null = topo" }
        proximoDegrauPercentual: { type: ["number", "null"] }
        projecao:
          oneOf:
            - $ref: "#/components/schemas/ProjecaoComissao"
            - type: "null"
        # A colocação SEM os valores das colegas (E55): só o ordinal. null
        # quando a pessoa não está no ranking do mês ou quando há menos de
        # duas pessoas — "1º de 1" não é ranking.
        colocacao:
          oneOf:
            - type: object
              required: [posicao, de]
              properties:
                posicao: { type: integer }
                de: { type: integer, description: "Quantas pessoas no ranking do mês" }
            - type: "null"
        fechamentos:
          type: array
          description: "Meses já fechados da pessoa, mais recente primeiro"
          items:
            type: object
            required: [competencia, totalVendas, valorComissao, valorBonus, valorTotal, fechadoEm]
            properties:
              competencia: { type: string }
              totalVendas: { type: number }
              percentualAplicado: { type: ["number", "null"] }
              valorComissao: { type: number }
              valorBonus: { type: number }
              valorTotal: { type: number }
              fechadoEm: { type: string, format: date-time }
    SimularComissaoInput:
      type: object
      required: [vendedoraId, faixas]
      properties:
        vendedoraId: { type: string }
        faixas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ComissaoFaixaInput"
        bonusAcumulaFaixas: { type: boolean, default: false }
        meses: { type: integer, minimum: 1, maximum: 12, default: 3 }
    SimulacaoComissaoLinha:
      type: object
      required: [competencia, base, fechada, pagoReal, simulado, diferenca]
      properties:
        competencia: { type: string }
        # Base líquida do fechamento quando o mês fechou; vendas brutas quando não.
        base: { type: number }
        fechada: { type: boolean }
        pagoReal: { type: number }
        pagoRealPercentual: { type: ["number", "null"] }
        simulado: { type: number }
        simuladoPercentual: { type: ["number", "null"] }
        diferenca: { type: number }
    SimulacaoComissao:
      type: object
      required: [vendedoraId, linhas, totalPagoReal, totalSimulado, totalDiferenca]
      properties:
        vendedoraId: { type: string }
        linhas:
          type: array
          items:
            $ref: "#/components/schemas/SimulacaoComissaoLinha"
        totalPagoReal: { type: number }
        totalSimulado: { type: number }
        totalDiferenca: { type: number }
    ReaberturaComissao:
      type: object
      required: [fechamentoId, competencia, vendedoraId, contaPagarRemovida, estornosReabertos]
      properties:
        fechamentoId: { type: string }
        competencia: { type: string }
        vendedoraId: { type: string }
        contaPagarRemovida: { type: boolean, description: "false = o fechamento não gerou conta (valor zero)" }
        estornosReabertos: { type: integer, description: "Contratos cujo estorno voltou a pendente" }
    PendenciaComissao:
      type: object
      required: [competencia, vendedoras, totalVendas]
      properties:
        competencia: { type: string, description: "YYYY-MM" }
        vendedoras: { type: integer, description: "Quantas ainda não têm fechamento no mês" }
        totalVendas: { type: number, description: "Base que ainda não virou comissão" }
    ComissaoFechamento:
      type: object
      required: [id, lojaId, vendedoraId, competencia, totalVendas, valorComissao, valorBonus, valorTotal]
      properties:
        id: { type: string }
        lojaId: { type: string }
        vendedoraId: { type: string }
        vendedoraNome: { type: ["string", "null"] }
        competencia: { type: string, description: "Competência YYYY-MM" }
        totalVendas: { type: number, description: "Base líquida, já com o estorno abatido" }
        # E102/C5: quanto do estorno pendente ESTE fechamento absorveu. Parcial
        # quando o mês não cobre tudo — o resto carrega para a competência
        # seguinte, em vez de o valor cheio voltar e ser descontado de novo.
        estornoAbsorvido: { type: number }
        percentualAplicado: { type: ["number", "null"] }
        valorComissao: { type: number }
        valorBonus: { type: number }
        valorTotal: { type: number, description: "comissão + bônus; é este que vira ContaPagar" }
        contaPagarId: { type: ["string", "null"] }
        fechadoEm: { type: string, format: date-time }
    GerarComissaoFechamentoInput:
      type: object
      required: [competencia]
      properties:
        competencia: { type: string, pattern: "^\\d{4}-\\d{2}$" }

    # Ranking ao vivo da competência — o que SERIA pago se fechasse agora.
    ComissaoPreviewLinha:
      type: object
      required: [vendedoraId, totalVendas, estornoPendente, valorComissao, valorBonus, valorTotal]
      properties:
        vendedoraId: { type: string }
        vendedoraNome: { type: ["string", "null"] }
        totalVendas: { type: number }
        estornoPendente:
          type: number
          description: "Cancelados de meses já fechados, ainda não reconciliados"
        percentualAplicado: { type: ["number", "null"] }
        valorComissao: { type: number }
        valorBonus: { type: number }
        valorTotal: { type: number }
        faltaProximoDegrau: { type: ["number", "null"] }
        projecao:
          oneOf:
            - $ref: "#/components/schemas/ProjecaoComissao"
            - type: "null"

    # "No seu ritmo, o mês fecha em quanto?" (E51). Só existe na competência
    # CORRENTE e depois de alguns dias de mês — antes disso o run-rate é ruído
    # com cara de número. null = não há projeção a dar.
    ProjecaoComissao:
      type: object
      required: [diasDecorridos, diasNoMes, baseProjetada, valorTotalProjetado]
      properties:
        diasDecorridos: { type: integer }
        diasNoMes: { type: integer }
        baseProjetada: { type: number, description: "Base líquida projetada para o mês inteiro" }
        percentualProjetado: { type: ["number", "null"] }
        valorTotalProjetado: { type: number, description: "Comissão + bônus sobre a base projetada" }

    BaixarEstornoComissaoInput:
      type: object
      required: [vendedoraId, competencia]
      properties:
        vendedoraId: { type: string }
        competencia:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: "A competência em que o estorno aparece pendente (a mesma do preview)"
        motivo:
          type: ["string", "null"]
          description: "Justificativa da baixa — fica no registro de auditoria"

    BaixaEstornoComissao:
      type: object
      required: [contratoId, vendedoraId, valor, baixadoEm]
      properties:
        contratoId: { type: string }
        vendedoraId: { type: string }
        vendedoraNome: { type: ["string", "null"] }
        noivaNome: { type: ["string", "null"] }
        valor:
          type: number
          description: "O valor do contrato cancelado cujo estorno foi baixado"
        motivo: { type: ["string", "null"] }
        baixadoPorNome: { type: ["string", "null"] }
        baixadoEm: { type: string, format: date-time }

    BaixarEstornoComissaoResultado:
      type: object
      required: [vendedoraId, contratosBaixados, valorBaixado]
      properties:
        vendedoraId: { type: string }
        contratosBaixados:
          type: integer
          description: "Quantos contratos cancelados tiveram o estorno baixado"
        valorBaixado:
          type: number
          description: "Total do estorno baixado, em reais"

    # ── Dashboard ──
    DashboardSummary:
      type: object
      # E101/B7: `receberProximos30Dias` e `pagarProximos30Dias` saíram do
      # `required`. O dashboard é o painel de todo mundo (decisão do dono em
      # 2026-07-27) e os números de dinheiro só entram para quem tem
      # `financeiro: ver` — antes eles saíam para qualquer perfil, e a
      # costureira com `agenda: {ver}` recebia a previsão de caixa da loja.
      #
      # O backlog do E101 afirmava que o contrato JÁ os marcava como opcionais.
      # Não marcava: eram obrigatórios, e o `.parse` da resposta reprovou o
      # conserto na primeira execução do teste.
      required: [totalLeadsAtivos, totalVestidosAtivos, totalOrcamentosAbertos, totalContratosAtivos]
      properties:
        totalLeadsAtivos: { type: integer }
        totalVestidosAtivos: { type: integer }
        totalOrcamentosAbertos: { type: integer }
        totalContratosAtivos: { type: integer }
        receberProximos30Dias: { type: number }
        pagarProximos30Dias: { type: number }
        atendimentosHoje: { type: integer }
