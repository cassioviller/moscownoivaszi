          in: query
          required: false
          schema:
            type: string
            enum: [PARCELA_RECEBIDA, RECEBIMENTO_ESTORNADO, CONTA_PAGA, PAGAMENTO_REGISTRADO, PAGAMENTO_ESTORNADO, ESTORNO_COMISSAO_BAIXADO, COMISSAO_FECHAMENTO_REABERTO, MEMBRO_ADICIONADO, MEMBRO_ALTERADO, MEMBRO_REMOVIDO, CONVITE_CRIADO, CONVITE_CANCELADO, PERMISSOES_ALTERADAS, PERMISSOES_RESTAURADAS]
        - name: usuarioId
          in: query
          required: false
          schema:
            type: string
        - name: de
          in: query
          required: false
          description: Início do intervalo (inclusivo, dia local America/Sao_Paulo)
