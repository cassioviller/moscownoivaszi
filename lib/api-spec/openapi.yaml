components:
  parameters:
    LojaIdParam:
      name: lojaId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Auth ──
    LoginInput:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, minLength: 1 }
    SelecionarLojaInput:
      type: object
      required: [lojaId]
      properties:
        lojaId: { type: string }
    Sessao:
      type: object
      required: [usuario]
      properties:
        usuario:
          $ref: "#/components/schemas/Usuario"
        lojaAtivaId:
          type: ["string", "null"]
        lojas:
          type: array
          items:
            $ref: "#/components/schemas/LojaComPerfil"

    LojaComPerfil:
      allOf:
        - $ref: "#/components/schemas/Loja"
        - type: object
          properties:
            perfilId: { type: string }
            perfilNome: { type: string }

    # ── Loja / Perfil / Usuario ──
    Loja:
      type: object
      required: [id, nome, ativo, createdAt]
      properties:
        id: { type: string }
        nome: { type: string }
        cnpj: { type: ["string", "null"] }
        endereco: { type: ["string", "null"] }
        telefone: { type: ["string", "null"] }
        ativo: { type: boolean }
        createdAt: { type: string, format: date-time }
    LojaInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1 }
        cnpj: { type: string }
        endereco: { type: string }
        telefone: { type: string }
    LojaUpdate:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        cnpj: { type: string }
        endereco: { type: string }
        telefone: { type: string }
        ativo: { type: boolean }

    Perfil:
      type: object
      required: [id, nome, acessosModulos]
      properties:
        id: { type: string }
        nome: { type: string }
        acessosModulos:
          type: object
          additionalProperties: { type: boolean }
    PerfilInput:
      type: object
      required: [nome, acessosModulos]
      properties:
        nome: { type: string, minLength: 1 }
        acessosModulos:
          type: object
          additionalProperties: { type: boolean }
    PerfilUpdate:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        acessosModulos:
          type: object
          additionalProperties: { type: boolean }

    PerfilOverrideLoja:
      type: object
      required: [lojaId, perfilId, acessosModulos]
      properties:
        lojaId: { type: string }
        perfilId: { type: string }
        acessosModulos:
          type: object
          additionalProperties: { type: boolean }
    PerfilOverrideInput:
      type: object
      required: [perfilId, acessosModulos]
      properties:
        perfilId: { type: string }
        acessosModulos:
          type: object
          additionalProperties: { type: boolean }

    Usuario:
      type: object
      required: [id, nome, email, ativo, isSuperAdmin]
      properties:
        id: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        ativo: { type: boolean }
        isSuperAdmin: { type: boolean }
    UsuarioInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string, minLength: 1 }
        email: { type: string, format: email }
        senha: { type: string, minLength: 6 }
        isSuperAdmin: { type: boolean }
    UsuarioUpdate:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        email: { type: string, format: email }
        senha: { type: string, minLength: 6 }
        ativo: { type: boolean }
        isSuperAdmin: { type: boolean }

    MembroEquipe:
      type: object
      required: [usuarioId, lojaId, perfilId, nome, email, perfilNome]
      properties:
        usuarioId: { type: string }
        lojaId: { type: string }
        perfilId: { type: string }
        nome: { type: string }
        email: { type: string }
        perfilNome: { type: string }
        ativo: { type: boolean }
    MembroEquipeInput:
      type: object
      required: [nome, email, senha, perfilId]
      properties:
        nome: { type: string, minLength: 1 }
        email: { type: string, format: email }
        senha: { type: string, minLength: 6 }
        perfilId: { type: string }
    MembroEquipeUpdate:
      type: object
      properties:
        nome: { type: string }
        perfilId: { type: string }
        ativo: { type: boolean }

    # ── Catálogo ──
    Atributo:
      type: object
      required: [id, lojaId, nome, tipo, ordem, ativo]
      properties:
        id: { type: string }
        lojaId: { type: string }
        nome: { type: string }
        tipo: { type: string, enum: [OPCAO_UNICA, ESCALA] }
        ordem: { type: integer }
        ativo: { type: boolean }
        opcoes:
          type: array
          items:
            $ref: "#/components/schemas/AtributoOpcao"
    AtributoInput:
      type: object
      required: [nome, tipo]
      properties:
        nome: { type: string, minLength: 1 }
        tipo: { type: string, enum: [OPCAO_UNICA, ESCALA] }
        ordem: { type: integer }
    AtributoUpdate:
      type: object
      properties:
        nome: { type: string }
        ordem: { type: integer }
        ativo: { type: boolean }
    AtributoOpcao:
      type: object
      required: [id, atributoId, valor, ordem, ativo]
      properties:
        id: { type: string }
        atributoId: { type: string }
        valor: { type: string }
        ordem: { type: integer }
        ativo: { type: boolean }
    AtributoOpcaoInput:
      type: object
      required: [valor]
      properties:
        valor: { type: string, minLength: 1 }
        ordem: { type: integer }
    AtributoOpcaoUpdate:
      type: object
      properties:
        valor: { type: string }
        ordem: { type: integer }
        ativo: { type: boolean }

    # ── Vestidos ──
    Vestido:
      type: object
      required: [id, lojaId, codigo, nome, precoBase, status, createdAt]
      properties:
        id: { type: string }
        lojaId: { type: string }
        codigo: { type: string }
        nome: { type: string }
        precoBase: { type: number }
        tamanho: { type: ["string", "null"] }
        cor: { type: ["string", "null"] }
        categoria: { type: ["string", "null"] }
        status: { type: string }
        observacoes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        atributos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoAtributo"
        fotos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoFotoMeta"
    VestidoAtributo:
      type: object
      required: [atributoId, opcaoId]
      properties:
        atributoId: { type: string }
        opcaoId: { type: string }
    VestidoFotoMeta:
      type: object
      required: [ordem, mime, largura, altura]
      properties:
        ordem: { type: integer }
        mime: { type: string }
        largura: { type: integer }
        altura: { type: integer }
    VestidoFoto:
      type: object
      required: [ordem, mime, largura, altura, base64]
      properties:
        ordem: { type: integer }
        mime: { type: string }
        largura: { type: integer }
        altura: { type: integer }
        base64: { type: string }
    VestidoFotoInput:
      type: object
      required: [mime, largura, altura, base64]
      properties:
        mime: { type: string }
        largura: { type: integer }
        altura: { type: integer }
        base64: { type: string }
    VestidoInput:
      type: object
      required: [codigo, nome, precoBase]
      properties:
        codigo: { type: string, minLength: 1 }
        nome: { type: string, minLength: 1 }
        precoBase: { type: number }
        tamanho: { type: string }
        cor: { type: string }
        categoria: { type: string }
        observacoes: { type: string }
        atributos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoAtributo"
    VestidoUpdate:
      type: object
      properties:
        codigo: { type: string }
        nome: { type: string }
        precoBase: { type: number }
        tamanho: { type: string }
        cor: { type: string }
        categoria: { type: string }
        status: { type: string }
        observacoes: { type: string }
        atributos:
          type: array
          items:
            $ref: "#/components/schemas/VestidoAtributo"

    # ── Leads ──
    Lead:
      type: object
      required: [id, lojaId, etapa, noivaNome, origem, createdAt]
      properties:
        id: { type: string }
        lojaId: { type: string }
        etapa:
          type: string
          enum: [NOVO, INTERESSES_PREENCHIDOS, ATENDIMENTO_AGENDADO, EM_ATENDIMENTO, ORCAMENTO_ABERTO, CONTRATO_FECHADO, EM_PROVAS, RETIRADO, CASAMENTO_REALIZADO, DEVOLVIDO, PERDIDO]
        noivaNome: { type: string }
        noivoNome: { type: ["string", "null"] }
        cerimonialista: { type: ["string", "null"] }
        whatsapp: { type: ["string", "null"] }
        casamentoData: { type: ["string", "null"], format: date-time }
        casamentoHorario: { type: ["string", "null"] }
        casamentoLocal: { type: ["string", "null"] }
        origem: { type: string, enum: [LOJA, WHATSAPP] }
        createdAt: { type: string, format: date-time }
        interesse:
          $ref: "#/components/schemas/LeadInteresse"
    LeadInput:
      type: object
      required: [noivaNome]
      properties:
        noivaNome: { type: string, minLength: 1 }
        noivoNome: { type: string }
        cerimonialista: { type: string }
        whatsapp: { type: string }
        casamentoData: { type: string, format: date-time }
        casamentoHorario: { type: string }
        casamentoLocal: { type: string }
        origem: { type: string, enum: [LOJA, WHATSAPP] }
    LeadUpdate:
      type: object
      properties:
        etapa:
          type: string
          enum: [NOVO, INTERESSES_PREENCHIDOS, ATENDIMENTO_AGENDADO, EM_ATENDIMENTO, ORCAMENTO_ABERTO, CONTRATO_FECHADO, EM_PROVAS, RETIRADO, CASAMENTO_REALIZADO, DEVOLVIDO, PERDIDO]
        noivaNome: { type: string }
