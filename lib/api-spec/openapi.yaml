  /lojas/{lojaId}/bloqueios/{bloqueioId}/avarias:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: bloqueioId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listAvarias
      tags: [reservas]
      summary: Avarias registradas na devolução deste bloqueio
      responses:
        "200":
          description: Avarias (meta — a foto vem pela rota própria)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Avaria"
    post:
      operationId: createAvaria
      tags: [reservas]
      summary: Registra uma avaria — descrição, custo estimado e foto-evidência
      description: >
        E71: o atraso já era detectado; a avaria morria numa conversa. A foto é
        opcional, validada por magic bytes como as de vestido (E3), e quando há
        contrato o custo pode virar parcela avulsa cobrável.


        E214: a taxa passa a ter FAIXA — R$ 350,00 a R$ 2.500,00 na limpeza
        (cláusula 14ª) e 5× o aluguel da peça no dano (15ª). Valor que VIOLA um
        número do papel entra com `justificativaDaTaxa`, que vai para a trilha.
        Dano em peça fora de contrato não tem teto calculável: a 15ª não alcança
        o caso, então a porta aceita e a trilha registra que não conferiu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvariaInput"
      responses:
        "201":
          description: Avaria registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avaria"
        "422":
          description: >
            `TAXA_FORA_DA_FAIXA` — a taxa VIOLA um número que a cláusula dá
            (o piso/teto da 14ª, ou os cinco aluguéis da 15ª quando a peça está
            em contrato) e veio sem justificativa escrita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lojas/{lojaId}/avarias/{avariaId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: avariaId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAvaria
      tags: [reservas]
      summary: Corrige a avaria registrada (S-C11)
      description: >
        S-C11: `descricao`, `tipo`, `custoReparo` e `justificativaDaTaxa` só
        entravam no POST de nascimento. Quem digitou R$ 1.500,00 onde eram
        R$ 150,00 só tinha o caminho de apagar e refazer — que o E115 RECUSA
        quando a avaria sustenta cobrança viva, e que leva a FOTO-prova junto.


        A régua do E214 vale aqui inteira: valor que VIOLA um número das
        cláusulas 14ª/15ª entra com `justificativaDaTaxa`, e a razão vai para a
        trilha (`AVARIA_FORA_DA_FAIXA`, com `momento: EDICAO`). Sem isto a
        edição seria a porta dos fundos da régua que o E214 pôs na frente.


        Havendo cobrança VIVA, o teto conferido é o do contrato que a COBRA, e
        `parcelas.valorPrevisto` segue o novo valor na mesma transação — deixar
        os dois divergirem é dois números para uma decisão só. E havendo
        RECEBIMENTO na parcela a linha congela (409 `AVARIA_COM_RECEBIMENTO`):
        o extrato, o fluxo e o DRE já contaram aquele real, e o caminho de volta
        é estornar a parcela antes de corrigir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvariaUpdate"
      responses:
        "200":
          description: Avaria corrigida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avaria"
        "404":
          description: Avaria não encontrada nesta loja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            `AVARIA_COM_RECEBIMENTO` — a parcela deste reparo já recebeu
            dinheiro, e reescrever o número por baixo do caixa é reescrever o
            passado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            `TAXA_FORA_DA_FAIXA` (o valor viola a 14ª/15ª e veio sem razão
            escrita) ou `AVARIA_SEM_CUSTO` (apagar o custo de uma avaria com
            cobrança viva deixaria a parcela sem número).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAvaria
      tags: [reservas]
      description: >
        Recusa com 409 `AVARIA_COM_COBRANCA` quando a avaria já virou parcela
        (E97/F23): a FOTO é a prova que sustenta a cobrança, e apagá-la deixando
        a parcela viva faz a noiva dever por um dano que o sistema não consegue
        mais mostrar.
      responses:
        "204":
          description: Avaria removida
        "409":
          description: Avaria com cobrança vinculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lojas/{lojaId}/avarias/{avariaId}/cobrar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: avariaId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cobrarAvaria
      tags: [reservas]
      summary: Transforma o reparo numa parcela do contrato (E97)
      description: >
        Cria a parcela avulsa E grava o vínculo na MESMA transação. A segunda
        chamada responde 409 `AVARIA_JA_COBRADA` em vez de criar uma segunda
        parcela — antes, dois cliques cobravam o mesmo conserto duas vezes no
        carnê da noiva, e nada no sistema sabia que eram a mesma coisa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobrarAvariaInput"
      responses:
        "201":
          description: Reparo cobrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avaria"
        "409":
          description: Reparo já cobrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Sem custo avaliado, contrato não ativo, ou — E214 —
            `TAXA_FORA_DA_FAIXA`: o valor não cabe no teto da peça DESTE
            contrato e não há justificativa escrita nem na avaria nem no corpo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lojas/{lojaId}/contratos/{contratoId}/cobranca-de-atraso:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contratoId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: previaDaCobrancaDeAtraso
      tags: [reservas]
      summary: A conta do atraso na devolução, sem cobrar (E212, cláusula 16ª)
      description: >
        A MESMA conta que o POST cobra, calculada e devolvida sem escrever nada.
        Existe para a tela mostrar o número antes do clique — mesma razão do
        aviso do reajuste (E211): a vendedora descobriria a cobrança depois de
        já ter recebido a peça de volta.


        `devida: false` é a resposta da devolução no prazo, que é a maioria
        delas, e não é erro.
      responses:
        "200":
          description: A conta (ou a ausência dela)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobrancaDeAtraso"
        "404":
          description: Contrato não encontrado nesta loja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: cobrarAtrasoDaDevolucao
      tags: [reservas]
      summary: Transforma o atraso numa parcela do contrato (E212, cláusula 16ª)
      description: >
        Cria UMA parcela com a conta do atraso e grava o vínculo em
        `contratos.atraso_parcela_id` na MESMA transação — mesmo desenho do
        E97/F22 para a avaria, e pela mesma razão: sem vínculo, dois cliques
        cobram o mesmo atraso duas vezes e nada no sistema sabe que são a mesma
        coisa. A segunda chamada responde 409 `ATRASO_JA_COBRADO`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobrarAtrasoInput"
      responses:
        "201":
          description: Atraso cobrado — a conta e a parcela que nasceu dela
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobrancaDeAtraso"
        "409":
          description: Atraso já cobrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            `SEM_ATRASO` (nenhuma peça passou da data), `CONTRATO_NAO_ATIVO`, ou
            `ATRASO_SEM_ALUGUEL` — a peça atrasada não está no rol de itens do
            contrato, e a 16ª cobra sobre *"o valor do aluguel de cada peça"*.
            Sem aluguel não há diária nem múltiplo, e a porta diz isso em vez de
            inventar um número.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lojas/{lojaId}/contratos-com-atraso:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listContratosComAtraso
      tags: [reservas]
      summary: A fila das peças que não voltaram no prazo (S-C32, cláusula 16ª)
      description: >
        A prévia do E212 responde por UM contrato, e quem não abrisse a ficha
        daquela reserva não sabia que a peça estava fora — enquanto a diária da
        16ª §1º soma sozinha, todo dia, sem gesto nenhum que a anuncie. Esta
        porta é a mesma conta, varrida sobre os contratos ATIVOS da loja.


        A régua é a de `previaDaCobrancaDeAtraso`, chamada peça por peça: a fila
        e a ficha não podem divergir, porque o número que a fila mostra é o que
        a ficha vai cobrar.


        Entra também o contrato cujas peças atrasadas estão TODAS fora do rol de
        itens (`semAluguel`): não há conta a fazer, e é justamente por isso que
        alguém precisa ver — a peça está fora e ninguém consegue cobrá-la.
      responses:
        "200":
          description: A fila, do maior atraso ao menor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilaDeAtrasos"

  /lojas/{lojaId}/avarias/{avariaId}/foto:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: avariaId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAvariaFoto
      tags: [reservas]
      summary: A foto-evidência da avaria
      responses:
        "200":
          description: A imagem, no mime real do binário
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404":
          description: Avaria sem foto ou inexistente

  # ───────────────────────── Orçamentos ─────────────────────────
  /lojas/{lojaId}/orcamentos:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listOrcamentos
      tags: [orcamentos]
      # E62: o perfil da noiva filtra no banco, não baixando a loja inteira
      # para escolher no navegador. Query dentro do get: para não vazar ao POST.
      # E124: busca por noiva, página e recentes-primeiro (P2) — o acervo de
      # 3 anos se acha sem rolar a história inteira.
      parameters:
        - name: leadId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: "Só um status (E83) — mensagens de hoje pede os ENVIADOS, não a história"
          schema: { type: string, enum: [RASCUNHO, ENVIADO, APROVADO, RECUSADO] }
        - name: q
          in: query
          required: false
          description: "Busca pela noiva: nome da noiva/noivo e WhatsApp (dígitos), a mesma régua do listLeads"
          schema: { type: string, maxLength: 200 }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: porPagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        # Default `recentes` (P2): a pergunta da lista é "cadê o de semana
        # passada?", e a ordem antiga punha o passado em cima.
        - name: ordem
          in: query
          required: false
          schema: { type: string, enum: [antigos, recentes], default: recentes }
      responses:
        "200":
          description: >
            Página de orçamentos (sem pagina/porPagina, vem tudo — a fila de
            mensagens e o dashboard dependem da lista cheia). A listagem geral
            NÃO embute `itens` (E124/S-D5 — ninguém os lia) e traz `valorTotal`
            agregado; o recorte `?leadId=` mantém os itens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcamentosPage"
    post:
      operationId: createOrcamento
      tags: [orcamentos]
      description: >
        `vendedoraId` vem da SESSÃO, nunca do corpo. O `leadId` do corpo é
        provado contra a loja da URL (E91/B4): a FK só garante que o id existe,
        não a que loja pertence — e o GET enriquecido devolveria a ficha da
        noiva de outra loja.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrcamentoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orcamento"
        "422":
          description: Noiva não é desta loja (REFERENCIA_INVALIDA)
  /lojas/{lojaId}/orcamentos/{orcamentoId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: orcamentoId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOrcamento
      tags: [orcamentos]
      responses:
        "200":
          description: Orcamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orcamento"
    patch:
      operationId: updateOrcamento
      tags: [orcamentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrcamentoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orcamento"
    delete:
      operationId: deleteOrcamento
      tags: [orcamentos]
      responses:
        "204":
          description: Deleted
  /lojas/{lojaId}/orcamentos/{orcamentoId}/itens:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: orcamentoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addOrcamentoItem
      tags: [orcamentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrcamentoItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcamentoItem"
  /lojas/{lojaId}/orcamentos/itens/{itemId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateOrcamentoItem
      tags: [orcamentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrcamentoItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcamentoItem"
    delete:
      operationId: removeOrcamentoItem
      tags: [orcamentos]
      responses:
        "204":
          description: Removed
  /lojas/{lojaId}/orcamentos/{orcamentoId}/aprovar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: orcamentoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: aprovarOrcamento
      tags: [orcamentos]
      responses:
        "200":
          description: Aprovado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orcamento"
  /lojas/{lojaId}/orcamentos/{orcamentoId}/recusar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: orcamentoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: recusarOrcamento
      tags: [orcamentos]
      responses:
        "200":
          description: Recusado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orcamento"
  /lojas/{lojaId}/orcamentos/aceitos-sem-contrato:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listAceitosSemContrato
      tags: [orcamentos]
      summary: A fila do gate — orçamentos aceitos/aprovados que ainda não viraram contrato
      description: >
        E162: o aceite da noiva não cria reserva e o contrato exige reserva —
        entre os dois existia um vão que NENHUMA tela vigiava. Esta é a
        primeira consulta do sistema que cruza orçamento com contrato: um
        APROVADO sem contrato é dinheiro comprometido parado, e a idade dele é
        o quanto a promessa está esperando.
      responses:
        "200":
          description: Os aceites parados, do mais antigo ao mais novo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrcamentoAceitoSemContrato"
  /lojas/{lojaId}/orcamentos/{orcamentoId}/desfazer-aceite:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: orcamentoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: desfazerAceiteOrcamento
      tags: [orcamentos]
      summary: Desfaz o aceite/aprovação — a porta gerencial do beco
      description: >
        E162 (A01.2): APROVADO era terminal SEM saída — reservar dava 409 se a
        peça saiu, trocar o item dava 422, voltar o status dava 422, e o
        contrato dava 422. Este gesto gerencial devolve o orçamento a RASCUNHO
        (limpa aceite, versão e hash; a história fica na auditoria e nas
        versões antigas), para a vendedora trocar a peça e gerar novo link —
        que congela versão NOVA e pede novo aceite à noiva. Recusado quando já
        existe contrato apontando o orçamento.
      responses:
        "200":
          description: O orçamento de volta a RASCUNHO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orcamento"
        "404":
          description: Orçamento não encontrado
        "409":
          description: Já existe contrato apontando este orçamento
        "422":
          description: O orçamento não está APROVADO
  /lojas/{lojaId}/orcamentos/{orcamentoId}/reservar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: orcamentoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reservarPecaDoOrcamento
      tags: [orcamentos]
      summary: Cria a reserva de uma peça vendida por este orçamento, de dentro do fluxo de venda
      description: >
        E162 (R10, decisão registrada no épico): reservar DE DENTRO do fluxo
        de venda exige `leads.criar` — a venda é de quem vende —, e não
        `vestidos.criar`, que é o gate do acervo. O alcance é estreito de
        propósito: só peças que são ITEM deste orçamento, sempre em nome da
        noiva dele. A régua de disponibilidade é a MESMA do POST /bloqueios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vestidoId, casamentoData]
              properties:
                vestidoId: { type: string }
                casamentoData: { type: string, format: date-time }
      responses:
        "201":
          description: A reserva criada, em nome da noiva do orçamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloqueioVestido"
        "404":
          description: Orçamento não encontrado
        "409":
          description: A peça não está disponível no período (conflitos no corpo)
        "422":
          description: A peça não é item deste orçamento
  /lojas/{lojaId}/orcamentos/{orcamentoId}/reservas-candidatas:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: orcamentoId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listReservasCandidatas
      tags: [orcamentos]
      summary: As reservas que o contrato deste orçamento PODE prender
      description: >
        E162 (A02.4): as reservas vivas da noiva MAIS as sem dona (`leadId`
        nulo) das peças vendidas pelos itens — o caso legítimo que o filtro por
        lead da tela nunca oferecia. A adoção acontece no fechamento do
        contrato, que dá dono à reserva sem dona. S-C10 (13/08/2026): o E162
        chamava esse caso de "comum" (61 de 63 no dev) e ele é RARO — 0 de 116
        bloqueios sem dona em `moscow_base`, 2 de 127 no dev. A segunda metade
        da lista fica porque a porta de criação ainda aceita o nulo, não porque
        seja frequente.
      responses:
        "200":
          description: Candidatas — da noiva primeiro, depois as sem dona
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BloqueioVestido"
        "404":
          description: Orçamento não encontrado
  /lojas/{lojaId}/orcamentos/{orcamentoId}/link:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: orcamentoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: criarLinkOrcamento
      tags: [orcamentos]
      description: >
        Gera (ou regenera) o link público somente-leitura do orçamento. Token
        novo mata o link anterior — mesmo modelo do reenvio de convite. Gerar
        link de um RASCUNHO o marca como ENVIADO: compartilhar É enviar.
      responses:
        "200":
          description: Token e validade do link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkOrcamentoPublico"
        "404":
          description: Orçamento não encontrado
        "422":
          description: Orçamento RECUSADO não gera link
  /orcamentos/publico:
    get:
      operationId: getOrcamentoPublico
      tags: [orcamentos]
      security: []
      description: >
        Visão pública somente-leitura do orçamento — o que a noiva abre pelo
        link, sem login. Token em QUERY, nunca no path (o logger corta a query;
        o token jamais cai em log). A primeira abertura carimba
        `publicoAbertoEm` no orçamento — o aviso à loja de que ela viu.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Orçamento para a noiva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcamentoPublico"
        "404":
          description: Token desconhecido
        "410":
          description: Link expirado

  /orcamentos/publico/aceite:
    post:
      operationId: aceitarOrcamentoPublico
      tags: [orcamentos]
      security: []
      summary: A noiva aceita o orçamento pelo link — sem login
      description: >
        E74: "ela viu" vira "ela concordou com ESTA versão". Grava instante,
        número da versão enviada e o hash do conteúdo (E75) no orçamento,
        avança o status para APROVADO e deixa linha na auditoria. Idempotente:
        o segundo clique devolve o aceite existente. Não é assinatura
        certificada — é registro próprio com prova de integridade.


        E160/C2: `versao` é o número que a PÁGINA DELA mostrava
        (`versaoNumero` do GET público). Quando informado, o aceite recusa com
        409 se a proposta mudou embaixo dela — sem ele, a aba aberta há uma
        hora aceitava a versão nova, e o contrato saía R$ 500,00 acima do que
        ela leu, por baixo da guarda do E115.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: versao
          in: query
          required: false
          description: O `versaoNumero` que a página da noiva exibia.
          schema:
            type: integer
      responses:
        "200":
          description: Aceite registrado (ou o já existente)
          content:
            application/json:
              schema:
                type: object
                required: [aceitoEm]
                properties:
                  aceitoEm: { type: string, format: date-time }
        "409":
          description: A proposta mudou depois que a página foi aberta
        "404":
          description: Token desconhecido
        "410":
          description: Link expirado
        "422":
          description: Orçamento não está ENVIADO — nada a aceitar

  # ───────────────────────── Portal da noiva (E78) ─────────────────────────
  /portal:
    get:
      operationId: getPortal
      tags: [portal]
      security: []
      summary: Um link para tudo dela — proposta, lookbook, provas e extrato
      description: >
        E78: a noiva recebia até três links soltos (orçamento E13, lookbook
        E21) e nada de provas/parcelas. O portal é UM token por NOIVA — quem o
        tem vê a proposta (com aceite E74), o lookbook provado, as próximas
        provas e, depois do contrato, o extrato de parcelas DELA. Token em
        QUERY, nunca no path (o logger corta a query). Cada abertura carimba
        `ultimoAcessoEm`. Seções sem conteúdo vêm nulas/vazias — a página não
        promete o que não existe.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: O lugar da noiva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalNoiva"
        "404":
          description: Token desconhecido ou revogado
        "410":
          description: Link expirado

  /portal/aceite:
    post:
      operationId: aceitarPortal
      tags: [portal]
      security: []
      summary: O aceite da proposta, pelo portal
      description: >
        Delega à MESMA rotina do E74 (uma transação, um invariante): grava
        instante, versão e hash, avança para APROVADO e deixa a linha na
        auditoria como "(link público)". Idempotente. O alvo é o mesmo
        orçamento que o GET /portal exibe.


        S-O7/E166: `versao` chega aqui pelo mesmo motivo do link público — a
        sobra do E160 ficou aberta porque a página do portal não EXIBIA número
        de versão, e a proteção dela era só a leitura sob tranca. Exibir não é
        o que importa: a página já RECEBE o `versaoNumero` (o portal monta a
        proposta com a mesma função), e mandar de volta o que se leu é o que
        prova que a proposta não mudou embaixo dela.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: versao
          in: query
          required: false
          description: O `versaoNumero` que a página do portal recebeu.
          schema:
            type: integer
      responses:
        "200":
          description: Aceite registrado (ou o já existente)
          content:
            application/json:
              schema:
                type: object
                required: [aceitoEm]
                properties:
                  aceitoEm: { type: string, format: date-time }
        "404":
          description: Token desconhecido ou revogado
        "410":
          description: Link expirado
        "422":
          description: Não há proposta ENVIADA — nada a aceitar

  /portal/provas/{atendimentoId}/confirmar:
    parameters:
      - name: atendimentoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: confirmarProvaPortal
      tags: [portal]
      security: []
      summary: A noiva confirma a presença pelo portal — um clique, sem wa.me
      description: >
        E85: o aceite (E74) provou que a noiva age quando o link dá o poder.
        Carimba o MESMO `confirmadoEm` do E39, com a noiva como autora na
        auditoria ("link público"). Idempotente: já confirmada devolve o
        carimbo existente. O token escopa — prova de outra noiva é 404 mesmo
        existindo; atendimento comum é 422 (a fila de confirmação da loja é
        de presenças, mas o portal só mostra provas).
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmada (ou o carimbo já existente)
          content:
            application/json:
              schema:
                type: object
                required: [confirmadoEm]
                properties:
                  confirmadoEm: { type: string, format: date-time }
        "404":
          description: Token desconhecido/revogado, ou a prova não é desta noiva
        "410":
          description: Link expirado
        "422":
          description: Não é uma prova futura AGENDADA — nada a confirmar

  /portal/provas/{atendimentoId}/remarcar:
    parameters:
      - name: atendimentoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: pedirRemarcacaoPortal
      tags: [portal]
      security: []
      summary: A noiva avisa que NÃO pode ir — um pedido, não uma remarcação
      description: >
        F37/E100. A única ação da noiva no portal era "confirmo que vou", e
        ninguém abre um link para dizer que vai: abre para dizer que NÃO. Este
        aviso devolve à loja os três recursos mais caros do ateliê — cabine,
        hora da vendedora e vestido separado — com antecedência em vez de com a
        ausência.

        Carimba `remarcacaoPedidaEm`, o TERCEIRO fato da família que o E97
        separou (`contatadoEm` = a loja procurou, `confirmadoEm` = ela disse que
        vem). O atendimento continua AGENDADO de propósito: é PEDIDO, não
        remarcação — cancelar sozinho devolveria o recurso e deixaria a noiva
        sem horário nenhum por causa de um clique num link. Quem remarca é a
        loja, pela fila do dia.

        Idempotente, e recusa (422) o que já foi confirmado: quem disse que vem
        e mudou de ideia fala com a vendedora — o portal não desfaz uma
        confirmação sobre a qual a loja já tomou decisão física.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pedido registrado (ou o carimbo já existente)
          content:
            application/json:
              schema:
                type: object
                required: [remarcacaoPedidaEm]
                properties:
                  remarcacaoPedidaEm: { type: string, format: date-time }
        "404":
          description: Token desconhecido/revogado, ou a prova não é desta noiva
        "410":
          description: Link expirado
        "422":
          description: Não é uma prova futura AGENDADA, ou ela já confirmou presença

  /portal/foto:
    get:
      operationId: getPortalFoto
      tags: [portal]
      security: []
      description: >
        Foto de um vestido do lookbook DA noiva, escopada ao token do PORTAL —
        o espelho de /lookbooks/publico/foto, para o portal não depender do
        token antigo do lookbook (que pode ter expirado). Vestido fora do
        lookbook dela é 404, mesmo existindo.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: vestidoId
          in: query
          required: true
          schema:
            type: string
        - name: ordem
          in: query
          required: true
          schema:
            type: integer
        - name: variante
          in: query
          required: false
          schema:
            type: string
            enum: [original, thumb]
        - name: v
          in: query
          required: false
          description: Cache-buster (updatedAt) — com ele a resposta é immutable
          schema:
            type: string
      responses:
        "200":
          description: A imagem
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Token desconhecido/revogado ou vestido fora do lookbook
        "410":
          description: Link expirado

  /portal/contrato-pdf:
    get:
      operationId: getPortalContratoPdf
      tags: [portal]
      security: []
      description: >
        O PDF do contrato ATIVO da noiva, servido pelo token do PORTAL — o mesmo
        documento que a loja baixa, montado pela mesma régua
        (`lib/contrato-do-papel.ts`). É a quinta rota pública com documento
        financeiro dentro: checa TTL **e** revogação como as outras quatro, e o
        contrato sai do leadId do token, nunca de um id na URL — não há id de
        contrato a adivinhar. Sem contrato ativo é 404.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: O PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Token desconhecido/revogado, ou noiva sem contrato ativo
        "410":
          description: Link expirado

  /portal/recibo-pdf:
    get:
      operationId: getPortalReciboPdf
      tags: [portal]
      security: []
      description: >
        O recibo de UM pagamento, servido pelo token do PORTAL — o mesmo
        documento que a loja baixa (`lib/recibo-do-papel.ts`). É a sexta rota
        pública com documento financeiro dentro: checa TTL **e** revogação como
        as outras cinco.

        Diferente do contrato, aqui há um id na query — contrato ativo é um,
        recibos são muitos. O pertencimento é por CONSTRUÇÃO: os recibos são
        montados a partir das parcelas do contrato ATIVO desta noiva, e o id
        pedido é procurado dentro dessa lista. Id de outra noiva não está lá.
        O mesmo caminho cobre o estorno — recebimento desfeito responde 404.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: reciboId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: O PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: >
            Token desconhecido/revogado, noiva sem contrato ativo, ou recibo
            que não é dela (ou foi estornado)
        "410":
          description: Link expirado

  /lojas/{lojaId}/portais:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listPortais
      tags: [portal]
      summary: Os portais da loja num lote — para as mensagens oferecerem o link (E84)
      description: >
        A tabela tem no máximo uma linha por noiva; as telas de mensagens e
        cobrança cruzam por leadId e só anexam o link quando o portal está
        VIVO (não expirado, não revogado) — link morto na mensagem é pior
        que nenhum.
      responses:
        "200":
          description: Uma linha por noiva com portal (vivo ou não)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [leadId, token, expiraEm, revogadoEm, ultimoAcessoEm]
                  properties:
                    leadId: { type: string }
                    token: { type: string }
                    expiraEm: { type: string, format: date-time }
                    revogadoEm: { type: ["string", "null"], format: date-time }
                    ultimoAcessoEm: { type: ["string", "null"], format: date-time }

  /lojas/{lojaId}/leads/{leadId}/portal:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: leadId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPortalLead
      tags: [portal]
      summary: O estado do portal desta noiva, para o card da ficha
      responses:
        "200":
          description: O portal existe (pode estar expirado ou revogado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalStatus"
        "404":
          description: Nunca foi gerado
    post:
      operationId: criarPortalLead
      tags: [portal]
      summary: Gera (ou regenera) o link do portal — 30 dias
      description: >
        Regenerar MATA o link antigo: é a mesma linha (leadId é unique), o
        token novo substitui o velho. Revogado volta à vida com token novo.
      responses:
        "201":
          description: O link novo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalStatus"
        "404":
          description: Lead não é desta loja
    delete:
      operationId: revogarPortalLead
      tags: [portal]
      summary: Revoga o link a um clique
      responses:
        "204":
          description: Revogado (ou já não existia)

  # ───────────────────────── Contratos ─────────────────────────
  /lojas/{lojaId}/contratos:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listContratos
      tags: [contratos]
      # E62: mesmo recorte do listOrcamentos — o perfil da noiva pede só o dela.
      # E124: busca por noiva, página, status no banco e recentes-primeiro (P2)
      # — com ~290 contratos em 3 anos, o da semana passada era o ÚLTIMO card.
      # E144/S-D16: o detalhe do orçamento pergunta "este orçamento já virou
      # contrato?" — sem este filtro ele baixava a loja inteira (615 KB
      # medidos) para um único find.
      parameters:
        - name: leadId
          in: query
          required: false
          schema: { type: string }
        - name: orcamentoId
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: "Busca pela noiva: nome da noiva/noivo e WhatsApp (dígitos), a mesma régua do listLeads"
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ATIVO, CANCELADO] }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: porPagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: ordem
          in: query
          required: false
          schema: { type: string, enum: [antigos, recentes], default: recentes }
      responses:
        "200":
          description: >
            Página de contratos (sem pagina/porPagina, vem tudo — a ficha da
            noiva e o detalhe do orçamento dependem da lista cheia).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratosPage"
    post:
      operationId: createContrato
      tags: [contratos]
      description: >
        Todo id do corpo é provado contra a loja da URL antes de escrever
        (E91/B4) — inclusive `vendedoraId`, que antes entrava cru e gerava
        comissão nominal a quem não é da loja.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contrato"
        "422":
          description: >
            Referência de outra loja (REFERENCIA_INVALIDA), lead/orçamento
            inválido ou valores que não fecham

  /lojas/{lojaId}/contratos/{contratoId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contratoId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getContrato
      tags: [contratos]
      responses:
        "200":
          description: Contrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contrato"
    patch:
      operationId: updateContrato
      tags: [contratos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contrato"
  /lojas/{lojaId}/contratos/{contratoId}/pdf:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contratoId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getContratoPdf
      tags: [contratos]
      responses:
        "200":
          description: Contrato em PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /lojas/{lojaId}/contratos/{contratoId}/recibos:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contratoId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listRecibos
      tags: [contratos]
      summary: Os recibos de pagamento do contrato (E221, cláusula 7ª)
      description: >
        Um recibo por RECEBIMENTO — a cláusula 7ª manda fornecer "todos os
        recibos de pagamentos EFETUADOS", e uma parcela deste sistema recebe em
        pedaços (E49). Recebimento estornado não aparece: o estorno deste
        repositório é tudo-ou-nada e anula os recibos anteriores da parcela.
        Ordenados pelo dia do pagamento.
      responses:
        "200":
          description: Os recibos, do mais antigo ao mais recente
          content:
            application/json:
              schema:
                type: object
                required: [recibos]
                properties:
                  recibos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recibo"
        "404":
          description: Contrato inexistente nesta loja
  /lojas/{lojaId}/contratos/{contratoId}/recibos/{reciboId}/pdf:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contratoId
        in: path
        required: true
        schema:
          type: string
      - name: reciboId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getReciboPdf
      tags: [contratos]
      summary: O recibo em PDF (E221)
      description: >
        O papel é o MESMO que desce pelo portal da noiva
        (`lib/recibo-do-papel.ts`); o que muda é a prova de quem pode vê-lo.
        Recibo estornado responde 404 e não um documento — recibo de dinheiro
        devolvido é documento falso.
      responses:
        "200":
          description: Recibo em PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Contrato ou recibo inexistente
  /lojas/{lojaId}/contratos/{contratoId}/cancelar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contratoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelarContrato
      tags: [contratos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelarContratoInput"
      responses:
        "200":
          description: Cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contrato"

  # ───────────────────────── Financeiro ─────────────────────────
  /lojas/{lojaId}/financeiro/parcelas:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listParcelas
      tags: [financeiro]
      summary: Parcelas da loja — opcionalmente recortadas por vencimento, status ou recebimento
      description: >
        E79: os recortes que cobrança e projeção usam no lugar da lista
        completa. `status=abertas` devolve só PREVISTA/PARCIAL (a régua única
        do estaAberta); `recebidasDe` devolve as com dinheiro recebido a partir
        do dia (para o realizado desde a âncora do saldo conferido).
      parameters:
        - name: de
          in: query
          required: false
          description: Início do intervalo de vencimento (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo de vencimento (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: status
          in: query
          required: false
          description: "abertas = só o que ainda tem saldo a receber (PREVISTA/PARCIAL, E49)"
          schema:
            type: string
            enum: [abertas]
        - name: recebidasDe
          in: query
          required: false
          description: Só parcelas com recebimento a partir deste dia (inclusivo, dia local)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: List of parcelas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parcela"
  /lojas/{lojaId}/parcelas/{parcelaId}/receber:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: parcelaId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: receberParcela
      tags: [financeiro]
      summary: Recebe (total ou parcialmente) uma parcela
      description: >
        Aceita pagamento em partes (E49): o valor informado ACUMULA no
        `valorRecebido`, e o acumulado decide o status — quitou vira PAGA,
        sobrou vira PARCIAL (dinheiro no caixa, resto ainda cobrável).


        E94/B6: o acúmulo é condicionado ao estado LIDO. Se outra pessoa
        receber nesta mesma parcela entre a leitura e a gravação, a chamada é
        recusada com 409 `PARCELA_MUDOU` em vez de sobrescrever o valor dela —
        dois lançamentos simultâneos deixavam de somar e o menor ia para a
        gaveta. Quem recebe o 409 relê o saldo e lança de novo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceberParcelaInput"
      responses:
        "200":
          description: Recebida (PAGA se quitou, PARCIAL se sobrou saldo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcela"
        "409":
          description: >
            Parcela já quitada (PARCELA_JA_RECEBIDA) ou alterada por outra
            pessoa durante a operação (PARCELA_MUDOU)
        "422":
          description: >
            Valor acima do que falta (VALOR_ACIMA_DO_SALDO), parcela cancelada
            ou contrato não ativo
  /lojas/{lojaId}/parcelas/{parcelaId}/perdoar-mora:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: parcelaId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: perdoarMora
      tags: [financeiro]
      summary: Abre mão da multa e dos juros da cláusula 9ª (E213)
      description: >
        A decisão da dona foi automático COM gesto de perdoar: o contrato diz
        "deverá incidir", então o padrão é cumprir a cláusula, e quem quiser
        abrir mão diz por quê. O motivo é gravado na parcela — e não só na
        trilha —, porque é por ele que a tela desenha o selo: só na trilha, a
        próxima leitura veria uma parcela vencida sem acréscimo e sem explicação
        ao lado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerdoarMoraInput"
      responses:
        "200":
          description: Perdoada — a parcela com `mora.perdoada = true`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcela"
        "404":
          description: Parcela não encontrada nesta loja
        "422":
          description: >
            `SEM_MORA` — a parcela não está vencida ou não tem saldo aberto, e
            não há o que perdoar.
    delete:
      operationId: restabelecerMora
      tags: [financeiro]
      summary: Desfaz o perdão da multa e dos juros (E213)
      description: >
        Perdoar é reversível, e a trilha guarda as duas pontas
        (`MORA_PERDOADA` e `MORA_RESTABELECIDA`). Desfazer não recalcula nada —
        a conta é derivada, então ela volta sozinha ao valor de hoje.
      responses:
        "200":
          description: Restabelecida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcela"
        "404":
          description: Parcela não encontrada nesta loja
  /lojas/{lojaId}/parcelas/{parcelaId}/estornar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: parcelaId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: estornarParcela
      tags: [financeiro]
      responses:
        "200":
          description: Estornada (PAGA volta a PREVISTA, campos de recebimento zerados)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcela"
  /lojas/{lojaId}/parcelas/{parcelaId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: parcelaId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeParcela
      tags: [financeiro]
      responses:
        "204":
          description: Removida (apenas PREVISTA de contrato ATIVO)
  /lojas/{lojaId}/contratos/{contratoId}/parcelas/gerar-plano:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contratoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: gerarPlanoParcelas
      tags: [financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GerarPlanoInput"
      responses:
        "201":
          description: Plano gerado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parcela"

  /lojas/{lojaId}/contratos/{contratoId}/parcelas:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: contratoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createParcelaAvulsa
      tags: [financeiro]
      summary: Parcela avulsa — multa de atraso, reparo de avaria, ajuste extra
      description: >
        E71: a consequência que faltava. Uma cobrança que nasce DEPOIS do plano
        (multa por devolução atrasada, custo de reparo de avaria) entra como
        parcela do contrato — e a régua de cobrança, o extrato e o caixa a
        tratam como qualquer outra. Número é o próximo livre; contrato precisa
        estar ATIVO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descricao, valorPrevisto, vencimento]
              properties:
                descricao: { type: string, minLength: 1 }
                valorPrevisto: { type: number, exclusiveMinimum: 0 }
                vencimento: { type: string, format: date-time }
      responses:
        "201":
          description: Parcela criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcela"
        "422":
          description: Contrato inexistente ou não ATIVO

  /lojas/{lojaId}/financeiro/fluxo:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getFluxoCaixa
      tags: [financeiro]
      summary: O fluxo de caixa agregado no banco — a tela pede a janela, não a história
      description: >
        E79: a tela baixava TODAS as parcelas da história para os motores
        agregarem no navegador. Os MESMOS motores (financeiro-core, E25) rodam
        aqui sobre linhas já filtradas por data no SQL. `porMeio.total` e
        `resumo.entradas` são o mesmo dinheiro por construção — o invariante
        que a tela sempre exibiu.
      parameters:
        - name: ini
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: fim
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Resumo, por meio, tendência, horizonte e movimentos do período
          content:
            application/json:
              schema:
                type: object
                required: [intervalo, resumo, porMeio, tendencia, horizonte, movimentos]
                properties:
                  intervalo:
                    type: object
                    required: [iniYMD, fimYMD]
                    properties:
                      iniYMD: { type: string }
                      fimYMD: { type: string }
                  resumo:
                    type: object
                    required: [entradas, saidas, saldo]
                    properties:
                      entradas: { type: number }
                      saidas: { type: number }
                      saldo: { type: number }
                  porMeio:
                    type: object
                    required: [total, linhas]
                    properties:
                      total: { type: number }
                      linhas:
                        type: array
                        items:
                          type: object
                          required: [forma, total, qtd]
                          properties:
                            forma: { type: ["string", "null"] }
                            total: { type: number }
                            qtd: { type: integer }
                  tendencia:
                    type: array
                    items:
                      type: object
                      required: [competencia, entradas, saidas, saldo]
                      properties:
                        competencia: { type: string }
                        entradas: { type: number }
                        saidas: { type: number }
                        saldo: { type: number }
                  horizonte:
                    type: object
                    required: [aReceber, aReceberAtraso, aPagar, aPagarAtraso]
                    properties:
                      aReceber: { type: number }
                      aReceberAtraso: { type: number }
                      aPagar: { type: number }
                      aPagarAtraso: { type: number }
                  movimentos:
                    type: array
                    description: Linha do tempo do período, mais recente primeiro
                    items:
                      type: object
                      required: [id, tipo, data, valor, descricao]
                      properties:
                        id: { type: string }
                        tipo: { type: string, enum: [ENTRADA, SAIDA] }
                        data: { type: string, format: date-time }
                        valor: { type: number }
                        rotulo: { type: ["string", "null"] }
                        descricao: { type: string }
                        contratoId: { type: ["string", "null"] }

  /lojas/{lojaId}/financeiro/fluxo/exportar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: exportarFluxo
      tags: [financeiro]
      summary: CSV dos movimentos do período — o pacote da contabilidade, na régua do fluxo
      description: >
        S21/F34: o "UM pacote" que os quatro exports não podiam ser — eles
        recortam por réguas diferentes (parcelas por vencimento, folha por data
        de pagamento) e juntá-los dá regime misto. Este deriva dos MESMOS
        motores de GET …/financeiro/fluxo: entradas e saídas pela data REAL do
        movimento, no fuso da loja, com os totais do resumo no rodapé — fecha
        com a tela do fluxo e com o DRE por construção. SÓ LÊ: um GET precisa
        ser seguro para refresh/prefetch; carimbar continua sendo o POST
        …/contabilidade/enviar.
      parameters:
        - name: ini
          in: query
          required: false
          description: Início do intervalo (inclusivo); ausente, o mês corrente
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: fim
          in: query
          required: false
          description: Fim do intervalo (inclusivo); ausente, o mês corrente
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Planilha CSV (UTF-8 com BOM)
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Filtro inválido (FILTRO_INVALIDO)

  /lojas/{lojaId}/financeiro/dre:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getDre
      tags: [financeiro]
      summary: O resultado do mês agregado no banco — regime de caixa
      description: >
        E79: o mesmo movimento do /financeiro/fluxo, para o DRE. O MESMO motor
        (`dreDoIntervalo`, financeiro-core) roda aqui sobre linhas filtradas
        pela competência no SQL — fluxo e DRE fecham entre si porque saem do
        mesmo lugar. `porMeio` reusa a régua do E50: `porMeio.total` e
        `receitas` são o mesmo dinheiro por construção.
      parameters:
        - name: competencia
          in: query
          required: false
          description: "Competência YYYY-MM; ausente cai no mês corrente"
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        "200":
          description: Receitas, despesas por categoria, resultado e por meio da competência
          content:
            application/json:
              schema:
                type: object
                required:
                  [competencia, intervalo, receitas, despesas, totalDespesas, resultado, porMeio]
                properties:
                  competencia: { type: string }
                  intervalo:
                    type: object
                    required: [iniYMD, fimYMD]
                    properties:
                      iniYMD: { type: string }
                      fimYMD: { type: string }
                  receitas: { type: number }
                  despesas:
                    type: array
                    description: Maior total primeiro
                    items:
                      type: object
                      required: [rotulo, total]
                      properties:
                        rotulo: { type: string }
                        total: { type: number }
                  totalDespesas: { type: number }
                  resultado:
                    type: number
                    description: receitas − totalDespesas; pode ser negativo
                  porMeio:
                    type: object
                    required: [total, linhas]
                    properties:
                      total: { type: number }
                      linhas:
                        type: array
                        items:
                          type: object
                          required: [forma, total, qtd]
                          properties:
                            forma: { type: ["string", "null"] }
                            total: { type: number }
                            qtd: { type: integer }

  /lojas/{lojaId}/financeiro/contas-pagar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listContasPagar
      tags: [financeiro]
      summary: Contas a pagar da loja — opcionalmente recortadas por vencimento ou status
      description: >
        E93/D2: os recortes que faltavam para terminar o E79 do lado das
        saídas. Sem parâmetro a resposta é a carteira INTEIRA da loja, que
        cresce monotonicamente com a idade dela (aluguel + salários +
        fornecedores + comissões ≈ 30–50 linhas/mês) — quatro telas baixavam
        tudo para desenhar uma janela. Mesma forma de `listParcelas`:
        `de`/`ate` recortam por VENCIMENTO (dia local, inclusivo nas duas
        pontas) e `status=abertas` devolve só as PREVISTA, que é o que a
        projeção de caixa precisa em qualquer vencimento.
        Cada conta PAGA vem com `pagamento`, a saída que a quitou — sem ele a
        tela precisava baixar `listPagamentos` inteiro só para achar o
        `pagamentoId` que torna a saída estornável.
      parameters:
        - name: de
          in: query
          required: false
          description: Início do intervalo de vencimento (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo de vencimento (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: status
          in: query
          required: false
          description: "abertas = só o que ainda não foi pago (PREVISTA)"
          schema:
            type: string
            enum: [abertas]
      responses:
        "200":
          description: List of contas a pagar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContaPagar"
        "400":
          description: Intervalo inválido (INTERVALO_INVALIDO)
    post:
      operationId: createContaPagar
      tags: [financeiro]
      description: >
        `colaboradorId`, quando vem, é provado contra a loja da URL (E91/B4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContaPagarInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContaPagar"
        "422":
          description: Colaborador não é desta loja (REFERENCIA_INVALIDA)
  /lojas/{lojaId}/financeiro/contas-pagar/exportar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: exportarContasPagar
      tags: [financeiro]
      summary: CSV das contas a pagar por vencimento, para a contadora
      parameters:
        - name: de
          in: query
          required: false
          description: Início do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Planilha CSV (UTF-8 com BOM)
          content:
            text/csv:
              schema:
                type: string

  /lojas/{lojaId}/financeiro/parcelas/exportar:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: exportarParcelas
      tags: [financeiro]
      summary: CSV das parcelas (a receber) por vencimento, com a noiva
      parameters:
        - name: de
          in: query
