  # ───────────────────────── Reservas / Bloqueios ─────────────────────────
  /lojas/{lojaId}/reservas:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listReservas
      tags: [reservas]
      # S-O55/E185 — esta listagem devolvia a loja INTEIRA, sem recorte nenhum,
      # enquanto a irmã um nível abaixo (`GET /bloqueios`) já recortava por
      # noiva (E79) e por casamento futuro/passado (E87). Medido no banco da
      # loja: **118 reservas, com 115 bloqueios e 118 fichas de noiva
      # aninhadas**, para responder qualquer pergunta.
      #
      # O `vestidoId` do E45 NÃO tem irmão aqui de propósito: a reserva é o
      # agregado, e "quais reservas seguram esta peça" já é
      # `GET /bloqueios?vestidoId=`, que é quem tem a coluna.
      parameters:
        - name: leadId
          in: query
          required: false
          description: "Filtra as reservas de uma noiva só — `reservas.lead_id` é NOT NULL, então aqui não há a ambiguidade de dono que o bloqueio tem"
          schema: { type: string }
        # String enum, não boolean: zod.coerce.boolean() engoliria "false" como true.
        - name: futuras
          in: query
          required: false
          description: "Recorta por casamentoData contra hoje, em dia LOCAL America/Sao_Paulo (E87) — 'true' = casamentos de hoje em diante (asc), 'false' = já realizados (desc)"
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: List of reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reserva"
    post:
      operationId: createReserva
      tags: [reservas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
  /lojas/{lojaId}/reservas/{reservaId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: reservaId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getReserva
      tags: [reservas]
      summary: Uma reserva só — a leitura que faltava (S-O18/E179)
      description: >-
        A única leitura de reserva era a listagem da loja INTEIRA, e foi ela que
        tornou o V14 impossível de consertar só na tela. Devolve a noiva e os
        bloqueios (com vestido), como o `GET /bloqueios/{id}` do E79 faz um
        nível abaixo.
      responses:
        "200":
          description: A reserva, com a noiva e os bloqueios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "404":
          description: Não existe ou não é desta loja
    patch:
      operationId: updateReserva
      tags: [reservas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
    delete:
      operationId: deleteReserva
      tags: [reservas]
      responses:
        "204":
          description: Deleted
