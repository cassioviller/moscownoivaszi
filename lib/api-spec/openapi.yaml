            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: Fim do intervalo (inclusivo, dia local America/Sao_Paulo)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Planilha CSV (UTF-8 com BOM)
          content:
