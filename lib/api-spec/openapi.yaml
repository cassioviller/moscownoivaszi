    get:
      operationId: getLookbookPublicoFoto
      tags: [vestidos]
      security: []
      description: >
        Foto de um vestido DO lookbook, sem login — o token escopa: vestido
        fora da seleção é 404, mesmo existindo. Cache como na rota autenticada
        (?v= → immutable; sem → ETag).
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: vestidoId
          in: query
          required: true
          schema:
            type: string
        - name: ordem
          in: query
          required: true
          schema:
            type: integer
        - name: variante
          in: query
          required: false
          schema:
            type: string
            enum: [cheia, thumb]
            default: cheia
        - name: v
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Imagem (binário)
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Token desconhecido ou vestido fora do lookbook
        "410":
          description: Link expirado

  # ───────────────────────── Leads / Noivas ─────────────────────────
  /lojas/{lojaId}/leads:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listLeads
      tags: [leads]
      # Params no nível do GET (no path vazariam para o POST — gotcha do codegen).
      parameters:
        - name: q
          in: query
          required: false
          description: "Busca em nome da noiva/noivo e WhatsApp (dígitos com ou sem máscara)"
          schema: { type: string, maxLength: 200 }
        - name: etapa
          in: query
          required: false
          schema:
            type: string
            enum: [NOVO, INTERESSES_PREENCHIDOS, ATENDIMENTO_AGENDADO, EM_ATENDIMENTO, ORCAMENTO_ABERTO, CONTRATO_FECHADO, EM_PROVAS, RETIRADO, CASAMENTO_REALIZADO, DEVOLVIDO, PERDIDO]
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: porPagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        # A lista lê como histórico (mais antiga primeiro); a coluna do funil
        # mostra UMA página, e ali a ordem decide o que existe na tela — uma
        # noiva recém-chegada no fim de 36 cairia na página 2, invisível
        # justamente quando é mais urgente. Default preservado: os pickers de
        # agenda/orçamentos e a lista já contam com a ordem antiga.
        - name: ordem
          in: query
          required: false
          schema: { type: string, enum: [antigos, recentes], default: antigos }
      responses:
        "200":
          description: Página de leads (sem pagina/porPagina, vem tudo — os pickers dependem disso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadsPage"
    post:
      operationId: createLead
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /lojas/{lojaId}/leads/conversao:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getConversaoLeads
      tags: [leads]
      summary: Relatório de conversão — por origem (E19) e por motivo de perda (E4)
      description: >
        Dois agregados sobre os leads da loja: quantos cada origem trouxe e
        quantos fecharam (chegaram a CONTRATO_FECHADO+), e a contagem de perdas
        por motivo. O consumidor que faltava para o dado que E4/E19 já gravam.
      responses:
        "200":
          description: Agregados de conversão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversaoLeads"
