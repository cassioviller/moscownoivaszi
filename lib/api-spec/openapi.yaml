  # ───────────────────────── Leads / Noivas ─────────────────────────
  /lojas/{lojaId}/leads:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: listLeads
      tags: [leads]
      # Params no nível do GET (no path vazariam para o POST — gotcha do codegen).
      parameters:
        - name: q
          in: query
          required: false
          description: "Busca em nome da noiva/noivo e WhatsApp (dígitos com ou sem máscara)"
          schema: { type: string, maxLength: 200 }
        - name: etapa
          in: query
          required: false
          schema:
            type: string
            enum: [NOVO, INTERESSES_PREENCHIDOS, ATENDIMENTO_AGENDADO, EM_ATENDIMENTO, ORCAMENTO_ABERTO, CONTRATO_FECHADO, EM_PROVAS, RETIRADO, CASAMENTO_REALIZADO, DEVOLVIDO, PERDIDO]
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: porPagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        # Default `antigos` preservado por compatibilidade: os pickers de
        # agenda/orçamentos dependem da lista cheia em ordem estável. As vistas
        # que mostram GENTE pedem `recentes` explícito — o funil, o combobox e,
        # desde o E124 (D2/P2), a lista de /noivas: a prosa que defendia
        # antigos-primeiro para a lista não tinha medida, e o custo medido era
        # a noiva de ontem na página 34, atrás de 33 cliques.
        - name: ordem
          in: query
          required: false
          schema: { type: string, enum: [antigos, recentes], default: antigos }
      responses:
        "200":
          description: Página de leads (sem pagina/porPagina, vem tudo — os pickers dependem disso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadsPage"
    post:
      operationId: createLead
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /lojas/{lojaId}/leads/conversao:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getConversaoLeads
      tags: [leads]
      summary: Relatório de conversão — por origem (E19) e por motivo de perda (E4)
      description: >
        Dois agregados sobre os leads da loja: quantos cada origem trouxe e
        quantos fecharam (chegaram a CONTRATO_FECHADO+), e a contagem de perdas
        por motivo. O consumidor que faltava para o dado que E4/E19 já gravam.
        E142: `de`/`ate` recortam pelo dia de ENTRADA do lead (createdAt,
        dia local) — a campanha do trimestre deixa de sumir na média de 3
        anos; sem params, a história inteira, como sempre foi.
      parameters:
        - name: de
          in: query
          required: false
          description: "Início do recorte por entrada do lead (inclusivo, dia local)"
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: ate
          in: query
          required: false
          description: "Fim do recorte por entrada do lead (inclusivo, dia local)"
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Agregados de conversão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversaoLeads"
  /lojas/{lojaId}/leads/sazonalidade:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getSazonalidadeCasamentos
      tags: [leads]
      summary: Casamentos por mês — a demanda de arara dos próximos 12 meses
      description: >
        E73: a data do casamento sempre esteve no banco e ninguém somava. Conta
        os casamentos futuros por competência (leads não perdidos), separando
        os já contratados — é a curva que diz quando faltará vestido e quando
        sobrará arara.
      responses:
        "200":
          description: Casamentos por competência, de hoje a +12 meses
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [competencia, total, comContrato]
                  properties:
                    competencia: { type: string, description: "YYYY-MM" }
                    total: { type: integer, description: "Leads não perdidos com casamento no mês" }
                    comContrato: { type: integer, description: "Destes, quantos já fecharam contrato" }
  /lojas/{lojaId}/leads/parados:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getLeadsParados
      tags: [leads]
      summary: As noivas esfriando — a régua do funil, calculada no banco
      description: >
        E79: o sino (E68) e o painel (E66) baixavam a lista COMPLETA de leads
        só para achar as paradas. A mesma régua do funil-core roda aqui, sobre
        os leads em negociação, e devolve as contagens + as piores primeiro.
      responses:
        "200":
          description: Contagens por temperatura + as 10 piores
          content:
            application/json:
              schema:
                type: object
                required: [criticos, atencao, itens]
                properties:
                  criticos: { type: integer }
                  atencao: { type: integer }
                  itens:
                    type: array
                    description: As piores primeiro, no máximo 10
                    items:
                      type: object
                      required: [id, noivaNome, etapa, dias, temperatura]
                      properties:
                        id: { type: string }
                        noivaNome: { type: string }
                        etapa: { type: string }
                        dias: { type: integer }
                        temperatura: { type: string, enum: [atencao, critico] }
                        casamentoData: { type: ["string", "null"], format: date-time }

  /lojas/{lojaId}/leads/expurgo:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    post:
      operationId: expurgarLeadsPerdidos
      tags: [leads]
      summary: Anonimiza noivas PERDIDAS há mais tempo que a janela (LGPD)
      description: >
        E77: dado pessoal sem propósito é passivo. Anonimiza (nome vira
        "(anonimizada)", contato e local somem) os leads PERDIDOS cuja perda é
        mais antiga que `mesesInatividade` (padrão 24). A linha fica — o funil
        e a conversão continuam contando — e a ação deixa rastro na auditoria.
        Irreversível por desenho.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mesesInatividade: { type: integer, minimum: 6, default: 24 }
      responses:
        "200":
          description: Quantas noivas foram anonimizadas
          content:
            application/json:
              schema:
                type: object
                required: [anonimizadas]
                properties:
                  anonimizadas: { type: integer }

  /lojas/{lojaId}/leads/expurgo/previa:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: previaExpurgoLeadsPerdidos
      tags: [leads]
      summary: Quantas noivas o expurgo anonimizaria HOJE (prévia read-only)
      description: >
        E128: a confirmação da LGPD dizia O QUE se perde mas não QUANTAS — a
        contagem só chegava no toast, DEPOIS do clique irreversível; a dona
        confirmava às cegas se eram 3 ou 300. Esta prévia responde a contagem
        para o diálogo exibir ANTES, com o MESMO recorte do expurgo (PERDIDO,
        perda mais antiga que a janela, ainda não anonimizada). Não escreve
        nada.
      parameters:
        - name: mesesInatividade
          in: query
          required: false
          schema: { type: integer, minimum: 6, default: 24 }
      responses:
        "200":
          description: Quantas noivas entram no corte hoje
          content:
            application/json:
              schema:
                type: object
                required: [aAnonimizar]
                properties:
                  aAnonimizar: { type: integer }

  /lojas/{lojaId}/leads/desempenho-vendedoras:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
    get:
      operationId: getDesempenhoVendedoras
      tags: [leads]
      summary: Atendimento → contrato por vendedora, com ticket médio
      description: >
        E73: a comissão media o resultado, mas não o CAMINHO — quantos
        atendimentos cada vendedora conclui, quantos terminam em "reservou"
        (E37) e quantos viram contrato, com o ticket médio. Os desfechos e os
        contratos sempre estiveram gravados; faltava cruzar.
      responses:
        "200":
          description: Uma linha por vendedora com atividade
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [vendedoraId, nome, atendimentosConcluidos, reservou, contratos, receita]
                  properties:
                    vendedoraId: { type: string }
                    nome: { type: string }
                    atendimentosConcluidos: { type: integer }
                    reservou: { type: integer, description: "Desfecho RESERVOU" }
                    contratos: { type: integer, description: "Contratos ATIVOS fechados por ela" }
                    receita: { type: number, description: "Soma do valorTotal dos contratos ativos" }
  /lojas/{lojaId}/leads/{leadId}:
    parameters:
      - $ref: "#/components/parameters/LojaIdParam"
      - name: leadId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLead
      tags: [leads]
      responses:
        "200":
          description: Lead
