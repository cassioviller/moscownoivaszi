kind = "mobile"
previewPath = "/mobile/"
title = "Moscow Noivas Mobile"
version = "1.0.0"
id = "artifacts/moscow-noivas-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 18601

[services.development]
run = "pnpm --filter @workspace/moscow-noivas-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moscow-noivas-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/moscow-noivas-mobile", "run", "serve" ]

[services.env]
PORT = "18601"
BASE_PATH = "/mobile/"
